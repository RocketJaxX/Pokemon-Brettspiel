      { key: 'event', glyph: '⚡', label: 'Event' },
      { key: 'barrier', glyph: '🌳', label: 'Barriere' },
      { key: 'connection', glyph: '🔗', label: 'Verbindung' },
      { key: 'border', glyph: '▢', label: 'Rahmen' },
      { key: 'text', glyph: '🔤', label: 'Text' },
      { key: 'eraser', glyph: '🧹', label: 'Radierer' },
      { key: 'eyedropper', glyph: '💧', label: 'Pipette' },
      { key: 'fill', glyph: '🪣', label: 'Füllen' }
    ];
  }

  init() {
    this._buildToolGrid();
    this._buildLayerList();
    this._bindMenu();
    this._bindGlobalActions();
    this.el.boardCols.min = CONFIG.MIN_BOARD_DIMENSION;
    this.el.boardCols.max = CONFIG.MAX_BOARD_DIMENSION;
    this.el.boardRows.min = CONFIG.MIN_BOARD_DIMENSION;
    this.el.boardRows.max = CONFIG.MAX_BOARD_DIMENSION;
    this.el.boardCellSize.min = CONFIG.MIN_CELL_SIZE_CM;
    this.el.boardCellSize.max = CONFIG.MAX_CELL_SIZE_CM;
    this.refreshAll();
  }

  refreshAll() {
    this._updateToolGridActive();
    this._renderToolOptions();
    this._buildLayerList();
    this.refreshInspector();
    this.updateStatusBar();
    const bg = this.app.board.background;
    this.el.bgOpacity.value = bg ? (bg.opacity ?? 1) : 1;
    this.el.boardCols.value = this.app.board.cols;
    this.el.boardRows.value = this.app.board.rows;
    this.el.boardCellSize.value = this.app.board.cellSizeCm;
  }

  _buildToolGrid() {
    this.el.toolGrid.innerHTML = '';
    for (const def of this.TOOL_DEFS) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tool-btn';
      btn.dataset.tool = def.key;
      btn.innerHTML = `<span class="glyph">${def.glyph}</span><span>${def.label}</span>`;
      btn.addEventListener('click', () => {
        this.app.toolManager.setActiveTool(def.key);
        this.refreshAll();
      });
      this.el.toolGrid.appendChild(btn);
    }
  }

  _updateToolGridActive() {
    for (const btn of this.el.toolGrid.querySelectorAll('.tool-btn')) {
      btn.classList.toggle('active', btn.dataset.tool === this.app.toolManager.activeToolKey);
    }
  }

  _renderToolOptions() {
    const key = this.app.toolManager.activeToolKey;
    const tool = this.app.toolManager.getActiveTool();
    const body = this.el.toolOptionsBody;
    body.innerHTML = '';
    const renderers = {
      brush: () => this._renderTerrainOptions(body, tool, 'currentTerrain'),
      fill: () => this._renderTerrainOptions(body, tool, 'currentTerrain'),
      building: () => this._renderIconPaletteOptions(body, tool, 'buildings', 'currentTypeId'),
      event: () => this._renderIconPaletteOptions(body, tool, 'events', 'currentTypeId'),
      barrier: () => this._renderIconPaletteOptions(body, tool, 'barriers', 'currentTypeId'),
      connection: () => this._renderTypeRadio(body, tool, CONFIG.CONNECTION_TYPES, CONFIG.CONNECTION_LABELS, 'currentType'),
      border: () => this._renderHint(body, 'Klicke nahe einer Kachelkante, um den Rahmen dort umzuschalten.'),
      text: () => this._renderTextOptions(body, tool),
      eraser: () => this._renderEraserOptions(body, tool),
      eyedropper: () => this._renderHint(body, 'Klicke auf eine Kachel, um ihr Gelände zu übernehmen.')
    };
    (renderers[key] || (() => {}))();
  }

  _renderHint(body, text) {
    const p = document.createElement('p');
    p.className = 'hint-text';
    p.textContent = text;
    body.appendChild(p);
  }

  /** Shared swatch grid for both the terrain-color palette and the icon-based palettes, with delete support for custom entries. */
  _renderPaletteGrid(body, board, category, tool, field, renderSwatchContent) {
    const grid = document.createElement('div');
    grid.className = 'swatch-grid';
    for (const entry of board.getPalette(category)) {
      const sw = document.createElement('div');
      sw.className = 'swatch' + (tool[field] === entry.id ? ' active' : '');
      renderSwatchContent(sw, entry);
      sw.title = entry.label;
      sw.addEventListener('click', () => { tool[field] = entry.id; this._renderToolOptions(); });
      if (String(entry.id).startsWith('custom-')) {
        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'swatch-remove';
        delBtn.textContent = '×';
        delBtn.title = 'Entfernen';
        delBtn.addEventListener('click', e => {
          e.stopPropagation();
          board.removePaletteEntry(category, entry.id);
          if (tool[field] === entry.id) tool[field] = board.getPalette(category)[0]?.id ?? null;
          this.app.renderer.requestRender();
          this._renderToolOptions();
        });
        sw.appendChild(delBtn);
      }
      grid.appendChild(sw);
    }
    body.appendChild(grid);
  }

  _renderTerrainOptions(body, tool, field) {
    const board = this.app.board;
    this._renderPaletteGrid(body, board, 'terrain', tool, field, (sw, entry) => {
      sw.style.background = hexToRgba(entry.color, entry.alpha ?? 1);
    });
    const activeEntry = board.getPaletteEntry('terrain', tool[field]);
    this._renderHint(body, activeEntry ? activeEntry.label : '–');
    this._renderAddColorForm(body, board, tool, field);
  }

  _renderAddColorForm(body, board, tool, field) {
    const draft = this._newColorDraft;
    const wrap = document.createElement('div');
    wrap.className = 'add-entry-form';
    const title = document.createElement('span');
    title.className = 'field-label';
    title.textContent = 'Neue Farbe hinzufügen';
    const nameInput = document.createElement('input');
    nameInput.type = 'text'; nameInput.placeholder = 'Name'; nameInput.value = draft.label;
    nameInput.addEventListener('input', () => { draft.label = nameInput.value; });
    const colorInput = document.createElement('input');
    colorInput.type = 'color'; colorInput.value = draft.color;
    colorInput.addEventListener('input', () => { draft.color = colorInput.value; });
    const alphaLabel = document.createElement('span');
    alphaLabel.className = 'hint-text';
    alphaLabel.textContent = `Deckkraft: ${Math.round(draft.alpha * 100)}%`;
    const alphaInput = document.createElement('input');
    alphaInput.type = 'range'; alphaInput.min = '0'; alphaInput.max = '1'; alphaInput.step = '0.05';
    alphaInput.value = String(draft.alpha);
    alphaInput.addEventListener('input', () => {
      draft.alpha = parseFloat(alphaInput.value);
      alphaLabel.textContent = `Deckkraft: ${Math.round(draft.alpha * 100)}%`;
    });
    const addBtn = document.createElement('button');
    addBtn.type = 'button'; addBtn.className = 'btn'; addBtn.textContent = 'Farbe hinzufügen';
    addBtn.addEventListener('click', () => {
      const entry = board.addPaletteEntry('terrain', { label: draft.label.trim() || 'Farbe', color: draft.color, alpha: draft.alpha });
      tool[field] = entry.id;
      this._newColorDraft = { label: '', color: draft.color, alpha: 1 };
      this.app.renderer.requestRender();
      this._renderToolOptions();
    });
    wrap.append(title, nameInput, colorInput, alphaLabel, alphaInput, addBtn);
    body.appendChild(wrap);
  }

  _renderIconPaletteOptions(body, tool, category, field) {
    const board = this.app.board;
    this._renderPaletteGrid(body, board, category, tool, field, (sw, entry) => {
      sw.classList.add('icon-swatch');
      if (entry.iconUrl) {
        const img = document.createElement('img');
        img.src = entry.iconUrl; img.alt = entry.label;
        sw.appendChild(img);
      } else {
        sw.style.background = entry.color;
        sw.appendChild(document.createTextNode(entry.label.charAt(0)));
      }
    });
    const activeEntry = board.getPaletteEntry(category, tool[field]);
    if (activeEntry) this._renderIconAssignField(body, board, category, activeEntry);
    this._renderAddTypeForm(body, board, category, tool, field);
  }

  _renderIconAssignField(body, board, category, entry) {
    const field = document.createElement('label');
    field.className = 'field';
    const labelSpan = document.createElement('span');
    labelSpan.className = 'field-label';
    labelSpan.textContent = `Bild-URL für „${entry.label}“`;
    const input = document.createElement('input');
    input.type = 'url'; input.placeholder = 'https://…'; input.value = entry.iconUrl || '';
    input.addEventListener('change', () => {
      board.setPaletteEntryIcon(category, entry.id, input.value.trim() || null);
      this.app.renderer.requestRender();
      this._renderToolOptions();
    });
    field.append(labelSpan, input);
    body.appendChild(field);
  }

  _renderAddTypeForm(body, board, category, tool, field) {
    const draft = this._newTypeDrafts[category];
    const wrap = document.createElement('div');
    wrap.className = 'add-entry-form';
    const title = document.createElement('span');
    title.className = 'field-label'; title.textContent = 'Neuen Typ hinzufügen';
    const nameInput = document.createElement('input');
    nameInput.type = 'text'; nameInput.placeholder = 'Name'; nameInput.value = draft.label;
    nameInput.addEventListener('input', () => { draft.label = nameInput.value; });
    const colorInput = document.createElement('input');
    colorInput.type = 'color'; colorInput.value = draft.color;
    colorInput.addEventListener('input', () => { draft.color = colorInput.value; });
    const urlInput = document.createElement('input');
    urlInput.type = 'url'; urlInput.placeholder = 'Bild-URL (optional)'; urlInput.value = draft.iconUrl;
    urlInput.addEventListener('input', () => { draft.iconUrl = urlInput.value; });
    const addBtn = document.createElement('button');
    addBtn.type = 'button'; addBtn.className = 'btn'; addBtn.textContent = 'Typ hinzufügen';
    addBtn.addEventListener('click', () => {
      const entry = board.addPaletteEntry(category, { label: draft.label.trim() || 'Typ', color: draft.color, iconUrl: draft.iconUrl.trim() || null });
      tool[field] = entry.id;
      this._newTypeDrafts[category] = { label: '', color: draft.color, iconUrl: '' };
      this.app.renderer.requestRender();
      this._renderToolOptions();
    });
    wrap.append(title, nameInput, colorInput, urlInput, addBtn);
    body.appendChild(wrap);
  }

  _renderTypeRadio(body, tool, types, labels, field) {
    const wrap = document.createElement('div');
    wrap.className = 'radio-grid';
    for (const type of types) {
      const optLabel = document.createElement('label');
      optLabel.className = 'radio-opt';
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = `opt-${field}`;
      input.checked = tool[field] === type;
      input.addEventListener('change', () => { tool[field] = type; this._renderToolOptions(); });
      optLabel.appendChild(input);
      optLabel.appendChild(document.createTextNode(labels[type]));
      wrap.appendChild(optLabel);
    }
    body.appendChild(wrap);
  }

  _renderTextOptions(body, tool) {
    this._renderTypeRadio(body, tool, ['horizontal', 'vertical'], { horizontal: 'Horizontal', vertical: 'Vertikal' }, 'orientation');
    const activeLabel = this.app.board.getLabelById(this.app.selection.activeLabelId);
    if (activeLabel) {
      const editBtn = document.createElement('button');
      editBtn.className = 'btn';
      editBtn.textContent = 'Text bearbeiten';
      editBtn.addEventListener('click', () => { tool.editSelectedLabel(); });
      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'btn danger';
      deleteBtn.textContent = 'Beschriftung löschen';
      deleteBtn.addEventListener('click', () => { tool.deleteSelectedLabel(); this.refreshAll(); });
      body.appendChild(editBtn);
      body.appendChild(deleteBtn);
    } else {
      this._renderHint(body, 'Klicke auf eine leere Stelle, um eine neue Beschriftung zu erstellen, oder ziehe eine bestehende frei an eine neue Position.');
    }
  }

  _renderEraserOptions(body, tool) {
    const labels = {
      terrain: 'Gelände', buildings: 'Gebäude', events: 'Events', barriers: 'Barrieren',
      borders: 'Rahmen', connections: 'Verbindungen', labels: 'Beschriftungen'
    };
    this._renderTypeRadio(body, tool, CONFIG.ERASER_TARGETS, labels, 'targetLayer');
  }

  _buildLayerList() {
    this.el.layerList.innerHTML = '';
    for (const layer of this.app.layerManager.list()) {
      const row = document.createElement('div');
      row.className = 'layer-row';
      const name = document.createElement('span');
      name.className = 'layer-name';
      name.textContent = layer.name;
      const visibleBtn = document.createElement('button');
      visibleBtn.textContent = layer.visible ? '👁' : '🚫';
      visibleBtn.className = layer.visible ? 'on' : '';
      visibleBtn.title = 'Sichtbarkeit umschalten';
      visibleBtn.addEventListener('click', () => {
        this.app.layerManager.toggleVisible(layer.key);
        this.app.renderer.requestRender();
        this._buildLayerList();
      });
      const lockBtn = document.createElement('button');
      lockBtn.textContent = layer.locked ? '🔒' : '🔓';
      lockBtn.className = layer.locked ? 'locked' : '';
      lockBtn.title = 'Sperren umschalten';
      lockBtn.addEventListener('click', () => {
        this.app.layerManager.toggleLocked(layer.key);
        this._buildLayerList();
      });
      row.append(name, visibleBtn, lockBtn);
      this.el.layerList.appendChild(row);
    }
  }

  refreshInspector() {
    const sel = this.app.selection;
    const board = this.app.board;
    const body = this.el.inspectorBody;
    if (sel.tileCol == null) {
      body.innerHTML = '<span class="hint-text">Keine Kachel ausgewählt.</span>';
      return;
    }
    const tile = board.getTile(sel.tileCol, sel.tileRow);
    if (!tile) { body.innerHTML = '<span class="hint-text">Keine Kachel ausgewählt.</span>'; return; }
    const borders = CONFIG.BORDER_EDGES.filter(e => tile.borders[e]).join(', ') || '–';
    const terrainLabel = tile.terrain ? (board.getPaletteEntry('terrain', tile.terrain)?.label ?? tile.terrain) : '–';
    const buildingLabel = tile.building ? (board.getPaletteEntry('buildings', tile.building.typeId)?.label ?? tile.building.typeId) : '–';
    const eventLabel = tile.event ? (board.getPaletteEntry('events', tile.event.typeId)?.label ?? tile.event.typeId) : '–';
    const barrierLabel = tile.barrier ? (board.getPaletteEntry('barriers', tile.barrier.typeId)?.label ?? tile.barrier.typeId) : '–';
    body.innerHTML = `
      <div class="kv"><span>Position</span><b>${tile.col}, ${tile.row}</b></div>
      <div class="kv"><span>Gelände</span><b>${terrainLabel}</b></div>
      <div class="kv"><span>Gebäude</span><b>${buildingLabel}</b></div>
      <div class="kv"><span>Event</span><b>${eventLabel}</b></div>
      <div class="kv"><span>Barriere</span><b>${barrierLabel}</b></div>
      <div class="kv"><span>Rahmen</span><b>${borders}</b></div>
    `;
  }

  updateStatusBar() {
    const sel = this.app.selection;
    const board = this.app.board;
    this.el.statusCell.textContent = sel.hoverCol != null && board.isInBounds(sel.hoverCol, sel.hoverRow)
      ? `${sel.hoverCol}, ${sel.hoverRow}` : '–';
    this.el.statusZoom.textContent = `${Math.round(this.app.camera.zoom * 100)}%`;
    const def = this.TOOL_DEFS.find(t => t.key === this.app.toolManager.activeToolKey);
    this.el.statusTool.textContent = def ? def.label : '–';
    this.el.statusBoardSize.textContent = `${formatCm(board.cols * board.cellSizeCm)} × ${formatCm(board.rows * board.cellSizeCm)} cm`;
  }

  setStatusMessage(message, timeoutMs = 3000) {
    this.el.statusMessage.textContent = message;
    clearTimeout(this._statusTimer);
    if (timeoutMs > 0) this._statusTimer = setTimeout(() => { this.el.statusMessage.textContent = ''; }, timeoutMs);
  }

  _bindMenu() {
    const roots = document.querySelectorAll('.menu-root');
    for (const root of roots) {
      const btn = root.querySelector('.menu-btn');
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const wasOpen = root.classList.contains('open');
        for (const r of roots) r.classList.remove('open');
        if (!wasOpen) root.classList.add('open');
      });
    }
    document.addEventListener('click', () => { for (const r of roots) r.classList.remove('open'); });
    document.querySelectorAll('.menu-item[data-action]').forEach(item => {
      item.addEventListener('click', () => this._handleAction(item.dataset.action));
    });
  }

  _bindGlobalActions() {
    document.querySelectorAll('[data-action]:not(.menu-item)').forEach(el => {
      el.addEventListener('click', () => this._handleAction(el.dataset.action));
    });
    this.el.bgOpacity.addEventListener('input', () => {
      if (!this.app.board.background) return;
      this.app.board.background.opacity = parseFloat(this.el.bgOpacity.value);
      this.app.renderer.requestRender();
    });
    this.el.fileInputProject.addEventListener('change', async e => {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file) return;
      try {
        await this.app.storage.loadProjectFromFile(file);
        this.setStatusMessage('Projekt geladen.');
      } catch (err) {
        this.setStatusMessage('Fehler beim Laden: ' + err.message);
      }
    });
    this.el.fileInputImage.addEventListener('change', async e => {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file) return;
      const dataUrl = await readFileAsDataUrl(file);
      this.app.board.background = { src: dataUrl, opacity: 1 };
      this.app.iconCache.get(dataUrl);
      this.el.bgOpacity.value = 1;
      this.app.renderer.requestRender();
      this.setStatusMessage('Hintergrundbild geladen.');
    });
  }

  _handleAction(action) {
    const app = this.app;
    switch (action) {
      case 'new-project':
        if (window.confirm('Neues Projekt starten? Ungespeicherte Änderungen gehen verloren.')) {
          app.layerManager = new LayerManager();
          app.renderer.layerManager = app.layerManager;
          app.replaceBoard(new Board());
        }
        break;
      case 'save-json': app.storage.saveProjectAsJson(); this.setStatusMessage('JSON gespeichert.'); break;
      case 'save-html': app.storage.saveProjectAsHtml(); this.setStatusMessage('HTML gespeichert.'); break;
      case 'load-project': this.el.fileInputProject.click(); break;
      case 'load-background': this.el.fileInputImage.click(); break;
      case 'remove-background':
        app.board.background = null;
        app.renderer.requestRender();
        break;
      case 'export-png': app.exporter.exportPng(); this.setStatusMessage('PNG exportiert.'); break;
      case 'export-json': app.exporter.exportJson(); this.setStatusMessage('JSON exportiert.'); break;
      case 'export-html': app.exporter.exportHtml(); this.setStatusMessage('HTML exportiert.'); break;
      case 'undo': app.history.undo(); this.refreshAll(); app.renderer.requestRender(); break;
      case 'redo': app.history.redo(); this.refreshAll(); app.renderer.requestRender(); break;
      case 'zoom-in': app.camera.zoomAt(app.canvasEl.clientWidth / 2, app.canvasEl.clientHeight / 2, 1.2); app.renderer.requestRender(); this.updateStatusBar(); break;
      case 'zoom-out': app.camera.zoomAt(app.canvasEl.clientWidth / 2, app.canvasEl.clientHeight / 2, 1 / 1.2); app.renderer.requestRender(); this.updateStatusBar(); break;
      case 'zoom-reset': app.camera.setZoom(1, app.canvasEl.clientWidth, app.canvasEl.clientHeight); app.renderer.requestRender(); this.updateStatusBar(); break;
      case 'zoom-fit': app.camera.fitToBoard(app.board, app.canvasEl.clientWidth, app.canvasEl.clientHeight); app.renderer.requestRender(); this.updateStatusBar(); break;
      case 'apply-board-size': this._applyBoardSize(); break;
    }
  }

  _applyBoardSize() {
    const app = this.app;
    const newCols = clamp(Math.round(parseFloat(this.el.boardCols.value)) || app.board.cols, CONFIG.MIN_BOARD_DIMENSION, CONFIG.MAX_BOARD_DIMENSION);
    const newRows = clamp(Math.round(parseFloat(this.el.boardRows.value)) || app.board.rows, CONFIG.MIN_BOARD_DIMENSION, CONFIG.MAX_BOARD_DIMENSION);
    const newCellSize = clamp(parseFloat(this.el.boardCellSize.value) || app.board.cellSizeCm, CONFIG.MIN_CELL_SIZE_CM, CONFIG.MAX_CELL_SIZE_CM);
    const shrinking = newCols < app.board.cols || newRows < app.board.rows;
    if (shrinking && !window.confirm('Board verkleinern? Kacheln außerhalb der neuen Größe gehen verloren.')) {
      this.refreshAll();
      return;
    }
    app.board.resize(newCols, newRows);
    app.board.setCellSize(newCellSize);
    app.selection.clearTileSelection();
    app.history.reset();
    app.camera.fitToBoard(app.board, app.canvasEl.clientWidth, app.canvasEl.clientHeight);
    app.renderer.requestRender();
    this.refreshAll();
    this.setStatusMessage('Board aktualisiert.');
  }
}

/* =========================================================================
 * App
 * ========================================================================= */
class App {
  constructor() {
    this.canvasEl = document.getElementById('board-canvas');
    this.containerEl = document.getElementById('canvas-container');
    this.board = new Board();
    this.camera = new Camera();
    this.layerManager = new LayerManager();
    this.selection = new Selection();
    this.history = new HistoryManager(() => this.ui && this.ui.refreshAll());
    this.iconCache = new IconCache(() => this.renderer.requestRender());
    this.toolManager = new ToolManager(this);
    this.renderer = new Renderer(this.canvasEl, this.board, this.camera, this.layerManager, this.selection, this.iconCache, this.toolManager);
    this.storage = new StorageManager(this);
    this.exporter = new Exporter(this);
    this.ui = new UIController(this);
  }

  init() {
    this.toolManager.attach(this.canvasEl);
    this.ui.init();
    this._observeResize();
    this._loadEmbeddedOrAutosave();
    this.canvasEl.style.cursor = this.toolManager.getActiveTool().cursor;
    this._startAutosave();
    this._startRenderLoop();
  }

  /** Swaps in a fresh Board instance (new project, project load) and resets everything derived from it. */
  replaceBoard(newBoard) {
    this.board = newBoard;
    this.renderer.board = newBoard;
    this.selection = new Selection();
    this.renderer.selection = this.selection;
    this.history.reset();
    this.renderer.requestRender();
    this.ui.refreshAll();
  }

  _observeResize() {
    const resize = () => {
      const rect = this.containerEl.getBoundingClientRect();
      this.renderer.resizeToContainer(rect.width, rect.height);
    };
    new ResizeObserver(resize).observe(this.containerEl);
    resize();
  }

  _loadEmbeddedOrAutosave() {
    const embedded = document.getElementById('embedded-project-data');
    const raw = embedded ? embedded.textContent.trim() : 'null';
    if (raw && raw !== 'null') {
      try {
        ProjectSerializer.deserialize(this, JSON.parse(raw));
        this.camera.fitToBoard(this.board, this.canvasEl.clientWidth, this.canvasEl.clientHeight);
        return;
      } catch (err) {
        console.warn('Eingebettete Projektdaten konnten nicht geladen werden:', err);
      }
    }
    if (this.storage.hasAutosave() && this.storage.loadAutosave()) {
      this.ui.setStatusMessage('Autosave wiederhergestellt.');
    }
    this.camera.fitToBoard(this.board, this.canvasEl.clientWidth, this.canvasEl.clientHeight);
  }

  _startAutosave() {
    setInterval(() => this.storage.autosave(), CONFIG.AUTOSAVE_INTERVAL_MS);
    window.addEventListener('beforeunload', () => this.storage.autosave());
  }

  _startRenderLoop() {
    const loop = () => {
      this.renderer.renderIfNeeded();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const app = new App();
  app.init();
});
</script>
