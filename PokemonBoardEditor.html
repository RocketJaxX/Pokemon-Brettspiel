<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokémon Brettspiel Editor</title>
<style>
  :root {
    --bg-0: #17171b;
    --bg-1: #201f26;
    --bg-2: #2a2932;
    --bg-3: #34333e;
    --border: #3d3c48;
    --text: #e9e9ee;
    --text-dim: #9c9ba8;
    --accent: #5aa8e0;
    --accent-dim: #3d7aad;
    --danger: #e0796a;
    --ok: #8ccf5a;
    --radius: 6px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg-0); color: var(--text);
    font-size: 13px; user-select: none;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* ---------- Menu Bar ---------- */
  #menu-bar {
    display: flex; align-items: center; height: 38px; flex: 0 0 auto;
    background: var(--bg-2); border-bottom: 1px solid var(--border);
    padding: 0 8px; gap: 2px; position: relative; z-index: 50;
  }
  #menu-bar .brand {
    font-weight: 600; color: var(--accent); margin-right: 16px; letter-spacing: .3px;
  }
  .menu-root { position: relative; }
  .menu-btn {
    background: none; border: none; color: var(--text); padding: 7px 12px;
    cursor: pointer; border-radius: var(--radius); font-size: 13px;
  }
  .menu-btn:hover, .menu-root.open .menu-btn { background: var(--bg-3); }
  .menu-dropdown {
    display: none; position: absolute; top: 100%; left: 0; min-width: 240px;
    background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(0,0,0,.4); padding: 4px; flex-direction: column;
  }
  .menu-root.open .menu-dropdown { display: flex; }
  .menu-item {
    display: flex; justify-content: space-between; gap: 12px; padding: 7px 10px;
    border-radius: 4px; cursor: pointer; background: none; border: none; color: var(--text);
    text-align: left; font-size: 13px; width: 100%;
  }
  .menu-item:hover { background: var(--accent-dim); }
  .menu-item:disabled { color: var(--text-dim); cursor: not-allowed; background: none; }
  .menu-item .hint { color: var(--text-dim); font-size: 11px; }
  .menu-sep { height: 1px; background: var(--border); margin: 4px 2px; }

  /* ---------- Layout ---------- */
  #main-layout { flex: 1; display: flex; min-height: 0; }
  #tool-panel, #properties-panel {
    flex: 0 0 auto; background: var(--bg-1); overflow-y: auto; padding: 10px;
  }
  #tool-panel { width: 176px; border-right: 1px solid var(--border); }
  #properties-panel { width: 310px; border-left: 1px solid var(--border); }
  #canvas-container {
    flex: 1; position: relative; background: #0e0e11; overflow: hidden; min-width: 0;
  }
  #board-canvas { display: block; position: absolute; top: 0; left: 0; touch-action: none; }

  .panel-section { margin-bottom: 16px; }
  .panel-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--text-dim);
    margin: 0 0 8px 0; font-weight: 600;
  }

  /* ---------- Tool grid ---------- */
  .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .tool-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); padding: 8px 4px; cursor: pointer; font-size: 11px;
  }
  .tool-btn .glyph { font-size: 18px; line-height: 1; }
  .tool-btn:hover { background: var(--bg-3); }
  .tool-btn.active { background: var(--accent-dim); border-color: var(--accent); }

  /* ---------- Layer list ---------- */
  .layer-row {
    display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 4px;
  }
  .layer-row:hover { background: var(--bg-2); }
  .layer-row .layer-name { flex: 1; font-size: 12px; }
  .layer-row button {
    background: none; border: 1px solid transparent; color: var(--text-dim);
    cursor: pointer; border-radius: 4px; width: 24px; height: 24px; font-size: 13px;
  }
  .layer-row button:hover { background: var(--bg-3); color: var(--text); }
  .layer-row button.on { color: var(--accent); }
  .layer-row button.locked { color: var(--danger); }

  /* ---------- Form controls ---------- */
  label.field { display: block; margin-bottom: 10px; }
  label.field .field-label { display: block; margin-bottom: 4px; color: var(--text-dim); font-size: 11px; }
  select, input[type=text], input[type=number], input[type=url], input[type=range] {
    width: 100%; background: var(--bg-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 4px; padding: 6px 8px; font-size: 12px;
  }
  input[type=range] { padding: 0; }
  input[type=color] {
    width: 100%; height: 32px; padding: 2px; background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 4px; cursor: pointer;
  }
  .btn {
    background: var(--bg-3); border: 1px solid var(--border); color: var(--text);
    padding: 7px 10px; border-radius: var(--radius); cursor: pointer; font-size: 12px; width: 100%;
    margin-bottom: 6px;
  }
  .btn:hover { background: var(--accent-dim); border-color: var(--accent); }
  .btn.danger:hover { background: var(--danger); border-color: var(--danger); }
  .swatch-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .swatch {
    position: relative; aspect-ratio: 1; border-radius: 4px; border: 2px solid transparent; cursor: pointer;
    background-color: #444;
  }
  .swatch.active { border-color: var(--text); }
  .swatch.icon-swatch {
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    color: #fff; font-weight: 700; font-size: 13px; text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  .swatch.icon-swatch img { width: 100%; height: 100%; object-fit: contain; }
  .swatch-remove {
    position: absolute; top: -6px; right: -6px; width: 16px; height: 16px; border-radius: 50%;
    background: var(--danger); color: #fff; border: none; font-size: 11px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .add-entry-form {
    display: flex; flex-direction: column; gap: 6px; margin-top: 12px; padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .radio-grid { display: flex; flex-direction: column; gap: 4px; }
  .radio-opt { display: flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; }
  .kv { font-size: 11px; color: var(--text-dim); display: flex; justify-content: space-between; padding: 2px 0; }
  .kv b { color: var(--text); font-weight: 500; }
  .inspector-box {
    background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px;
  }
  .hint-text { color: var(--text-dim); font-size: 11px; line-height: 1.5; }
  .shortcut-list { display: flex; flex-direction: column; gap: 8px; }
  .shortcut-row { display: flex; flex-direction: column; gap: 3px; }
  .shortcut-keys {
    display: inline-block; align-self: flex-start; background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 4px; padding: 2px 7px; font-size: 11px; font-family: ui-monospace, Consolas, monospace; color: var(--accent);
  }
  .shortcut-desc { color: var(--text-dim); font-size: 11px; }
  .field-row { display: flex; gap: 8px; }
  .field-row > label.field { flex: 1; }

  /* ---------- Status Bar ---------- */
  #status-bar {
    flex: 0 0 auto; height: 26px; background: var(--bg-2); border-top: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 12px; gap: 18px; font-size: 11px; color: var(--text-dim);
  }
  #status-bar b { color: var(--text); font-weight: 500; }
  #status-message { margin-left: auto; color: var(--accent); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="app">

  <header id="menu-bar">
    <span class="brand">Pokémon Board Editor</span>

    <div class="menu-root" data-menu="file">
      <button class="menu-btn" type="button">Datei</button>
      <div class="menu-dropdown">
        <button class="menu-item" data-action="new-project">Neues Projekt</button>
        <div class="menu-sep"></div>
        <button class="menu-item" data-action="save-json">Projekt speichern (JSON)</button>
        <button class="menu-item" data-action="save-html">Projekt speichern (HTML)</button>
        <button class="menu-item" data-action="load-project">Projekt laden…</button>
        <div class="menu-sep"></div>
        <button class="menu-item" data-action="load-background">Hintergrundbild laden…</button>
        <div class="menu-sep"></div>
        <button class="menu-item" data-action="export-png">Export als PNG</button>
        <button class="menu-item" data-action="export-json">Export als JSON</button>
        <button class="menu-item" data-action="export-html">Export als HTML</button>
      </div>
    </div>

    <div class="menu-root" data-menu="edit">
      <button class="menu-btn" type="button">Bearbeiten</button>
      <div class="menu-dropdown">
        <button class="menu-item" data-action="undo">Rückgängig <span class="hint">Strg+Z</span></button>
        <button class="menu-item" data-action="redo">Wiederholen <span class="hint">Strg+Y</span></button>
      </div>
    </div>

    <div class="menu-root" data-menu="view">
      <button class="menu-btn" type="button">Ansicht</button>
      <div class="menu-dropdown">
        <button class="menu-item" data-action="zoom-in">Vergrößern <span class="hint">+</span></button>
        <button class="menu-item" data-action="zoom-out">Verkleinern <span class="hint">-</span></button>
        <button class="menu-item" data-action="zoom-reset">Zoom 100% <span class="hint">0</span></button>
        <button class="menu-item" data-action="zoom-fit">An Board anpassen <span class="hint">F</span></button>
      </div>
    </div>
  </header>

  <div id="main-layout">
    <aside id="tool-panel">
      <div class="panel-section">
        <h3 class="panel-title">Werkzeuge</h3>
        <div class="tool-grid" id="tool-grid"></div>
      </div>
    </aside>

    <main id="canvas-container">
      <canvas id="board-canvas"></canvas>
    </main>

    <aside id="properties-panel">
      <div class="panel-section" id="section-tool-options">
        <h3 class="panel-title">Werkzeugoptionen</h3>
        <div id="tool-options-body"></div>
      </div>
      <div class="panel-section" id="section-layers">
        <h3 class="panel-title">Ebenen</h3>
        <div id="layer-list"></div>
      </div>
      <div class="panel-section" id="section-board-properties">
        <h3 class="panel-title">Board-Eigenschaften</h3>
        <div class="field-row">
          <label class="field">
            <span class="field-label">Spalten</span>
            <input type="number" id="board-cols" min="1" step="1">
          </label>
          <label class="field">
            <span class="field-label">Reihen</span>
            <input type="number" id="board-rows" min="1" step="1">
          </label>
        </div>
        <label class="field">
          <span class="field-label">Kachelgröße (cm)</span>
          <input type="number" id="board-cell-size" min="0.1" step="0.1">
        </label>
        <button class="btn" data-action="apply-board-size">Anwenden</button>
      </div>
      <div class="panel-section" id="section-background">
        <h3 class="panel-title">Hintergrundbild</h3>
        <button class="btn" data-action="load-background">Bild laden…</button>
        <label class="field">
          <span class="field-label">Deckkraft</span>
          <input type="range" id="bg-opacity" min="0" max="1" step="0.05" value="1">
        </label>
        <button class="btn danger" data-action="remove-background">Bild entfernen</button>
      </div>
      <div class="panel-section" id="section-inspector">
        <h3 class="panel-title">Kachel-Inspektor</h3>
        <div class="inspector-box" id="inspector-body">
          <span class="hint-text">Keine Kachel ausgewählt.</span>
        </div>
      </div>
    </aside>
  </div>

  <footer id="status-bar">
    <span>Zelle: <b id="status-cell">–</b></span>
    <span>Zoom: <b id="status-zoom">100%</b></span>
    <span>Werkzeug: <b id="status-tool">–</b></span>
    <span>Board: <b id="status-board-size">40 × 60 cm</b></span>
    <span id="status-message"></span>
  </footer>

</div>

<input type="file" id="file-input-project" accept=".json,.html" hidden>
<input type="file" id="file-input-image" accept="image/*" hidden>

<script type="application/json" id="embedded-project-data">null</script>

<script>
'use strict';

/* =========================================================================
 * CONFIG
 * ========================================================================= */
const CONFIG = Object.freeze({
  BOARD_COLS: 40,
  BOARD_ROWS: 60,
  DEFAULT_CELL_SIZE_CM: 1,
  MIN_BOARD_DIMENSION: 1,
  MAX_BOARD_DIMENSION: 300,
  MIN_CELL_SIZE_CM: 0.1,
  MAX_CELL_SIZE_CM: 100,
  BASE_PIXELS_PER_CELL: 20,
  ZOOM_MIN: 0.25,
  ZOOM_MAX: 6.0,
  ZOOM_STEP: 0.12,
  AUTOSAVE_INTERVAL_MS: 30000,
  HISTORY_LIMIT: 150,
  STORAGE_KEY: 'pokemonBoardEditor.autosave.v1',
  EXPORT_DPI: 300,
  MAX_EXPORT_DIMENSION_PX: 8000,
  GRID_LINE_WIDTH_CM: 0.02,
  GRID_MAJOR_LINE_WIDTH_CM: 0.045,
  BORDER_LINE_WIDTH_CM: 0.12,
  CONNECTION_LINE_WIDTH_CM: 0.04,
  CONNECTION_MARKER_RADIUS_CM: 0.32,
  LABEL_FONT_SIZE_CM: 0.3,
  LABEL_PADDING_CM: 0.08,
  ERASER_TARGETS: ['terrain', 'buildings', 'events', 'barriers', 'zones', 'borders', 'connections', 'labels'],
  LAYER_ORDER: ['grid', 'terrain', 'zones', 'buildings', 'events', 'barriers', 'connections', 'labels'],
  LAYER_NAMES: {
    grid: 'Raster', terrain: 'Gelände', zones: 'Zonen', buildings: 'Gebäude', events: 'Events',
    barriers: 'Barrieren', connections: 'Verbindungen', labels: 'Beschriftungen'
  },
  BORDER_EDGES: ['top', 'right', 'bottom', 'left'],
  HAND_DRAWN_BARRIERS: ['tree', 'rock', 'pokeflute'],
  CONNECTION_TYPES: ['route', 'cave'],
  CONNECTION_LABELS: { route: 'Route/Stadt', cave: 'Höhle' },
  DEFAULT_TERRAIN_ALPHA: 0.6,
  ZONE_TYPES: ['route', 'city', 'cave'],
  ZONE_TYPE_LABELS: { route: 'Route', city: 'Stadt', cave: 'Höhle' },
  ZONE_BORDER_COLORS: { route: '#000000', city: '#c0392b', cave: '#6b4226' },
  ZONE_TINT_COLORS: { route: 'rgba(0,0,0,0.10)', city: 'rgba(192,57,43,0.16)', cave: 'rgba(107,66,38,0.20)' },
  ZONE_BORDER_LINE_WIDTH_CM: 0.09,
  KEYBOARD_SHORTCUTS: [
    ['Leertaste + Ziehen', 'Ansicht verschieben'],
    ['Mausrad', 'Zoomen (zur Mausposition)'],
    ['Umschalt + Mausrad', 'Horizontal verschieben'],
    ['Strg + Mausrad', 'Vertikal verschieben'],
    ['+', 'Vergrößern'],
    ['-', 'Verkleinern'],
    ['0', 'Zoom auf 100%'],
    ['F', 'An Board anpassen'],
    ['Strg+Z', 'Rückgängig'],
    ['Strg+Umschalt+Z / Strg+Y', 'Wiederholen'],
    ['Entf / Rücktaste', 'Ausgewählte Beschriftung löschen (Text-Werkzeug)'],
    ['Esc', 'Verbindung oder Auswahl abbrechen']
  ],
  /** Seed data for Board.palettes — the built-in defaults every new project starts with. */
  DEFAULT_PALETTES: {
    terrain: [
      { id: 'grass', label: 'Gras', color: '#8CCF5A', alpha: 0.6 },
      { id: 'water', label: 'Wasser', color: '#5AA8E0', alpha: 0.6 },
      { id: 'road', label: 'Straße', color: '#E8D6A8', alpha: 0.6 },
      { id: 'cave', label: 'Höhle', color: '#9A6B3F', alpha: 0.6 },
      { id: 'city', label: 'Stadt', color: '#E0796A', alpha: 0.6 }
    ],
    buildings: [
      { id: 'arena', label: 'Arena', color: '#c94f4f', iconUrl: 'https://www.pokewiki.de/images/1/18/Arena_HGSS_2.png', widthCells: 3, heightCells: 2 },
      { id: 'pokecenter', label: 'PokéCenter', color: '#4fae5c', iconUrl: 'https://www.pokewiki.de/images/9/99/HGSS_Pok%C3%A9Center.png', widthCells: 2, heightCells: 2 },
      { id: 'supermarket', label: 'PokéSupermarkt', color: '#4f7fc9', iconUrl: 'https://www.pokewiki.de/images/2/25/HGSS_Pok%C3%A9mon_Markt_Kanto-Johto.png', widthCells: 2, heightCells: 2 }
    ],
    events: [
      { id: 'trainer', label: 'Trainer', color: '#e0a13a', iconUrl: null, widthCells: 1, heightCells: 1 },
      { id: 'quest', label: 'Quest', color: '#c060d0', iconUrl: null, widthCells: 1, heightCells: 1 }
    ],
    barriers: [
      { id: 'tree', label: 'Baum', color: '#3f8f3f', iconUrl: null, widthCells: 1, heightCells: 1 },
      { id: 'rock', label: 'Felsen', color: '#8a8a8a', iconUrl: null, widthCells: 1, heightCells: 1 },
      { id: 'pokeflute', label: 'Pokéflöte', color: '#7a5aad', iconUrl: null, widthCells: 1, heightCells: 1 }
    ]
  }
});

/* =========================================================================
 * UTILITIES
 * ========================================================================= */
function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }

/** Axis-aligned bounding-box overlap test for two {col,row,width,height} rectangles. */
function rectsOverlap(a, b) {
  return a.col < b.col + b.width && a.col + a.width > b.col &&
         a.row < b.row + b.height && a.row + a.height > b.row;
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement('a');
  anchor.href = url;
  anchor.download = filename;
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function readFileAsText(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsText(file);
  });
}

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

/** Converts a #rrggbb / #rgb hex string plus an alpha value into an rgba() color string. */
function hexToRgba(hex, alpha = 1) {
  const clean = String(hex).replace('#', '');
  const full = clean.length === 3 ? clean.split('').map(c => c + c).join('') : clean;
  const value = parseInt(full, 16) || 0;
  const r = (value >> 16) & 255, g = (value >> 8) & 255, b = value & 255;
  return `rgba(${r}, ${g}, ${b}, ${clamp(alpha, 0, 1)})`;
}

/** Trims a computed cm measurement to at most 2 decimals without trailing zeros. */
function formatCm(value) { return String(Math.round(value * 100) / 100); }

/** Deep-clones the palette seed data so each Board owns independent, mutable palettes. */
function clonePalettes(source = CONFIG.DEFAULT_PALETTES) {
  return JSON.parse(JSON.stringify(source));
}

/** Rebuilds a full palette set from saved project data, falling back to defaults per category. */
function mergePalettes(data) {
  const defaults = clonePalettes();
  const merged = {};
  for (const category of Object.keys(defaults)) {
    merged[category] = Array.isArray(data?.[category]) ? data[category] : defaults[category];
  }
  return merged;
}

/** Shared, transform-independent text metrics for canvas labels. */
class LabelMetrics {
  static _ctx = document.createElement('canvas').getContext('2d');

  static measure(text, fontSizeCm) {
    const ctx = LabelMetrics._ctx;
    ctx.font = `600 ${fontSizeCm}px "Segoe UI", sans-serif`;
    const width = Math.max(0.4, ctx.measureText(text || ' ').width);
    const height = fontSizeCm * 1.35;
    return { width, height };
  }
}

/** Computes the pill-shaped bounding box (world/cell units) shared by label rendering and hit-testing. */
function computeLabelBox(label) {
  const metrics = LabelMetrics.measure(label.text, label.fontSizeCm);
  const height = metrics.height + CONFIG.LABEL_PADDING_CM * 2;
  const width = metrics.width + height;
  return { width, height, radius: height / 2 };
}

/* =========================================================================
 * DATA MODEL: Tile
 * ========================================================================= */
class Tile {
  constructor(col, row) {
    this.col = col;
    this.row = row;
    this.terrain = null;
    this.zoneId = null;
    this.borders = { top: false, right: false, bottom: false, left: false };
  }

  toJSON() {
    return {
      col: this.col, row: this.row, terrain: this.terrain, zoneId: this.zoneId,
      borders: { ...this.borders }
    };
  }

  static fromJSON(data) {
    const tile = new Tile(data.col, data.row);
    tile.terrain = data.terrain ?? null;
    tile.zoneId = data.zoneId ?? null;
    tile.borders = { top: false, right: false, bottom: false, left: false, ...(data.borders || {}) };
    return tile;
  }
}

/* =========================================================================
 * DATA MODEL: PlacedObject — a building/event/barrier instance spanning
 * one or more cells. Buildings/events/barriers are no longer embedded on
 * the Tile itself so they can occupy an arbitrary width x height footprint.
 * ========================================================================= */
class PlacedObject {
  constructor(id, category, typeId, col, row, width, height) {
    this.id = id;
    this.category = category; // 'buildings' | 'events' | 'barriers'
    this.typeId = typeId;
    this.col = col; this.row = row; // anchor = top-left cell
    this.width = width; this.height = height;
  }

  occupiesCell(col, row) {
    return col >= this.col && col < this.col + this.width && row >= this.row && row < this.row + this.height;
  }

  toJSON() {
    return { id: this.id, category: this.category, typeId: this.typeId, col: this.col, row: this.row, width: this.width, height: this.height };
  }

  static fromJSON(data) {
    return new PlacedObject(data.id, data.category, data.typeId, data.col, data.row, data.width || 1, data.height || 1);
  }
}

/** Legacy (pre-object-model) tile.building/event/barrier shape → { typeId } for migration. */
function normalizeLegacyTypedField(value) {
  if (!value) return null;
  if (value.typeId) return { typeId: value.typeId };
  if (value.type) return { typeId: value.type };
  return null;
}

/** Converts old saved projects (building/event/barrier embedded on tiles) into 1x1 PlacedObjects. */
function migrateLegacyObjects(board, tilesData) {
  const objects = [];
  for (const tileData of tilesData) {
    if (!board.isInBounds(tileData.col, tileData.row)) continue;
    for (const [field, category] of [['building', 'buildings'], ['event', 'events'], ['barrier', 'barriers']]) {
      const legacy = normalizeLegacyTypedField(tileData[field]);
      if (legacy) objects.push(new PlacedObject(board.generateId(), category, legacy.typeId, tileData.col, tileData.row, 1, 1));
    }
  }
  return objects;
}

/* =========================================================================
 * DATA MODEL: Zone — groups tiles into a named route/city/cave area with
 * an auto-computed border, a tinted fill, and a draggable name+level label.
 * ========================================================================= */
class Zone {
  constructor(id, type, name) {
    this.id = id;
    this.type = type; // 'route' | 'city' | 'cave'
    this.name = name;
    this.levelMin = null;
    this.levelMax = null;
    this.label = { x: 0, y: 0, orientation: 'horizontal' };
    this.labelPlaced = false;
  }

  toJSON() {
    return {
      id: this.id, type: this.type, name: this.name, levelMin: this.levelMin, levelMax: this.levelMax,
      label: { ...this.label }, labelPlaced: this.labelPlaced
    };
  }

  static fromJSON(data) {
    const zone = new Zone(data.id, data.type, data.name);
    zone.levelMin = data.levelMin ?? null;
    zone.levelMax = data.levelMax ?? null;
    zone.label = { x: 0, y: 0, orientation: 'horizontal', ...(data.label || {}) };
    zone.labelPlaced = !!data.labelPlaced;
    return zone;
  }
}

/* =========================================================================
 * DATA MODEL: Connection
 * ========================================================================= */
class Connection {
  constructor(id, fromCol, fromRow, toCol, toRow, type) {
    this.id = id;
    this.fromCol = fromCol; this.fromRow = fromRow;
    this.toCol = toCol; this.toRow = toRow;
    this.type = type;
  }

  touches(col, row) {
    return (this.fromCol === col && this.fromRow === row) || (this.toCol === col && this.toRow === row);
  }

  toJSON() {
    return { id: this.id, fromCol: this.fromCol, fromRow: this.fromRow, toCol: this.toCol, toRow: this.toRow, type: this.type };
  }

  static fromJSON(data) {
    return new Connection(data.id, data.fromCol, data.fromRow, data.toCol, data.toRow, data.type);
  }
}

/* =========================================================================
 * DATA MODEL: Label
 * ========================================================================= */
class Label {
  constructor(id, x, y, text, orientation = 'horizontal') {
    this.id = id;
    this.x = x; this.y = y; // world cell units, top-left anchor of the pill's local frame
    this.text = text;
    this.orientation = orientation; // 'horizontal' | 'vertical'
    this.fontSizeCm = CONFIG.LABEL_FONT_SIZE_CM;
  }

  toJSON() {
    return { id: this.id, x: this.x, y: this.y, text: this.text, orientation: this.orientation, fontSizeCm: this.fontSizeCm };
  }

  static fromJSON(data) {
    const label = new Label(data.id, data.x, data.y, data.text, data.orientation);
    label.fontSizeCm = data.fontSizeCm || CONFIG.LABEL_FONT_SIZE_CM;
    return label;
  }
}

/* =========================================================================
 * DATA MODEL: Board
 * ========================================================================= */
class Board {
  constructor(cols = CONFIG.BOARD_COLS, rows = CONFIG.BOARD_ROWS, cellSizeCm = CONFIG.DEFAULT_CELL_SIZE_CM) {
    this.cols = cols;
    this.rows = rows;
    this.cellSizeCm = cellSizeCm;
    this.tiles = [];
    this.objects = [];
    this.zones = [];
    this.connections = [];
    this.labels = [];
    this.background = null; // { src, opacity }
    this.palettes = clonePalettes();
    this._nextId = 1;
    this._initTiles();
  }

  _initTiles() {
    this.tiles = new Array(this.cols * this.rows);
    for (let row = 0; row < this.rows; row++) {
      for (let col = 0; col < this.cols; col++) {
        this.tiles[row * this.cols + col] = new Tile(col, row);
      }
    }
  }

  isInBounds(col, row) {
    return col >= 0 && row >= 0 && col < this.cols && row < this.rows;
  }

  getTile(col, row) {
    if (!this.isInBounds(col, row)) return null;
    return this.tiles[row * this.cols + col];
  }

  forEachTileInRange(colStart, rowStart, colEnd, rowEnd, callback) {
    for (let row = rowStart; row <= rowEnd; row++) {
      const base = row * this.cols;
      for (let col = colStart; col <= colEnd; col++) {
        callback(this.tiles[base + col]);
      }
    }
  }

  generateId() { return this._nextId++; }

  /** Resizes the grid in place, preserving tiles that still fall within the new bounds. */
  resize(newCols, newRows) {
    const oldCols = this.cols, oldRows = this.rows, oldTiles = this.tiles;
    const newTiles = new Array(newCols * newRows);
    for (let row = 0; row < newRows; row++) {
      for (let col = 0; col < newCols; col++) {
        const preserved = (col < oldCols && row < oldRows) ? oldTiles[row * oldCols + col] : null;
        newTiles[row * newCols + col] = preserved || new Tile(col, row);
      }
    }
    this.cols = newCols;
    this.rows = newRows;
    this.tiles = newTiles;
    this.connections = this.connections.filter(c => this.isInBounds(c.fromCol, c.fromRow) && this.isInBounds(c.toCol, c.toRow));
    this.objects = this.objects.filter(o => o.col + o.width <= newCols && o.row + o.height <= newRows);
  }

  setCellSize(cellSizeCm) {
    this.cellSizeCm = clamp(cellSizeCm, CONFIG.MIN_CELL_SIZE_CM, CONFIG.MAX_CELL_SIZE_CM);
  }

  /** True if a category+footprint fits on the board without overlapping an existing object of the same category. */
  canPlaceObject(category, col, row, width, height) {
    if (col < 0 || row < 0 || col + width > this.cols || row + height > this.rows) return false;
    const candidate = { col, row, width, height };
    return !this.objects.some(obj => obj.category === category && rectsOverlap(obj, candidate));
  }

  removeObjectById(id) {
    const index = this.objects.findIndex(o => o.id === id);
    if (index === -1) return null;
    return this.objects.splice(index, 1)[0];
  }

  insertObject(obj, index = this.objects.length) { this.objects.splice(index, 0, obj); }

  findObjectAt(category, col, row) {
    for (let i = this.objects.length - 1; i >= 0; i--) {
      const obj = this.objects[i];
      if (obj.category === category && obj.occupiesCell(col, row)) return obj;
    }
    return null;
  }

  addZone(type, name) {
    const zone = new Zone(this.generateId(), type, name);
    this.zones.push(zone);
    return zone;
  }

  getZoneById(id) { return this.zones.find(z => z.id === id) || null; }

  removeZoneById(id) {
    const index = this.zones.findIndex(z => z.id === id);
    if (index === -1) return null;
    const [zone] = this.zones.splice(index, 1);
    for (const tile of this.tiles) { if (tile.zoneId === zone.id) tile.zoneId = null; }
    return zone;
  }

  /** Average position of a zone's member tiles, used to auto-place its label the first time it gets tiles. */
  computeZoneCentroid(zoneId) {
    let sumCol = 0, sumRow = 0, count = 0;
    for (const tile of this.tiles) {
      if (tile.zoneId === zoneId) { sumCol += tile.col + 0.5; sumRow += tile.row + 0.5; count++; }
    }
    return count ? { x: sumCol / count, y: sumRow / count } : null;
  }

  addConnection(fromCol, fromRow, toCol, toRow, type) {
    const connection = new Connection(this.generateId(), fromCol, fromRow, toCol, toRow, type);
    this.connections.push(connection);
    return connection;
  }

  removeConnectionById(id) {
    const index = this.connections.findIndex(c => c.id === id);
    if (index === -1) return null;
    return this.connections.splice(index, 1)[0];
  }

  insertConnection(connection, index = this.connections.length) {
    this.connections.splice(index, 0, connection);
  }

  findConnectionAt(col, row) {
    for (let i = this.connections.length - 1; i >= 0; i--) {
      if (this.connections[i].touches(col, row)) return this.connections[i];
    }
    return null;
  }

  addLabel(x, y, text, orientation) {
    const label = new Label(this.generateId(), x, y, text, orientation);
    this.labels.push(label);
    return label;
  }

  removeLabelById(id) {
    const index = this.labels.findIndex(l => l.id === id);
    if (index === -1) return null;
    return this.labels.splice(index, 1)[0];
  }

  insertLabel(label, index = this.labels.length) {
    this.labels.splice(index, 0, label);
  }

  getLabelById(id) { return this.labels.find(l => l.id === id) || null; }

  getPalette(category) { return this.palettes[category] || []; }

  getPaletteEntry(category, id) { return this.palettes[category]?.find(e => e.id === id) || null; }

  addPaletteEntry(category, { label, color, alpha = 1, iconUrl = null, widthCells = 1, heightCells = 1 }) {
    const entry = { id: `custom-${this.generateId()}`, label, color, iconUrl };
    if (category === 'terrain') entry.alpha = alpha;
    else { entry.widthCells = widthCells; entry.heightCells = heightCells; }
    this.palettes[category].push(entry);
    return entry;
  }

  setPaletteEntryIcon(category, id, iconUrl) {
    const entry = this.getPaletteEntry(category, id);
    if (entry) entry.iconUrl = iconUrl;
  }

  removePaletteEntry(category, id) {
    if (!String(id).startsWith('custom-')) return; // built-in defaults are protected
    const list = this.palettes[category];
    const index = list.findIndex(e => e.id === id);
    if (index !== -1) list.splice(index, 1);
  }

  toJSON() {
    return {
      cols: this.cols, rows: this.rows, cellSizeCm: this.cellSizeCm,
      tiles: this.tiles.map(t => t.toJSON()),
      objects: this.objects.map(o => o.toJSON()),
      zones: this.zones.map(z => z.toJSON()),
      connections: this.connections.map(c => c.toJSON()),
      labels: this.labels.map(l => l.toJSON()),
      background: this.background,
      palettes: this.palettes,
      nextId: this._nextId
    };
  }

  static fromJSON(data) {
    const board = new Board(data.cols || CONFIG.BOARD_COLS, data.rows || CONFIG.BOARD_ROWS, data.cellSizeCm || CONFIG.DEFAULT_CELL_SIZE_CM);
    // Restore the id counter before any generateId() calls below (legacy migration needs fresh ids that don't collide).
    board._nextId = data.nextId || 1;
    if (Array.isArray(data.tiles)) {
      for (const tileData of data.tiles) {
        if (board.isInBounds(tileData.col, tileData.row)) {
          board.tiles[tileData.row * board.cols + tileData.col] = Tile.fromJSON(tileData);
        }
      }
    }
    if (Array.isArray(data.objects)) {
      board.objects = data.objects.map(PlacedObject.fromJSON);
    } else if (Array.isArray(data.tiles)) {
      board.objects = migrateLegacyObjects(board, data.tiles);
    }
    board.zones = (data.zones || []).map(Zone.fromJSON);
    board.connections = (data.connections || []).map(Connection.fromJSON);
    board.labels = (data.labels || []).map(Label.fromJSON);
    board.background = data.background || null;
    board.palettes = mergePalettes(data.palettes);
    return board;
  }
}

/* =========================================================================
 * Camera
 * ========================================================================= */
class Camera {
  constructor() {
    this.offsetX = 40;
    this.offsetY = 40;
    this.zoom = 1;
  }

  get pixelsPerCell() { return this.zoom * CONFIG.BASE_PIXELS_PER_CELL; }

  worldToScreen(xCell, yCell) {
    return { x: xCell * this.pixelsPerCell + this.offsetX, y: yCell * this.pixelsPerCell + this.offsetY };
  }

  screenToWorld(xPx, yPx) {
    return { x: (xPx - this.offsetX) / this.pixelsPerCell, y: (yPx - this.offsetY) / this.pixelsPerCell };
  }

  pan(dxPx, dyPx) {
    this.offsetX += dxPx;
    this.offsetY += dyPx;
  }

  zoomAt(screenX, screenY, factor) {
    const before = this.screenToWorld(screenX, screenY);
    this.zoom = clamp(this.zoom * factor, CONFIG.ZOOM_MIN, CONFIG.ZOOM_MAX);
    const after = this.worldToScreen(before.x, before.y);
    this.offsetX += screenX - after.x;
    this.offsetY += screenY - after.y;
  }

  setZoom(zoom, canvasWidth, canvasHeight) {
    this.zoomAt(canvasWidth / 2, canvasHeight / 2, clamp(zoom, CONFIG.ZOOM_MIN, CONFIG.ZOOM_MAX) / this.zoom);
  }

  fitToBoard(board, canvasWidth, canvasHeight) {
    const margin = 32;
    const scaleX = (canvasWidth - margin * 2) / (board.cols * CONFIG.BASE_PIXELS_PER_CELL);
    const scaleY = (canvasHeight - margin * 2) / (board.rows * CONFIG.BASE_PIXELS_PER_CELL);
    this.zoom = clamp(Math.min(scaleX, scaleY), CONFIG.ZOOM_MIN, CONFIG.ZOOM_MAX);
    const boardWidthPx = board.cols * this.pixelsPerCell;
    const boardHeightPx = board.rows * this.pixelsPerCell;
    this.offsetX = (canvasWidth - boardWidthPx) / 2;
    this.offsetY = (canvasHeight - boardHeightPx) / 2;
  }

  getVisibleCellRange(board, canvasWidth, canvasHeight) {
    const topLeft = this.screenToWorld(0, 0);
    const bottomRight = this.screenToWorld(canvasWidth, canvasHeight);
    return {
      colStart: clamp(Math.floor(topLeft.x) - 1, 0, board.cols - 1),
      rowStart: clamp(Math.floor(topLeft.y) - 1, 0, board.rows - 1),
      colEnd: clamp(Math.ceil(bottomRight.x) + 1, 0, board.cols - 1),
      rowEnd: clamp(Math.ceil(bottomRight.y) + 1, 0, board.rows - 1)
    };
  }
}

/* =========================================================================
 * LayerManager
 * ========================================================================= */
class LayerManager {
  constructor() {
    this.layers = new Map();
    for (const key of CONFIG.LAYER_ORDER) {
      this.layers.set(key, { key, name: CONFIG.LAYER_NAMES[key], visible: true, locked: false });
    }
  }

  isVisible(key) { return this.layers.get(key)?.visible ?? true; }
  isLocked(key) { return this.layers.get(key)?.locked ?? false; }

  setVisible(key, value) {
    const layer = this.layers.get(key);
    if (layer) layer.visible = value;
  }

  setLocked(key, value) {
    const layer = this.layers.get(key);
    if (layer) layer.locked = value;
  }

  toggleVisible(key) { this.setVisible(key, !this.isVisible(key)); }
  toggleLocked(key) { this.setLocked(key, !this.isLocked(key)); }

  list() { return CONFIG.LAYER_ORDER.map(key => this.layers.get(key)); }

  toJSON() {
    const out = {};
    for (const layer of this.layers.values()) out[layer.key] = { visible: layer.visible, locked: layer.locked };
    return out;
  }

  static fromJSON(data) {
    const manager = new LayerManager();
    if (data) {
      for (const key of CONFIG.LAYER_ORDER) {
        if (data[key]) {
          manager.setVisible(key, data[key].visible !== false);
          manager.setLocked(key, !!data[key].locked);
        }
      }
    }
    return manager;
  }
}

/* =========================================================================
 * Selection
 * ========================================================================= */
class Selection {
  constructor() {
    this.hoverCol = null;
    this.hoverRow = null;
    this.tileCol = null;
    this.tileRow = null;
    this.connectionDraft = null; // { col, row }
    this.activeLabelId = null;
    this.draggingLabel = false;
    this.activeZoneId = null;
  }

  setHover(col, row) { this.hoverCol = col; this.hoverRow = row; }

  selectTile(col, row) { this.tileCol = col; this.tileRow = row; }

  clearTileSelection() { this.tileCol = null; this.tileRow = null; }

  startConnectionDraft(col, row) { this.connectionDraft = { col, row }; }

  clearConnectionDraft() { this.connectionDraft = null; }

  selectLabel(id) { this.activeLabelId = id; }

  clearLabelSelection() { this.activeLabelId = null; this.draggingLabel = false; }

  selectZone(id) { this.activeZoneId = id; }

  clearZoneSelection() { this.activeZoneId = null; }
}

/* =========================================================================
 * History (Command Pattern)
 * ========================================================================= */
class BatchCommand {
  constructor(commands) { this.commands = commands; }
  redo() { for (const cmd of this.commands) cmd.redo(); }
  undo() { for (let i = this.commands.length - 1; i >= 0; i--) this.commands[i].undo(); }
}

function makeSetFieldCommand(target, field, newValue) {
  const oldValue = target[field];
  return { redo() { target[field] = newValue; }, undo() { target[field] = oldValue; } };
}

function makeSetBorderCommand(tile, edge, newValue) {
  const oldValue = tile.borders[edge];
  return { redo() { tile.borders[edge] = newValue; }, undo() { tile.borders[edge] = oldValue; } };
}

function makeAddConnectionCommand(board, connection) {
  return {
    redo() { board.insertConnection(connection); },
    undo() { board.removeConnectionById(connection.id); }
  };
}

function makeRemoveConnectionCommand(board, connection) {
  let index = board.connections.indexOf(connection);
  return {
    redo() { index = board.connections.indexOf(connection); board.removeConnectionById(connection.id); },
    undo() { board.insertConnection(connection, index); }
  };
}

function makeAddLabelCommand(board, label) {
  return {
    redo() { board.insertLabel(label); },
    undo() { board.removeLabelById(label.id); }
  };
}

function makeRemoveLabelCommand(board, label) {
  let index = board.labels.indexOf(label);
  return {
    redo() { index = board.labels.indexOf(label); board.removeLabelById(label.id); },
    undo() { board.insertLabel(label, index); }
  };
}

function makeMoveLabelCommand(label, oldX, oldY, newX, newY) {
  return {
    redo() { label.x = newX; label.y = newY; },
    undo() { label.x = oldX; label.y = oldY; }
  };
}

function makeAddObjectCommand(board, obj) {
  return {
    redo() { board.insertObject(obj); },
    undo() { board.removeObjectById(obj.id); }
  };
}

function makeRemoveObjectCommand(board, obj) {
  let index = board.objects.indexOf(obj);
  return {
    redo() { index = board.objects.indexOf(obj); board.removeObjectById(obj.id); },
    undo() { board.insertObject(obj, index); }
  };
}

function makeMoveZoneLabelCommand(zone, oldX, oldY, newX, newY) {
  return {
    redo() { zone.label.x = newX; zone.label.y = newY; },
    undo() { zone.label.x = oldX; zone.label.y = oldY; }
  };
}

class HistoryManager {
  constructor(onChange) {
    this.undoStack = [];
    this.redoStack = [];
    this.onChange = onChange || (() => {});
  }

  /** Applies the command and records it. Use for single, atomic edits. */
  execute(command) {
    command.redo();
    this._push(command);
  }

  /** Records an already-applied command (e.g. after live drag painting). */
  record(command) {
    this._push(command);
  }

  _push(command) {
    this.undoStack.push(command);
    if (this.undoStack.length > CONFIG.HISTORY_LIMIT) this.undoStack.shift();
    this.redoStack.length = 0;
    this.onChange();
  }

  undo() {
    const command = this.undoStack.pop();
    if (!command) return;
    command.undo();
    this.redoStack.push(command);
    this.onChange();
  }

  redo() {
    const command = this.redoStack.pop();
    if (!command) return;
    command.redo();
    this.undoStack.push(command);
    this.onChange();
  }

  canUndo() { return this.undoStack.length > 0; }
  canRedo() { return this.redoStack.length > 0; }

  reset() {
    this.undoStack.length = 0;
    this.redoStack.length = 0;
    this.onChange();
  }
}

/* =========================================================================
 * IconCache
 * ========================================================================= */
class IconCache {
  constructor(onLoad) {
    this.cache = new Map();
    this.onLoad = onLoad || (() => {});
  }

  get(url) {
    if (!url) return null;
    let entry = this.cache.get(url);
    if (!entry) {
      entry = { image: new Image(), loaded: false, failed: false };
      entry.image.onload = () => { entry.loaded = true; this.onLoad(); };
      entry.image.onerror = () => { entry.failed = true; };
      entry.image.src = url;
      this.cache.set(url, entry);
    }
    return entry;
  }
}

/* =========================================================================
 * Renderer
 * ========================================================================= */
class Renderer {
  constructor(canvas, board, camera, layerManager, selection, iconCache, toolManager) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.board = board;
    this.camera = camera;
    this.layerManager = layerManager;
    this.selection = selection;
    this.iconCache = iconCache;
    this.toolManager = toolManager;
    this.dirty = true;
  }

  requestRender() { this.dirty = true; }

  renderIfNeeded() {
    if (!this.dirty) return;
    this.render();
    this.dirty = false;
  }

  resizeToContainer(cssWidth, cssHeight) {
    const dpr = window.devicePixelRatio || 1;
    this.canvas.style.width = cssWidth + 'px';
    this.canvas.style.height = cssHeight + 'px';
    this.canvas.width = Math.max(1, Math.round(cssWidth * dpr));
    this.canvas.height = Math.max(1, Math.round(cssHeight * dpr));
    this.requestRender();
  }

  render() {
    const dpr = window.devicePixelRatio || 1;
    this._paint(this.ctx, this.canvas.width, this.canvas.height, this.camera, dpr, false);
  }

  /** Renders the full board (no culling, no interactive overlays) into an offscreen context. */
  renderExport(ctx, canvasWidth, canvasHeight, camera) {
    this._paint(ctx, canvasWidth, canvasHeight, camera, 1, true);
  }

  _paint(ctx, canvasWidthDevice, canvasHeightDevice, camera, dpr, exportMode) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvasWidthDevice, canvasHeightDevice);
    ctx.fillStyle = '#0e0e11';
    ctx.fillRect(0, 0, canvasWidthDevice, canvasHeightDevice);

    const scale = camera.pixelsPerCell * dpr;
    ctx.setTransform(scale, 0, 0, scale, camera.offsetX * dpr, camera.offsetY * dpr);

    const cssWidth = canvasWidthDevice / dpr;
    const cssHeight = canvasHeightDevice / dpr;
    const range = exportMode
      ? { colStart: 0, rowStart: 0, colEnd: this.board.cols - 1, rowEnd: this.board.rows - 1 }
      : camera.getVisibleCellRange(this.board, cssWidth, cssHeight);

    this._drawBoardBackdrop(ctx);
    this._drawBackgroundImage(ctx);
    if (this.layerManager.isVisible('grid')) this._drawGrid(ctx);
    if (this.layerManager.isVisible('terrain')) this._drawTerrain(ctx, range);
    if (this.layerManager.isVisible('zones')) this._drawZoneFill(ctx, range);
    this._drawBorders(ctx, range);
    if (this.layerManager.isVisible('buildings')) this._drawBuildings(ctx, range);
    if (this.layerManager.isVisible('events')) this._drawEvents(ctx, range);
    if (this.layerManager.isVisible('barriers')) this._drawBarriers(ctx, range);
    if (this.layerManager.isVisible('zones')) this._drawZoneBorders(ctx, range);
    if (this.layerManager.isVisible('connections')) this._drawConnections(ctx);
    if (this.layerManager.isVisible('labels')) this._drawLabels(ctx);
    if (this.layerManager.isVisible('zones')) this._drawZoneLabels(ctx);

    if (!exportMode) {
      this._drawSelection(ctx);
      this._drawToolOverlay(ctx);
    }
  }

  _drawBoardBackdrop(ctx) {
    ctx.fillStyle = '#f4f0e6';
    ctx.fillRect(0, 0, this.board.cols, this.board.rows);
  }

  _drawBackgroundImage(ctx) {
    const bg = this.board.background;
    if (!bg || !bg.src) return;
    const entry = this.iconCache.get(bg.src);
    if (!entry || !entry.loaded) return;
    ctx.save();
    ctx.globalAlpha = bg.opacity ?? 1;
    ctx.drawImage(entry.image, 0, 0, this.board.cols, this.board.rows);
    ctx.restore();
  }

  _drawGrid(ctx) {
    ctx.save();
    ctx.strokeStyle = 'rgba(0,0,0,0.16)';
    ctx.lineWidth = CONFIG.GRID_LINE_WIDTH_CM;
    ctx.beginPath();
    for (let col = 0; col <= this.board.cols; col++) {
      ctx.moveTo(col, 0); ctx.lineTo(col, this.board.rows);
    }
    for (let row = 0; row <= this.board.rows; row++) {
      ctx.moveTo(0, row); ctx.lineTo(this.board.cols, row);
    }
    ctx.stroke();

    ctx.strokeStyle = 'rgba(0,0,0,0.32)';
    ctx.lineWidth = CONFIG.GRID_MAJOR_LINE_WIDTH_CM;
    ctx.beginPath();
    for (let col = 0; col <= this.board.cols; col += 10) { ctx.moveTo(col, 0); ctx.lineTo(col, this.board.rows); }
    for (let row = 0; row <= this.board.rows; row += 10) { ctx.moveTo(0, row); ctx.lineTo(this.board.cols, row); }
    ctx.stroke();
    ctx.restore();
  }

  _drawTerrain(ctx, range) {
    this.board.forEachTileInRange(range.colStart, range.rowStart, range.colEnd, range.rowEnd, tile => {
      if (!tile.terrain) return;
      const def = this.board.getPaletteEntry('terrain', tile.terrain);
      ctx.fillStyle = def ? hexToRgba(def.color, def.alpha ?? 1) : 'rgba(150,150,150,0.5)';
      ctx.fillRect(tile.col, tile.row, 1, 1);
    });
  }

  _drawBorders(ctx, range) {
    ctx.save();
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = CONFIG.BORDER_LINE_WIDTH_CM;
    ctx.lineCap = 'square';
    ctx.beginPath();
    this.board.forEachTileInRange(range.colStart, range.rowStart, range.colEnd, range.rowEnd, tile => {
      const b = tile.borders;
      const x = tile.col, y = tile.row;
      if (b.top) { ctx.moveTo(x, y); ctx.lineTo(x + 1, y); }
      if (b.right) { ctx.moveTo(x + 1, y); ctx.lineTo(x + 1, y + 1); }
      if (b.bottom) { ctx.moveTo(x, y + 1); ctx.lineTo(x + 1, y + 1); }
      if (b.left) { ctx.moveTo(x, y); ctx.lineTo(x, y + 1); }
    });
    ctx.stroke();
    ctx.restore();
  }

  _drawBuildings(ctx, range) {
    for (const obj of this.board.objects) {
      if (obj.category !== 'buildings' || !this._objectIntersectsRange(obj, range)) continue;
      this._drawObjectIcon(ctx, obj, this.board.getPaletteEntry('buildings', obj.typeId), 'rect');
    }
  }

  _drawEvents(ctx, range) {
    for (const obj of this.board.objects) {
      if (obj.category !== 'events' || !this._objectIntersectsRange(obj, range)) continue;
      this._drawObjectIcon(ctx, obj, this.board.getPaletteEntry('events', obj.typeId), 'circle');
    }
  }

  _drawBarriers(ctx, range) {
    for (const obj of this.board.objects) {
      if (obj.category !== 'barriers' || !this._objectIntersectsRange(obj, range)) continue;
      const def = this.board.getPaletteEntry('barriers', obj.typeId);
      if (def?.iconUrl) {
        const entry = this.iconCache.get(def.iconUrl);
        if (entry?.loaded) {
          const inset = 0.06;
          ctx.drawImage(entry.image, obj.col + inset, obj.row + inset, obj.width - inset * 2, obj.height - inset * 2);
          continue;
        }
      }
      if (def && CONFIG.HAND_DRAWN_BARRIERS.includes(def.id)) { this._drawBarrierGlyph(ctx, obj, def.id); continue; }
      this._drawObjectIcon(ctx, obj, def, 'circle');
    }
  }

  _objectIntersectsRange(obj, range) {
    return obj.col < range.colEnd + 1 && obj.col + obj.width > range.colStart &&
           obj.row < range.rowEnd + 1 && obj.row + obj.height > range.rowStart;
  }

  /** Draws a palette entry's icon (if loaded) or a colored fallback shape with its initial letter, across the object's full footprint. */
  _drawObjectIcon(ctx, obj, def, shape) {
    const entry = def?.iconUrl ? this.iconCache.get(def.iconUrl) : null;
    const inset = 0.06;
    if (entry && entry.loaded) {
      ctx.drawImage(entry.image, obj.col + inset, obj.row + inset, obj.width - inset * 2, obj.height - inset * 2);
      return;
    }
    ctx.save();
    ctx.fillStyle = def?.color || '#888888';
    const cx = obj.col + obj.width / 2, cy = obj.row + obj.height / 2;
    if (shape === 'circle') {
      ctx.beginPath(); ctx.ellipse(cx, cy, obj.width * 0.42, obj.height * 0.42, 0, 0, Math.PI * 2); ctx.fill();
    } else {
      const rectInset = Math.min(obj.width, obj.height) * 0.1;
      ctx.beginPath();
      ctx.roundRect
        ? ctx.roundRect(obj.col + rectInset, obj.row + rectInset, obj.width - rectInset * 2, obj.height - rectInset * 2, 0.1)
        : ctx.rect(obj.col + inset, obj.row + inset, obj.width - inset * 2, obj.height - inset * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#ffffff';
    const fontSize = Math.min(obj.width, obj.height) * 0.5;
    ctx.font = `700 ${fontSize}px "Segoe UI", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText((def?.label || '?').charAt(0), cx, cy + fontSize * 0.04);
    ctx.restore();
  }

  _drawBarrierGlyph(ctx, obj, type) {
    const cx = obj.col + obj.width / 2, cy = obj.row + obj.height / 2;
    const scale = Math.min(obj.width, obj.height);
    ctx.save();
    if (type === 'tree') {
      ctx.fillStyle = '#6b4226'; ctx.fillRect(cx - 0.06 * scale, cy, 0.12 * scale, 0.42 * scale);
      ctx.fillStyle = '#3f8f3f';
      ctx.beginPath(); ctx.arc(cx, cy - 0.05 * scale, 0.34 * scale, 0, Math.PI * 2); ctx.fill();
    } else if (type === 'rock') {
      ctx.fillStyle = '#8a8a8a';
      ctx.beginPath();
      ctx.moveTo(cx - 0.36 * scale, cy + 0.3 * scale); ctx.lineTo(cx - 0.28 * scale, cy - 0.2 * scale); ctx.lineTo(cx, cy - 0.34 * scale);
      ctx.lineTo(cx + 0.3 * scale, cy - 0.16 * scale); ctx.lineTo(cx + 0.34 * scale, cy + 0.3 * scale); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#5a5a5a'; ctx.lineWidth = 0.03 * scale; ctx.stroke();
    } else if (type === 'pokeflute') {
      ctx.strokeStyle = '#c9a24a'; ctx.lineWidth = 0.14 * scale; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cx - 0.32 * scale, cy + 0.28 * scale); ctx.lineTo(cx + 0.32 * scale, cy - 0.28 * scale); ctx.stroke();
      ctx.fillStyle = '#7a5aad';
      ctx.beginPath(); ctx.arc(cx + 0.32 * scale, cy - 0.28 * scale, 0.1 * scale, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  _drawZoneFill(ctx, range) {
    this.board.forEachTileInRange(range.colStart, range.rowStart, range.colEnd, range.rowEnd, tile => {
      if (!tile.zoneId) return;
      const zone = this.board.getZoneById(tile.zoneId);
      if (!zone) return;
      ctx.fillStyle = CONFIG.ZONE_TINT_COLORS[zone.type] || 'rgba(255,255,255,0.08)';
      ctx.fillRect(tile.col, tile.row, 1, 1);
    });
  }

  _drawZoneBorders(ctx, range) {
    ctx.save();
    ctx.lineWidth = CONFIG.ZONE_BORDER_LINE_WIDTH_CM;
    this.board.forEachTileInRange(range.colStart, range.rowStart, range.colEnd, range.rowEnd, tile => {
      if (!tile.zoneId) return;
      const zone = this.board.getZoneById(tile.zoneId);
      if (!zone) return;
      const neighborSameZone = (c, r) => this.board.getTile(c, r)?.zoneId === tile.zoneId;
      const x = tile.col, y = tile.row;
      ctx.strokeStyle = CONFIG.ZONE_BORDER_COLORS[zone.type] || '#333333';
      ctx.beginPath();
      if (!neighborSameZone(x, y - 1)) { ctx.moveTo(x, y); ctx.lineTo(x + 1, y); }
      if (!neighborSameZone(x + 1, y)) { ctx.moveTo(x + 1, y); ctx.lineTo(x + 1, y + 1); }
      if (!neighborSameZone(x, y + 1)) { ctx.moveTo(x, y + 1); ctx.lineTo(x + 1, y + 1); }
      if (!neighborSameZone(x - 1, y)) { ctx.moveTo(x, y); ctx.lineTo(x, y + 1); }
      ctx.stroke();
    });
    ctx.restore();
  }

  _formatZoneLabelText(zone) {
    const hasLevels = zone.levelMin != null && zone.levelMax != null;
    return hasLevels ? `${zone.name} · Lv. ${zone.levelMin}–${zone.levelMax}` : zone.name;
  }

  _drawZoneLabels(ctx) {
    for (const zone of this.board.zones) {
      if (!zone.labelPlaced) continue;
      const pseudoLabel = { text: this._formatZoneLabelText(zone), fontSizeCm: CONFIG.LABEL_FONT_SIZE_CM, orientation: zone.label.orientation };
      const box = computeLabelBox(pseudoLabel);
      ctx.save();
      ctx.translate(zone.label.x, zone.label.y);
      if (zone.label.orientation === 'vertical') ctx.rotate(-Math.PI / 2);
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(0, 0, box.width, box.height, box.radius);
      else ctx.rect(0, 0, box.width, box.height);
      ctx.fillStyle = CONFIG.ZONE_BORDER_COLORS[zone.type] || '#000000';
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = `600 ${pseudoLabel.fontSizeCm}px "Segoe UI", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(pseudoLabel.text, box.width / 2, box.height / 2 + pseudoLabel.fontSizeCm * 0.03);
      if (zone.id === this.selection.activeZoneId) {
        ctx.strokeStyle = '#5aa8e0';
        ctx.lineWidth = 0.045;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(0, 0, box.width, box.height, box.radius);
        else ctx.rect(0, 0, box.width, box.height);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  _drawConnections(ctx) {
    for (const connection of this.board.connections) {
      const from = { x: connection.fromCol + 0.5, y: connection.fromRow + 0.5 };
      const to = { x: connection.toCol + 0.5, y: connection.toRow + 0.5 };
      ctx.save();
      ctx.setLineDash([0.12, 0.1]);
      ctx.strokeStyle = 'rgba(20,20,20,0.55)';
      ctx.lineWidth = CONFIG.CONNECTION_LINE_WIDTH_CM;
      ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke();
      ctx.restore();
      this._drawConnectionMarker(ctx, from.x, from.y, connection.type);
      this._drawConnectionMarker(ctx, to.x, to.y, connection.type);
    }
  }

  _drawConnectionMarker(ctx, x, y, type) {
    ctx.save();
    if (type === 'cave') {
      ctx.fillStyle = '#3f2a1a';
      ctx.beginPath(); ctx.arc(x, y, CONFIG.CONNECTION_MARKER_RADIUS_CM, Math.PI, 0); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 0.03; ctx.stroke();
    } else {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(x, y, CONFIG.CONNECTION_MARKER_RADIUS_CM, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#000000'; ctx.lineWidth = 0.05; ctx.stroke();
    }
    ctx.restore();
  }

  _drawLabels(ctx) {
    for (const label of this.board.labels) {
      const box = computeLabelBox(label);
      ctx.save();
      ctx.translate(label.x, label.y);
      if (label.orientation === 'vertical') ctx.rotate(-Math.PI / 2);

      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(0, 0, box.width, box.height, box.radius);
      else ctx.rect(0, 0, box.width, box.height);
      ctx.fillStyle = '#000000';
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = `600 ${label.fontSizeCm}px "Segoe UI", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label.text, box.width / 2, box.height / 2 + label.fontSizeCm * 0.03);

      if (label.id === this.selection.activeLabelId) {
        ctx.strokeStyle = '#5aa8e0';
        ctx.lineWidth = 0.045;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(0, 0, box.width, box.height, box.radius);
        else ctx.rect(0, 0, box.width, box.height);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  _drawSelection(ctx) {
    const sel = this.selection;
    if (sel.tileCol != null && this.board.isInBounds(sel.tileCol, sel.tileRow)) {
      ctx.save();
      ctx.strokeStyle = '#5aa8e0';
      ctx.lineWidth = 0.06;
      ctx.strokeRect(sel.tileCol + 0.02, sel.tileRow + 0.02, 0.96, 0.96);
      ctx.restore();
    }
    if (sel.hoverCol != null && this.board.isInBounds(sel.hoverCol, sel.hoverRow)) {
      ctx.save();
      ctx.fillStyle = 'rgba(90,168,224,0.18)';
      ctx.fillRect(sel.hoverCol, sel.hoverRow, 1, 1);
      ctx.restore();
    }
  }

  _drawToolOverlay(ctx) {
    const tool = this.toolManager?.getActiveTool();
    if (tool && typeof tool.renderOverlay === 'function') tool.renderOverlay(ctx, this.selection, this.board);
  }
}

/* =========================================================================
 * Tools
 * ========================================================================= */
class Tool {
  constructor(app) { this.app = app; }
  get id() { return 'tool'; }
  get cursor() { return 'crosshair'; }
  getLayerKey() { return null; }
  onPointerDown(ctx) {}
  onPointerMove(ctx) {}
  onPointerUp(ctx) {}
  renderOverlay(ctx2d, selection, board) {}
}

/**
 * Shared single-tile / rectangle-area painting behavior. Subclasses only implement
 * _makeTileCommand(tile), which returns an undoable command for that tile or null
 * if nothing changes (e.g. the tile already has the target value).
 */
class AreaPaintTool extends Tool {
  constructor(app) {
    super(app);
    this.mode = 'single'; // 'single' | 'area'
    this.strokeCommands = [];
    this._areaStart = null;
    this._areaCurrent = null;
  }

  onPointerDown(pctx) {
    if (this.mode === 'area') {
      this._areaStart = { col: pctx.col, row: pctx.row };
      this._areaCurrent = { col: pctx.col, row: pctx.row };
      this.app.renderer.requestRender();
      return;
    }
    this.strokeCommands = [];
    this._paintTile(pctx);
  }

  onPointerMove(pctx) {
    if (this.mode === 'area') {
      if (this._areaStart && pctx.isPointerDown) {
        this._areaCurrent = { col: pctx.col, row: pctx.row };
        this.app.renderer.requestRender();
      }
      return;
    }
    if (pctx.isPointerDown) this._paintTile(pctx);
  }

  onPointerUp(pctx) {
    if (this.mode === 'area') {
      if (this._areaStart && this._areaCurrent) this._applyArea(pctx.board);
      this._areaStart = null;
      this._areaCurrent = null;
      this.app.renderer.requestRender();
      return;
    }
    if (this.strokeCommands.length) this.app.history.record(new BatchCommand(this.strokeCommands));
    this.strokeCommands = [];
  }

  _paintTile(pctx) {
    const tile = pctx.board.getTile(pctx.col, pctx.row);
    if (!tile) return;
    const cmd = this._makeTileCommand(tile);
    if (!cmd) return;
    cmd.redo();
    this.strokeCommands.push(cmd);
    this.app.renderer.requestRender();
  }

  _applyArea(board) {
    const colStart = clamp(Math.min(this._areaStart.col, this._areaCurrent.col), 0, board.cols - 1);
    const colEnd = clamp(Math.max(this._areaStart.col, this._areaCurrent.col), 0, board.cols - 1);
    const rowStart = clamp(Math.min(this._areaStart.row, this._areaCurrent.row), 0, board.rows - 1);
    const rowEnd = clamp(Math.max(this._areaStart.row, this._areaCurrent.row), 0, board.rows - 1);
    const commands = [];
    board.forEachTileInRange(colStart, rowStart, colEnd, rowEnd, tile => {
      const cmd = this._makeTileCommand(tile);
      if (cmd) commands.push(cmd);
    });
    if (commands.length) this.app.history.execute(new BatchCommand(commands));
  }

  /** Subclass hook: return an undoable command for this tile, or null for a no-op. */
  _makeTileCommand(tile) { return null; }

  renderOverlay(ctx) {
    if (this.mode !== 'area' || !this._areaStart || !this._areaCurrent) return;
    const colStart = Math.min(this._areaStart.col, this._areaCurrent.col);
    const colEnd = Math.max(this._areaStart.col, this._areaCurrent.col);
    const rowStart = Math.min(this._areaStart.row, this._areaCurrent.row);
    const rowEnd = Math.max(this._areaStart.row, this._areaCurrent.row);
    ctx.save();
    ctx.strokeStyle = '#5aa8e0';
    ctx.lineWidth = 0.08;
    ctx.setLineDash([0.15, 0.1]);
    ctx.strokeRect(colStart, rowStart, colEnd - colStart + 1, rowEnd - rowStart + 1);
    ctx.restore();
  }
}

class BrushTool extends AreaPaintTool {
  constructor(app) { super(app); this.currentTerrain = 'grass'; }
  get id() { return 'brush'; }
  getLayerKey() { return 'terrain'; }

  _makeTileCommand(tile) {
    if (tile.terrain === this.currentTerrain) return null;
    return makeSetFieldCommand(tile, 'terrain', this.currentTerrain);
  }
}

/** Shared multi-cell placement behavior for buildings, events, and barriers. */
class ObjectPlacementTool extends Tool {
  constructor(app, category, defaultTypeId) {
    super(app);
    this.category = category;
    this.currentTypeId = defaultTypeId;
  }
  getLayerKey() { return this.category; }

  onPointerDown(pctx) {
    const def = pctx.board.getPaletteEntry(this.category, this.currentTypeId);
    if (!def) return;
    const width = def.widthCells || 1, height = def.heightCells || 1;
    if (!pctx.board.canPlaceObject(this.category, pctx.col, pctx.row, width, height)) {
      this.app.ui.setStatusMessage('Objekt passt hier nicht (außerhalb des Boards oder überlappt ein bestehendes Objekt).');
      return;
    }
    const obj = new PlacedObject(pctx.board.generateId(), this.category, this.currentTypeId, pctx.col, pctx.row, width, height);
    this.app.history.execute(makeAddObjectCommand(pctx.board, obj));
    this.app.renderer.requestRender();
  }

  renderOverlay(ctx, selection, board) {
    const def = board.getPaletteEntry(this.category, this.currentTypeId);
    if (!def || selection.hoverCol == null) return;
    const width = def.widthCells || 1, height = def.heightCells || 1;
    const valid = board.canPlaceObject(this.category, selection.hoverCol, selection.hoverRow, width, height);
    ctx.save();
    ctx.strokeStyle = valid ? '#5aa8e0' : '#e0796a';
    ctx.lineWidth = 0.06;
    ctx.setLineDash([0.1, 0.08]);
    ctx.strokeRect(selection.hoverCol, selection.hoverRow, width, height);
    ctx.restore();
  }
}

class BuildingTool extends ObjectPlacementTool {
  constructor(app) { super(app, 'buildings', 'arena'); }
  get id() { return 'building'; }
}

class EventTool extends ObjectPlacementTool {
  constructor(app) { super(app, 'events', 'trainer'); }
  get id() { return 'event'; }
}

class BarrierTool extends ObjectPlacementTool {
  constructor(app) { super(app, 'barriers', 'tree'); }
  get id() { return 'barrier'; }
}

class ConnectionTool extends Tool {
  constructor(app) { super(app); this.currentType = 'route'; }
  get id() { return 'connection'; }
  getLayerKey() { return 'connections'; }

  onPointerDown(pctx) {
    if (!pctx.board.isInBounds(pctx.col, pctx.row)) return;
    const draft = this.app.selection.connectionDraft;
    if (!draft) {
      this.app.selection.startConnectionDraft(pctx.col, pctx.row);
      this.app.renderer.requestRender();
      return;
    }
    if (draft.col === pctx.col && draft.row === pctx.row) {
      this.app.selection.clearConnectionDraft();
      this.app.renderer.requestRender();
      return;
    }
    const connection = new Connection(pctx.board.generateId(), draft.col, draft.row, pctx.col, pctx.row, this.currentType);
    this.app.history.execute(makeAddConnectionCommand(pctx.board, connection));
    this.app.selection.clearConnectionDraft();
    this.app.renderer.requestRender();
  }

  cancelDraft() {
    if (this.app.selection.connectionDraft) {
      this.app.selection.clearConnectionDraft();
      this.app.renderer.requestRender();
    }
  }

  renderOverlay(ctx, selection) {
    if (!selection.connectionDraft) return;
    const { col, row } = selection.connectionDraft;
    ctx.save();
    ctx.strokeStyle = '#5aa8e0';
    ctx.lineWidth = 0.08;
    ctx.strokeRect(col + 0.04, row + 0.04, 0.92, 0.92);
    ctx.restore();
  }
}

class BorderTool extends Tool {
  get id() { return 'border'; }
  getLayerKey() { return 'terrain'; }

  onPointerDown(pctx) {
    const tile = pctx.board.getTile(pctx.col, pctx.row);
    if (!tile) return;
    const fx = pctx.worldX - pctx.col;
    const fy = pctx.worldY - pctx.row;
    const edge = this._nearestEdge(fx, fy);
    this.app.history.execute(makeSetBorderCommand(tile, edge, !tile.borders[edge]));
    this.app.renderer.requestRender();
  }

  _nearestEdge(fx, fy) {
    const distances = { top: fy, bottom: 1 - fy, left: fx, right: 1 - fx };
    return Object.entries(distances).sort((a, b) => a[1] - b[1])[0][0];
  }
}

class TextTool extends Tool {
  constructor(app) { super(app); this.orientation = 'horizontal'; this._dragOffset = null; }
  get id() { return 'text'; }
  getLayerKey() { return 'labels'; }

  onPointerDown(pctx) {
    const hit = this._hitTest(pctx.board, pctx.worldX, pctx.worldY);
    if (hit) {
      this.app.selection.selectLabel(hit.id);
      this.app.selection.draggingLabel = true;
      this._dragOffset = { dx: pctx.worldX - hit.x, dy: pctx.worldY - hit.y };
      this._dragStart = { x: hit.x, y: hit.y };
      this.app.renderer.requestRender();
      return;
    }
    const text = window.prompt('Text der Beschriftung:', 'Beschriftung');
    if (text === null || text.trim() === '') return;
    const label = pctx.board.addLabel(pctx.worldX, pctx.worldY, text.trim(), this.orientation);
    this.app.history.record(makeAddLabelCommand(pctx.board, label));
    this.app.selection.selectLabel(label.id);
    this.app.renderer.requestRender();
  }

  onPointerMove(pctx) {
    if (!this.app.selection.draggingLabel || !pctx.isPointerDown) return;
    const label = pctx.board.getLabelById(this.app.selection.activeLabelId);
    if (!label) return;
    label.x = pctx.worldX - this._dragOffset.dx;
    label.y = pctx.worldY - this._dragOffset.dy;
    this.app.renderer.requestRender();
  }

  onPointerUp(pctx) {
    if (!this.app.selection.draggingLabel) return;
    const label = pctx.board.getLabelById(this.app.selection.activeLabelId);
    this.app.selection.draggingLabel = false;
    if (label && this._dragStart && (label.x !== this._dragStart.x || label.y !== this._dragStart.y)) {
      this.app.history.record(makeMoveLabelCommand(label, this._dragStart.x, this._dragStart.y, label.x, label.y));
    }
    this._dragStart = null;
  }

  editSelectedLabel() {
    const label = this.app.board.getLabelById(this.app.selection.activeLabelId);
    if (!label) return;
    const text = window.prompt('Text der Beschriftung:', label.text);
    if (text === null || text.trim() === '') return;
    this.app.history.execute(makeSetFieldCommand(label, 'text', text.trim()));
    this.app.renderer.requestRender();
  }

  deleteSelectedLabel() {
    const label = this.app.board.getLabelById(this.app.selection.activeLabelId);
    if (!label) return;
    this.app.history.execute(makeRemoveLabelCommand(this.app.board, label));
    this.app.selection.clearLabelSelection();
    this.app.renderer.requestRender();
  }

  _hitTest(board, worldX, worldY) {
    for (let i = board.labels.length - 1; i >= 0; i--) {
      const label = board.labels[i];
      const box = computeLabelBox(label);
      const local = this._toLocal(label, worldX, worldY);
      if (local.x >= 0 && local.x <= box.width && local.y >= 0 && local.y <= box.height) return label;
    }
    return null;
  }

  _toLocal(label, worldX, worldY) {
    const dx = worldX - label.x, dy = worldY - label.y;
    if (label.orientation === 'vertical') return { x: -dy, y: dx };
    return { x: dx, y: dy };
  }
}

class EraserTool extends AreaPaintTool {
  constructor(app) {
    super(app);
    this.targetLayer = 'terrain';
  }
  get id() { return 'eraser'; }
  getLayerKey() { return this.targetLayer === 'borders' ? 'terrain' : this.targetLayer; }

  onPointerDown(pctx) {
    if (this.mode === 'area') { super.onPointerDown(pctx); return; }
    this.strokeCommands = [];
    this._erase(pctx);
  }

  onPointerMove(pctx) {
    if (this.mode === 'area') { super.onPointerMove(pctx); return; }
    if (pctx.isPointerDown) this._erase(pctx);
  }

  onPointerUp(pctx) {
    if (this.mode === 'area') { super.onPointerUp(pctx); return; }
    if (this.strokeCommands.length) this.app.history.record(new BatchCommand(this.strokeCommands));
    this.strokeCommands = [];
  }

  /** Clears the tile-embedded fields (terrain/borders/zoneId); used by both single-cell drag and area-rectangle erase. */
  _makeTileCommand(tile) {
    if (this.targetLayer === 'borders') {
      if (CONFIG.BORDER_EDGES.every(edge => tile.borders[edge] === false)) return null;
      return makeSetFieldCommand(tile, 'borders', { top: false, right: false, bottom: false, left: false });
    }
    if (this.targetLayer === 'zones') {
      if (tile.zoneId === null) return null;
      return makeSetFieldCommand(tile, 'zoneId', null);
    }
    if (this.targetLayer === 'terrain') {
      if (tile.terrain === null) return null;
      return makeSetFieldCommand(tile, 'terrain', null);
    }
    return null; // buildings/events/barriers/connections/labels are not tile fields — handled below
  }

  /** Overrides the generic per-tile area sweep for entity-based targets (objects/connections/labels). */
  _applyArea(board) {
    if (this.targetLayer === 'buildings' || this.targetLayer === 'events' || this.targetLayer === 'barriers') {
      this._eraseObjectsInArea(board);
      return;
    }
    if (this.targetLayer === 'connections') { this._eraseConnectionsInArea(board); return; }
    if (this.targetLayer === 'labels') { this._eraseLabelsInArea(board); return; }
    super._applyArea(board);
  }

  _getAreaRect(board) {
    const colStart = clamp(Math.min(this._areaStart.col, this._areaCurrent.col), 0, board.cols - 1);
    const colEnd = clamp(Math.max(this._areaStart.col, this._areaCurrent.col), 0, board.cols - 1);
    const rowStart = clamp(Math.min(this._areaStart.row, this._areaCurrent.row), 0, board.rows - 1);
    const rowEnd = clamp(Math.max(this._areaStart.row, this._areaCurrent.row), 0, board.rows - 1);
    return { col: colStart, row: rowStart, width: colEnd - colStart + 1, height: rowEnd - rowStart + 1 };
  }

  _eraseObjectsInArea(board) {
    const rect = this._getAreaRect(board);
    const commands = board.objects
      .filter(o => o.category === this.targetLayer && rectsOverlap(o, rect))
      .map(o => makeRemoveObjectCommand(board, o));
    if (commands.length) this.app.history.execute(new BatchCommand(commands));
  }

  _eraseConnectionsInArea(board) {
    const rect = this._getAreaRect(board);
    const inRect = (col, row) => col >= rect.col && col < rect.col + rect.width && row >= rect.row && row < rect.row + rect.height;
    const commands = board.connections
      .filter(c => inRect(c.fromCol, c.fromRow) || inRect(c.toCol, c.toRow))
      .map(c => makeRemoveConnectionCommand(board, c));
    if (commands.length) this.app.history.execute(new BatchCommand(commands));
  }

  _eraseLabelsInArea(board) {
    const rect = this._getAreaRect(board);
    const commands = board.labels
      .filter(l => l.x >= rect.col && l.x < rect.col + rect.width && l.y >= rect.row && l.y < rect.row + rect.height)
      .map(l => makeRemoveLabelCommand(board, l));
    if (commands.length) this.app.history.execute(new BatchCommand(commands));
  }

  /** Single-cell (click/drag) erase — unchanged behavior, delegates tile fields to _makeTileCommand. */
  _erase(pctx) {
    const { board, col, row, worldX, worldY } = pctx;
    if (this.targetLayer === 'connections') { this._eraseConnection(board, col, row); return; }
    if (this.targetLayer === 'labels') { this._eraseLabel(board, worldX, worldY); return; }
    if (this.targetLayer === 'buildings' || this.targetLayer === 'events' || this.targetLayer === 'barriers') {
      this._eraseObject(board, this.targetLayer, col, row);
      return;
    }
    const tile = board.getTile(col, row);
    if (!tile) return;
    const cmd = this._makeTileCommand(tile);
    if (!cmd) return;
    cmd.redo();
    this.strokeCommands.push(cmd);
    this.app.renderer.requestRender();
  }

  _eraseObject(board, category, col, row) {
    const obj = board.findObjectAt(category, col, row);
    if (!obj) return;
    this.app.history.execute(makeRemoveObjectCommand(board, obj));
    this.app.renderer.requestRender();
  }

  _eraseConnection(board, col, row) {
    const connection = board.findConnectionAt(col, row);
    if (!connection) return;
    this.app.history.execute(makeRemoveConnectionCommand(board, connection));
    this.app.renderer.requestRender();
  }

  _eraseLabel(board, worldX, worldY) {
    const textTool = this.app.toolManager.tools.text;
    const label = textTool._hitTest(board, worldX, worldY);
    if (!label) return;
    this.app.history.execute(makeRemoveLabelCommand(board, label));
    this.app.renderer.requestRender();
  }
}

/** Purely informational — clicking the canvas only selects the tile (for the inspector); its properties panel lists shortcuts. */
class ShortcutsTool extends Tool {
  get id() { return 'shortcuts'; }
  get cursor() { return 'default'; }
  getLayerKey() { return null; }
}

/** Groups tiles into a named route/city/cave zone; also owns dragging of that zone's name+level pill. */
class ZoneTool extends AreaPaintTool {
  constructor(app) {
    super(app);
    this.currentZoneId = null;
    this._draggingLabel = false;
    this._dragOffset = null;
    this._dragStart = null;
  }
  get id() { return 'zone'; }
  getLayerKey() { return 'zones'; }

  onPointerDown(pctx) {
    const hitZone = this._hitTestLabel(pctx.board, pctx.worldX, pctx.worldY);
    if (hitZone) {
      this.currentZoneId = hitZone.id;
      this.app.selection.selectZone(hitZone.id);
      this._draggingLabel = true;
      this._dragOffset = { dx: pctx.worldX - hitZone.label.x, dy: pctx.worldY - hitZone.label.y };
      this._dragStart = { x: hitZone.label.x, y: hitZone.label.y };
      this.app.renderer.requestRender();
      return;
    }
    super.onPointerDown(pctx);
  }

  onPointerMove(pctx) {
    if (this._draggingLabel && pctx.isPointerDown) {
      const zone = this.app.board.getZoneById(this.currentZoneId);
      if (zone) {
        zone.label.x = pctx.worldX - this._dragOffset.dx;
        zone.label.y = pctx.worldY - this._dragOffset.dy;
        this.app.renderer.requestRender();
      }
      return;
    }
    super.onPointerMove(pctx);
  }

  onPointerUp(pctx) {
    if (this._draggingLabel) {
      this._draggingLabel = false;
      const zone = this.app.board.getZoneById(this.currentZoneId);
      if (zone && this._dragStart && (zone.label.x !== this._dragStart.x || zone.label.y !== this._dragStart.y)) {
        this.app.history.record(makeMoveZoneLabelCommand(zone, this._dragStart.x, this._dragStart.y, zone.label.x, zone.label.y));
      }
      this._dragStart = null;
      return;
    }
    super.onPointerUp(pctx);
    this._autoPlaceLabelIfNeeded(pctx.board);
  }

  _makeTileCommand(tile) {
    if (!this.currentZoneId || tile.zoneId === this.currentZoneId) return null;
    return makeSetFieldCommand(tile, 'zoneId', this.currentZoneId);
  }

  _autoPlaceLabelIfNeeded(board) {
    const zone = board.getZoneById(this.currentZoneId);
    if (!zone || zone.labelPlaced) return;
    const centroid = board.computeZoneCentroid(zone.id);
    if (!centroid) return;
    zone.label.x = centroid.x;
    zone.label.y = centroid.y;
    zone.labelPlaced = true;
    this.app.renderer.requestRender();
  }

  _hitTestLabel(board, worldX, worldY) {
    for (let i = board.zones.length - 1; i >= 0; i--) {
      const zone = board.zones[i];
      if (!zone.labelPlaced) continue;
      const pseudoLabel = { text: this.app.renderer._formatZoneLabelText(zone), fontSizeCm: CONFIG.LABEL_FONT_SIZE_CM, orientation: zone.label.orientation };
      const box = computeLabelBox(pseudoLabel);
      const dx = worldX - zone.label.x, dy = worldY - zone.label.y;
      const local = zone.label.orientation === 'vertical' ? { x: -dy, y: dx } : { x: dx, y: dy };
      if (local.x >= 0 && local.x <= box.width && local.y >= 0 && local.y <= box.height) return zone;
    }
    return null;
  }
}

/* =========================================================================
 * ToolManager
 * ========================================================================= */
class ToolManager {
  constructor(app) {
    this.app = app;
    this.tools = {
      brush: new BrushTool(app),
      building: new BuildingTool(app),
      event: new EventTool(app),
      barrier: new BarrierTool(app),
      zone: new ZoneTool(app),
      connection: new ConnectionTool(app),
      border: new BorderTool(app),
      text: new TextTool(app),
      eraser: new EraserTool(app),
      shortcuts: new ShortcutsTool(app)
    };
    this.activeToolKey = 'brush';
    this.isPointerDown = false;
    this.isSpacePanning = false;
    this._panLast = null;
  }

  getActiveTool() { return this.tools[this.activeToolKey]; }

  setActiveTool(key) {
    if (!this.tools[key]) return;
    if (this.activeToolKey === 'connection') this.tools.connection.cancelDraft();
    this.activeToolKey = key;
    this.app.canvasEl.style.cursor = this.getActiveTool().cursor;
    this.app.renderer.requestRender();
  }

  attach(canvasEl) {
    canvasEl.addEventListener('pointerdown', e => this._onPointerDown(e));
    window.addEventListener('pointermove', e => this._onPointerMove(e));
    window.addEventListener('pointerup', e => this._onPointerUp(e));
    canvasEl.addEventListener('wheel', e => this._onWheel(e), { passive: false });
    canvasEl.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('keydown', e => this._onKeyDown(e));
    window.addEventListener('keyup', e => this._onKeyUp(e));
  }

  _buildPointerContext(e) {
    const rect = this.app.canvasEl.getBoundingClientRect();
    const screenX = e.clientX - rect.left;
    const screenY = e.clientY - rect.top;
    const world = this.app.camera.screenToWorld(screenX, screenY);
    return {
      col: Math.floor(world.x), row: Math.floor(world.y),
      worldX: world.x, worldY: world.y, screenX, screenY,
      board: this.app.board, event: e, isPointerDown: this.isPointerDown
    };
  }

  _onPointerDown(e) {
    if (this.isSpacePanning) { this._panLast = { x: e.clientX, y: e.clientY }; return; }
    this.isPointerDown = true;
    const pctx = this._buildPointerContext(e);
    this.app.selection.setHover(pctx.col, pctx.row);
    if (this.app.board.isInBounds(pctx.col, pctx.row)) this.app.selection.selectTile(pctx.col, pctx.row);
    const tool = this.getActiveTool();
    const layerKey = tool.getLayerKey();
    if (layerKey && this.app.layerManager.isLocked(layerKey)) {
