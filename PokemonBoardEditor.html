      this.app.ui.setStatusMessage(`Ebene "${CONFIG.LAYER_NAMES[layerKey]}" ist gesperrt.`);
    } else {
      tool.onPointerDown(pctx);
    }
    this.app.ui.refreshInspector();
    this.app.ui.updateStatusBar();
    this.app.renderer.requestRender();
  }

  _onPointerMove(e) {
    if (this.isSpacePanning && this._panLast) {
      this.app.camera.pan(e.clientX - this._panLast.x, e.clientY - this._panLast.y);
      this._panLast = { x: e.clientX, y: e.clientY };
      this.app.renderer.requestRender();
      this.app.ui.updateStatusBar();
      return;
    }
    const pctx = this._buildPointerContext(e);
    this.app.selection.setHover(pctx.col, pctx.row);
    const tool = this.getActiveTool();
    const layerKey = tool.getLayerKey();
    if (!(layerKey && this.app.layerManager.isLocked(layerKey))) tool.onPointerMove(pctx);
    this.app.ui.updateStatusBar();
    this.app.renderer.requestRender();
  }

  _onPointerUp(e) {
    if (this.isSpacePanning) { this._panLast = null; return; }
    if (!this.isPointerDown) return;
    this.isPointerDown = false;
    const pctx = this._buildPointerContext(e);
    this.getActiveTool().onPointerUp(pctx);
    this.app.renderer.requestRender();
  }

  _onWheel(e) {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) {
      // Ctrl/Cmd + wheel: pan vertically without zooming.
      this.app.camera.pan(0, -e.deltaY);
    } else if (e.shiftKey) {
      // Shift + wheel: pan horizontally (some devices report the shifted scroll as deltaX already).
      const delta = e.deltaX !== 0 ? e.deltaX : e.deltaY;
      this.app.camera.pan(-delta, 0);
    } else {
      const rect = this.app.canvasEl.getBoundingClientRect();
      const factor = e.deltaY < 0 ? (1 + CONFIG.ZOOM_STEP) : 1 / (1 + CONFIG.ZOOM_STEP);
      this.app.camera.zoomAt(e.clientX - rect.left, e.clientY - rect.top, factor);
    }
    this.app.renderer.requestRender();
    this.app.ui.updateStatusBar();
  }

  _onKeyDown(e) {
    if (this._isTypingTarget(e.target)) return;
    if (e.code === 'Space' && !this.isSpacePanning) {
      this.isSpacePanning = true;
      this.app.canvasEl.style.cursor = 'grab';
      e.preventDefault();
      return;
    }
    if (e.key === 'Escape') {
      this.tools.connection.cancelDraft();
      this.app.selection.clearLabelSelection();
      this.app.renderer.requestRender();
      return;
    }
    if (e.key === 'Delete' || e.key === 'Backspace') {
      if (this.activeToolKey === 'text' && this.app.selection.activeLabelId != null) {
        this.tools.text.deleteSelectedLabel();
        e.preventDefault();
      }
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
      e.preventDefault();
      if (e.shiftKey) this.app.history.redo(); else this.app.history.undo();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); this.app.history.redo(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === '+' || e.key === '=') { e.preventDefault(); this.app.ui.handleZoomShortcut('zoom-in'); return; }
    if (e.key === '-') { e.preventDefault(); this.app.ui.handleZoomShortcut('zoom-out'); return; }
    if (e.key === '0') { e.preventDefault(); this.app.ui.handleZoomShortcut('zoom-reset'); return; }
    if (e.key.toLowerCase() === 'f') { e.preventDefault(); this.app.ui.handleZoomShortcut('zoom-fit'); return; }
  }

  _onKeyUp(e) {
    if (e.code === 'Space') {
      this.isSpacePanning = false;
      this._panLast = null;
      this.app.canvasEl.style.cursor = this.getActiveTool().cursor;
    }
  }

  _isTypingTarget(target) {
    return target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable);
  }
}

/* =========================================================================
 * ProjectSerializer
 * ========================================================================= */
class ProjectSerializer {
  static serialize(app) {
    return {
      version: 2,
      savedAt: new Date().toISOString(),
      board: app.board.toJSON(),
      layers: app.layerManager.toJSON()
    };
  }

  static deserialize(app, data) {
    app.layerManager = LayerManager.fromJSON(data.layers);
    app.renderer.layerManager = app.layerManager;
    app.replaceBoard(Board.fromJSON(data.board));
  }
}

/* =========================================================================
 * StorageManager
 * ========================================================================= */
class StorageManager {
  constructor(app) { this.app = app; }

  autosave() {
    try {
      const payload = ProjectSerializer.serialize(this.app);
      localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(payload));
    } catch (err) {
      console.warn('Autosave fehlgeschlagen:', err);
    }
  }

  hasAutosave() { return localStorage.getItem(CONFIG.STORAGE_KEY) != null; }

  loadAutosave() {
    const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
    if (!raw) return false;
    try {
      ProjectSerializer.deserialize(this.app, JSON.parse(raw));
      return true;
    } catch (err) {
      console.warn('Autosave konnte nicht geladen werden:', err);
      return false;
    }
  }

  saveProjectAsJson() {
    const payload = ProjectSerializer.serialize(this.app);
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    downloadBlob(blob, 'pokemon-board-projekt.json');
  }

  saveProjectAsHtml() {
    const payload = ProjectSerializer.serialize(this.app);
    const doc = document.documentElement.cloneNode(true);
    const script = doc.querySelector('#embedded-project-data');
    script.textContent = JSON.stringify(payload);
    const statusMessageEl = doc.querySelector('#status-message');
    if (statusMessageEl) statusMessageEl.textContent = '';
    const html = '<!DOCTYPE html>\n' + doc.outerHTML;
    const blob = new Blob([html], { type: 'text/html' });
    downloadBlob(blob, 'pokemon-board-projekt.html');
  }

  async loadProjectFromFile(file) {
    const text = await readFileAsText(file);
    let payload;
    if (file.name.toLowerCase().endsWith('.json')) {
      payload = JSON.parse(text);
    } else {
      const parsed = new DOMParser().parseFromString(text, 'text/html');
      const script = parsed.querySelector('#embedded-project-data');
      if (!script || !script.textContent || script.textContent.trim() === 'null') {
        throw new Error('Keine Projektdaten in dieser HTML-Datei gefunden.');
      }
      payload = JSON.parse(script.textContent);
    }
    ProjectSerializer.deserialize(this.app, payload);
  }
}

/* =========================================================================
 * Exporter
 * ========================================================================= */
class Exporter {
  constructor(app) { this.app = app; }

  exportJson() { this.app.storage.saveProjectAsJson(); }
  exportHtml() { this.app.storage.saveProjectAsHtml(); }

  exportPng() {
    const board = this.app.board;
    const pxPerCmPhysical = CONFIG.EXPORT_DPI / 2.54;
    const pxPerCell = pxPerCmPhysical * board.cellSizeCm;
    const width = Math.round(board.cols * pxPerCell);
    const height = Math.round(board.rows * pxPerCell);
    if (width > CONFIG.MAX_EXPORT_DIMENSION_PX || height > CONFIG.MAX_EXPORT_DIMENSION_PX) {
      this.app.ui.setStatusMessage('Export zu groß – bitte Board oder Kachelgröße verringern.');
      return;
    }
    const offscreen = document.createElement('canvas');
    offscreen.width = width;
    offscreen.height = height;
    const ctx = offscreen.getContext('2d');
    const exportCamera = new Camera();
    exportCamera.offsetX = 0;
    exportCamera.offsetY = 0;
    exportCamera.zoom = pxPerCell / CONFIG.BASE_PIXELS_PER_CELL;
    this.app.renderer.renderExport(ctx, width, height, exportCamera);
    offscreen.toBlob(blob => {
      if (blob) downloadBlob(blob, 'pokemon-board.png');
    }, 'image/png');
  }
}

/* =========================================================================
 * UIController
 * ========================================================================= */
class UIController {
  constructor(app) {
    this.app = app;

      toolGrid: document.getElementById('tool-grid'),
      toolOptionsBody: document.getElementById('tool-options-body'),
      layerList: document.getElementById('layer-list'),
      inspectorBody: document.getElementById('inspector-body'),
      statusCell: document.getElementById('status-cell'),
      statusZoom: document.getElementById('status-zoom'),
      statusTool: document.getElementById('status-tool'),
      statusBoardSize: document.getElementById('status-board-size'),
      statusMessage: document.getElementById('status-message'),
      bgOpacity: document.getElementById('bg-opacity'),
      boardCols: document.getElementById('board-cols'),
      boardRows: document.getElementById('board-rows'),
      boardCellSize: document.getElementById('board-cell-size'),
      fileInputProject: document.getElementById('file-input-project'),
      fileInputImage: document.getElementById('file-input-image')
    };
    this._statusTimer = null;
    this._newColorDraft = { label: '', color: '#8CCF5A', alpha: CONFIG.DEFAULT_TERRAIN_ALPHA };
    this._newTypeDrafts = {
      buildings: { label: '', color: '#c94f4f', iconUrl: '', width: 1, height: 1 },
      events: { label: '', color: '#e0a13a', iconUrl: '', width: 1, height: 1 },
      barriers: { label: '', color: '#8a8a8a', iconUrl: '', width: 1, height: 1 }
    };
    this._newZoneDraft = { type: 'route', name: '', levelMin: '', levelMax: '' };
    this.TOOL_DEFS = [
      { key: 'brush', glyph: '🖌️', label: 'Pinsel' },
      { key: 'building', glyph: '🏛️', label: 'Gebäude' },
      { key: 'event', glyph: '⚡', label: 'Event' },
      { key: 'barrier', glyph: '🌳', label: 'Barriere' },
      { key: 'zone', glyph: '🗺️', label: 'Zone' },
      { key: 'connection', glyph: '🔗', label: 'Verbindung' },
      { key: 'border', glyph: '▢', label: 'Rahmen' },
      { key: 'text', glyph: '🔤', label: 'Text' },
      { key: 'eraser', glyph: '🧹', label: 'Radierer' },
      { key: 'shortcuts', glyph: '⌨️', label: 'Tastenkürzel' }
    ];
  }

  init() {
    this._buildToolGrid();
    this._buildLayerList();
    this._bindMenu();
    this._bindGlobalActions();
    this.el.boardCols.min = CONFIG.MIN_BOARD_DIMENSION;
    this.el.boardCols.max = CONFIG.MAX_BOARD_DIMENSION;
    this.el.boardRows.min = CONFIG.MIN_BOARD_DIMENSION;
    this.el.boardRows.max = CONFIG.MAX_BOARD_DIMENSION;
    this.el.boardCellSize.min = CONFIG.MIN_CELL_SIZE_CM;
    this.el.boardCellSize.max = CONFIG.MAX_CELL_SIZE_CM;
    this.refreshAll();
  }

  refreshAll() {
    this._updateToolGridActive();
    this._renderToolOptions();
    this._buildLayerList();
    this.refreshInspector();
    this.updateStatusBar();
    const bg = this.app.board.background;
    this.el.bgOpacity.value = bg ? (bg.opacity ?? 1) : 1;
    this.el.boardCols.value = this.app.board.cols;
    this.el.boardRows.value = this.app.board.rows;
    this.el.boardCellSize.value = this.app.board.cellSizeCm;
  }

  _buildToolGrid() {
    this.el.toolGrid.innerHTML = '';
    for (const def of this.TOOL_DEFS) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tool-btn';
      btn.dataset.tool = def.key;
      btn.innerHTML = `<span class="glyph">${def.glyph}</span><span>${def.label}</span>`;
      btn.addEventListener('click', () => {
        this.app.toolManager.setActiveTool(def.key);
        this.refreshAll();
      });
      this.el.toolGrid.appendChild(btn);
    }
  }

  _updateToolGridActive() {
    for (const btn of this.el.toolGrid.querySelectorAll('.tool-btn')) {
      btn.classList.toggle('active', btn.dataset.tool === this.app.toolManager.activeToolKey);
    }
  }

  _renderToolOptions() {
    const key = this.app.toolManager.activeToolKey;
    const tool = this.app.toolManager.getActiveTool();
    const body = this.el.toolOptionsBody;
    body.innerHTML = '';
    const renderers = {
      brush: () => this._renderTerrainOptions(body, tool, 'currentTerrain'),
      building: () => this._renderObjectPaletteOptions(body, tool, 'buildings', 'currentTypeId'),
      event: () => this._renderObjectPaletteOptions(body, tool, 'events', 'currentTypeId'),
      barrier: () => this._renderObjectPaletteOptions(body, tool, 'barriers', 'currentTypeId'),
      zone: () => this._renderZoneOptions(body, tool),
      connection: () => this._renderTypeRadio(body, tool, CONFIG.CONNECTION_TYPES, CONFIG.CONNECTION_LABELS, 'currentType'),
      border: () => this._renderHint(body, 'Klicke nahe einer Kachelkante, um den Rahmen dort umzuschalten.'),
      text: () => this._renderTextOptions(body, tool),
      eraser: () => this._renderEraserOptions(body, tool),
      shortcuts: () => this._renderShortcutsList(body)
    };
    (renderers[key] || (() => {}))();
  }

  _renderHint(body, text) {
    const p = document.createElement('p');
    p.className = 'hint-text';
    p.textContent = text;
    body.appendChild(p);
  }

  _renderShortcutsList(body) {
    const list = document.createElement('div');
    list.className = 'shortcut-list';
    for (const [keys, description] of CONFIG.KEYBOARD_SHORTCUTS) {
      const row = document.createElement('div');
      row.className = 'shortcut-row';
      const kbd = document.createElement('span');
      kbd.className = 'shortcut-keys';
      kbd.textContent = keys;
      const desc = document.createElement('span');
      desc.className = 'shortcut-desc';
      desc.textContent = description;
      row.append(kbd, desc);
      list.appendChild(row);
    }
    body.appendChild(list);
  }

  /** Shared swatch grid for both the terrain-color palette and the icon-based palettes, with delete support for custom entries. */
  _renderPaletteGrid(body, board, category, tool, field, renderSwatchContent) {
    const grid = document.createElement('div');
    grid.className = 'swatch-grid';
    for (const entry of board.getPalette(category)) {
      const sw = document.createElement('div');
      sw.className = 'swatch' + (tool[field] === entry.id ? ' active' : '');
      renderSwatchContent(sw, entry);
      sw.title = entry.label;
      sw.addEventListener('click', () => { tool[field] = entry.id; this._renderToolOptions(); });
      if (String(entry.id).startsWith('custom-')) {
        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'swatch-remove';
        delBtn.textContent = '×';
        delBtn.title = 'Entfernen';
        delBtn.addEventListener('click', e => {
          e.stopPropagation();
          board.removePaletteEntry(category, entry.id);
          if (tool[field] === entry.id) tool[field] = board.getPalette(category)[0]?.id ?? null;
          this.app.renderer.requestRender();
          this._renderToolOptions();
        });
        sw.appendChild(delBtn);
      }
      grid.appendChild(sw);
    }
    body.appendChild(grid);
  }

  /** Generic radio group driven by an explicit getter/setter instead of a fixed tool field — reused for tool options and per-entity fields alike. */
  _renderRadioGroup(container, name, options, labels, currentValue, onChange) {
    const wrap = document.createElement('div');
    wrap.className = 'radio-grid';
    for (const value of options) {
      const optLabel = document.createElement('label');
      optLabel.className = 'radio-opt';
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = name;
      input.checked = currentValue === value;
      input.addEventListener('change', () => onChange(value));
      optLabel.appendChild(input);
      optLabel.appendChild(document.createTextNode(labels[value]));
      wrap.appendChild(optLabel);
    }
    container.appendChild(wrap);
  }

  _renderTypeRadio(body, tool, types, labels, field) {
    this._renderRadioGroup(body, `opt-${field}`, types, labels, tool[field], value => { tool[field] = value; this._renderToolOptions(); });
  }

  _renderModeToggle(body, tool) {
    this._renderRadioGroup(body, 'opt-paint-mode', ['single', 'area'], { single: 'Einzelauswahl', area: 'Fläche' }, tool.mode,
      value => { tool.mode = value; this._renderToolOptions(); });
  }

  _renderTerrainOptions(body, tool, field) {
    const board = this.app.board;
    this._renderModeToggle(body, tool);
    this._renderPaletteGrid(body, board, 'terrain', tool, field, (sw, entry) => {
      sw.style.background = hexToRgba(entry.color, entry.alpha ?? 1);
    });
    const activeEntry = board.getPaletteEntry('terrain', tool[field]);
    if (activeEntry) {
      const activeSwatch = body.querySelector('.swatch.active');
      this._renderTerrainEntryFields(body, activeEntry, activeSwatch);
    } else {
      this._renderHint(body, '–');
    }
    this._renderAddColorForm(body, board, tool, field);
  }

  /** Live-edits an existing terrain color (built-in or custom). Since tiles store only the palette id,
   *  every already-placed tile using this color updates automatically — no need to touch tile data. */
  _renderTerrainEntryFields(body, entry, swatchEl) {
    const wrap = document.createElement('div');
    wrap.className = 'add-entry-form';
    const title = document.createElement('span');
    title.className = 'field-label';
    title.textContent = `Farbe „${entry.label}“ bearbeiten`;
    const nameInput = document.createElement('input');
    nameInput.type = 'text'; nameInput.value = entry.label;
    nameInput.addEventListener('change', () => {
      entry.label = nameInput.value.trim() || entry.label;
      this._renderToolOptions();
    });
    const colorInput = document.createElement('input');
    colorInput.type = 'color'; colorInput.value = entry.color;
    colorInput.addEventListener('input', () => {
      entry.color = colorInput.value;
      if (swatchEl) swatchEl.style.background = hexToRgba(entry.color, entry.alpha ?? 1);
      this.app.renderer.requestRender();
    });
    const alphaLabel = document.createElement('span');
    alphaLabel.className = 'hint-text';
    alphaLabel.textContent = `Deckkraft: ${Math.round((entry.alpha ?? 1) * 100)}%`;
    const alphaInput = document.createElement('input');
    alphaInput.type = 'range'; alphaInput.min = '0'; alphaInput.max = '1'; alphaInput.step = '0.05';
    alphaInput.value = String(entry.alpha ?? 1);
    alphaInput.addEventListener('input', () => {
      entry.alpha = parseFloat(alphaInput.value);
      alphaLabel.textContent = `Deckkraft: ${Math.round(entry.alpha * 100)}%`;
      if (swatchEl) swatchEl.style.background = hexToRgba(entry.color, entry.alpha);
      this.app.renderer.requestRender();
    });
    wrap.append(title, nameInput, colorInput, alphaLabel, alphaInput);
    body.appendChild(wrap);
  }

  _renderAddColorForm(body, board, tool, field) {
    const draft = this._newColorDraft;
    const wrap = document.createElement('div');
    wrap.className = 'add-entry-form';
    const title = document.createElement('span');
    title.className = 'field-label';
    title.textContent = 'Neue Farbe hinzufügen';
    const nameInput = document.createElement('input');
    nameInput.type = 'text'; nameInput.placeholder = 'Name'; nameInput.value = draft.label;
    nameInput.addEventListener('input', () => { draft.label = nameInput.value; });
    const colorInput = document.createElement('input');
    colorInput.type = 'color'; colorInput.value = draft.color;
    colorInput.addEventListener('input', () => { draft.color = colorInput.value; });
    const alphaLabel = document.createElement('span');
    alphaLabel.className = 'hint-text';
    alphaLabel.textContent = `Deckkraft: ${Math.round(draft.alpha * 100)}%`;
    const alphaInput = document.createElement('input');
    alphaInput.type = 'range'; alphaInput.min = '0'; alphaInput.max = '1'; alphaInput.step = '0.05';
    alphaInput.value = String(draft.alpha);
    alphaInput.addEventListener('input', () => {
      draft.alpha = parseFloat(alphaInput.value);
      alphaLabel.textContent = `Deckkraft: ${Math.round(draft.alpha * 100)}%`;
    });
    const addBtn = document.createElement('button');
    addBtn.type = 'button'; addBtn.className = 'btn'; addBtn.textContent = 'Farbe hinzufügen';
    addBtn.addEventListener('click', () => {
      const entry = board.addPaletteEntry('terrain', { label: draft.label.trim() || 'Farbe', color: draft.color, alpha: draft.alpha });
      tool[field] = entry.id;
      this._newColorDraft = { label: '', color: draft.color, alpha: CONFIG.DEFAULT_TERRAIN_ALPHA };
      this.app.renderer.requestRender();
      this._renderToolOptions();
    });
    wrap.append(title, nameInput, colorInput, alphaLabel, alphaInput, addBtn);
    body.appendChild(wrap);
  }

  _renderObjectPaletteOptions(body, tool, category, field) {
    const board = this.app.board;
    this._renderPaletteGrid(body, board, category, tool, field, (sw, entry) => {
      sw.classList.add('icon-swatch');
      if (entry.iconUrl) {
        const img = document.createElement('img');
        img.src = entry.iconUrl; img.alt = entry.label;
        sw.appendChild(img);
      } else {
        sw.style.background = entry.color;
        sw.appendChild(document.createTextNode(entry.label.charAt(0)));
      }
    });
    const activeEntry = board.getPaletteEntry(category, tool[field]);
    if (activeEntry) this._renderObjectEntryFields(body, board, category, activeEntry);
    this._renderAddTypeForm(body, board, category, tool, field);
  }

  _renderObjectEntryFields(body, board, category, entry) {
    const field = document.createElement('label');
    field.className = 'field';
    const labelSpan = document.createElement('span');
    labelSpan.className = 'field-label';
    labelSpan.textContent = `Bild-URL für „${entry.label}“`;
    const input = document.createElement('input');
    input.type = 'url'; input.placeholder = 'https://…'; input.value = entry.iconUrl || '';
    input.addEventListener('change', () => {
      board.setPaletteEntryIcon(category, entry.id, input.value.trim() || null);
      this.app.renderer.requestRender();
      this._renderToolOptions();
    });
    field.append(labelSpan, input);
    body.appendChild(field);

    const dimRow = document.createElement('div');
    dimRow.className = 'field-row';
    const widthField = document.createElement('label');
    widthField.className = 'field';
    widthField.innerHTML = '<span class="field-label">Breite (Kacheln)</span>';
    const widthInput = document.createElement('input');
    widthInput.type = 'number'; widthInput.min = '1'; widthInput.step = '1'; widthInput.value = entry.widthCells || 1;
    widthInput.addEventListener('change', () => {
      entry.widthCells = Math.max(1, Math.round(parseFloat(widthInput.value)) || 1);
      this.app.renderer.requestRender();
    });
    widthField.appendChild(widthInput);
    const heightField = document.createElement('label');
    heightField.className = 'field';
    heightField.innerHTML = '<span class="field-label">Höhe (Kacheln)</span>';
    const heightInput = document.createElement('input');
    heightInput.type = 'number'; heightInput.min = '1'; heightInput.step = '1'; heightInput.value = entry.heightCells || 1;
    heightInput.addEventListener('change', () => {
      entry.heightCells = Math.max(1, Math.round(parseFloat(heightInput.value)) || 1);
      this.app.renderer.requestRender();
    });
    heightField.appendChild(heightInput);
    dimRow.append(widthField, heightField);
    body.appendChild(dimRow);
  }

  _renderAddTypeForm(body, board, category, tool, field) {
    const draft = this._newTypeDrafts[category];
    const wrap = document.createElement('div');
    wrap.className = 'add-entry-form';
    const title = document.createElement('span');
    title.className = 'field-label'; title.textContent = 'Neuen Typ hinzufügen';
    const nameInput = document.createElement('input');
    nameInput.type = 'text'; nameInput.placeholder = 'Name'; nameInput.value = draft.label;
    nameInput.addEventListener('input', () => { draft.label = nameInput.value; });
    const colorInput = document.createElement('input');
    colorInput.type = 'color'; colorInput.value = draft.color;
    colorInput.addEventListener('input', () => { draft.color = colorInput.value; });
    const urlInput = document.createElement('input');
    urlInput.type = 'url'; urlInput.placeholder = 'Bild-URL (optional)'; urlInput.value = draft.iconUrl;
    urlInput.addEventListener('input', () => { draft.iconUrl = urlInput.value; });
    const dimRow = document.createElement('div');
    dimRow.className = 'field-row';
    const widthInput = document.createElement('input');
    widthInput.type = 'number'; widthInput.min = '1'; widthInput.step = '1'; widthInput.placeholder = 'Breite'; widthInput.value = draft.width;
    widthInput.addEventListener('input', () => { draft.width = widthInput.value; });
    const heightInput = document.createElement('input');
    heightInput.type = 'number'; heightInput.min = '1'; heightInput.step = '1'; heightInput.placeholder = 'Höhe'; heightInput.value = draft.height;
    heightInput.addEventListener('input', () => { draft.height = heightInput.value; });
    dimRow.append(widthInput, heightInput);
    const addBtn = document.createElement('button');
    addBtn.type = 'button'; addBtn.className = 'btn'; addBtn.textContent = 'Typ hinzufügen';
    addBtn.addEventListener('click', () => {
      const entry = board.addPaletteEntry(category, {
        label: draft.label.trim() || 'Typ', color: draft.color, iconUrl: draft.iconUrl.trim() || null,
        widthCells: Math.max(1, Math.round(parseFloat(draft.width)) || 1),
        heightCells: Math.max(1, Math.round(parseFloat(draft.height)) || 1)
      });
      tool[field] = entry.id;
      this._newTypeDrafts[category] = { label: '', color: draft.color, iconUrl: '', width: 1, height: 1 };
      this.app.renderer.requestRender();
      this._renderToolOptions();
    });
    wrap.append(title, nameInput, colorInput, urlInput, dimRow, addBtn);
    body.appendChild(wrap);
  }

  _renderTextOptions(body, tool) {
    this._renderTypeRadio(body, tool, ['horizontal', 'vertical'], { horizontal: 'Horizontal', vertical: 'Vertikal' }, 'orientation');
    const activeLabel = this.app.board.getLabelById(this.app.selection.activeLabelId);
    if (activeLabel) {
      const editBtn = document.createElement('button');
      editBtn.className = 'btn';
      editBtn.textContent = 'Text bearbeiten';
      editBtn.addEventListener('click', () => { tool.editSelectedLabel(); });
      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'btn danger';
      deleteBtn.textContent = 'Beschriftung löschen';
      deleteBtn.addEventListener('click', () => { tool.deleteSelectedLabel(); this.refreshAll(); });
      body.appendChild(editBtn);
      body.appendChild(deleteBtn);
    } else {
      this._renderHint(body, 'Klicke auf eine leere Stelle, um eine neue Beschriftung zu erstellen, oder ziehe eine bestehende frei an eine neue Position.');
    }
  }

  _renderEraserOptions(body, tool) {
    this._renderModeToggle(body, tool);
    const labels = {
      terrain: 'Gelände', buildings: 'Gebäude', events: 'Events', barriers: 'Barrieren', zones: 'Zonen',
      borders: 'Rahmen', connections: 'Verbindungen', labels: 'Beschriftungen'
    };
    this._renderTypeRadio(body, tool, CONFIG.ERASER_TARGETS, labels, 'targetLayer');
  }

  _renderZoneOptions(body, tool) {
    const board = this.app.board;
    this._renderModeToggle(body, tool);

    if (board.zones.length) {
      this._renderHint(body, 'Zone zum Bemalen auswählen:');
      const zoneLabels = {};
      for (const zone of board.zones) zoneLabels[zone.id] = `${CONFIG.ZONE_TYPE_LABELS[zone.type]}: ${zone.name}`;
      this._renderRadioGroup(body, 'opt-current-zone', board.zones.map(z => z.id), zoneLabels, tool.currentZoneId, value => {
        tool.currentZoneId = value;
        this.app.selection.selectZone(value);
        this._renderToolOptions();
      });
    } else {
      this._renderHint(body, 'Noch keine Zone vorhanden. Lege unten eine neue an.');
    }

    const activeZone = board.getZoneById(tool.currentZoneId);
    if (activeZone) this._renderZoneEditor(body, board, tool, activeZone);
    this._renderCreateZoneForm(body, board, tool);
  }

  _renderZoneEditor(body, board, tool, zone) {
    const wrap = document.createElement('div');
    wrap.className = 'add-entry-form';
    const title = document.createElement('span');
    title.className = 'field-label'; title.textContent = 'Zone bearbeiten';
    const nameField = document.createElement('label');
    nameField.className = 'field';
    nameField.innerHTML = '<span class="field-label">Name</span>';
    const nameInput = document.createElement('input');
    nameInput.type = 'text'; nameInput.value = zone.name;
    nameInput.addEventListener('change', () => {
      zone.name = nameInput.value.trim() || zone.name;
      this.app.renderer.requestRender();
    });
    nameField.appendChild(nameInput);

    const levelRow = document.createElement('div');
    levelRow.className = 'field-row';
    const minField = document.createElement('label');
    minField.className = 'field';
    minField.innerHTML = '<span class="field-label">Level von</span>';
    const minInput = document.createElement('input');
    minInput.type = 'number'; minInput.value = zone.levelMin ?? '';
    minInput.addEventListener('change', () => {
      zone.levelMin = minInput.value === '' ? null : parseInt(minInput.value, 10);
      this.app.renderer.requestRender();
    });
    minField.appendChild(minInput);
    const maxField = document.createElement('label');
    maxField.className = 'field';
    maxField.innerHTML = '<span class="field-label">Level bis</span>';
    const maxInput = document.createElement('input');
    maxInput.type = 'number'; maxInput.value = zone.levelMax ?? '';
    maxInput.addEventListener('change', () => {
      zone.levelMax = maxInput.value === '' ? null : parseInt(maxInput.value, 10);
      this.app.renderer.requestRender();
    });
    maxField.appendChild(maxInput);
    levelRow.append(minField, maxField);

    wrap.append(title, nameField, levelRow);

    if (zone.labelPlaced) {
      this._renderRadioGroup(wrap, `opt-zone-orientation-${zone.id}`, ['horizontal', 'vertical'],
        { horizontal: 'Horizontal', vertical: 'Vertikal' }, zone.label.orientation,
        value => { zone.label.orientation = value; this.app.renderer.requestRender(); this._renderToolOptions(); });
    } else {
      this._renderHint(wrap, 'Bemale eine Kachel, um das Namensfenster automatisch zu platzieren.');
    }

    const delBtn = document.createElement('button');
    delBtn.type = 'button'; delBtn.className = 'btn danger'; delBtn.textContent = 'Zone löschen';
    delBtn.addEventListener('click', () => {
      if (!window.confirm(`Zone "${zone.name}" wirklich löschen? Alle Kachel-Zuordnungen gehen verloren.`)) return;
      board.removeZoneById(zone.id);
      tool.currentZoneId = null;
      this.app.selection.clearZoneSelection();
      this.app.renderer.requestRender();
      this._renderToolOptions();
    });
    wrap.appendChild(delBtn);
    body.appendChild(wrap);
  }

  _renderCreateZoneForm(body, board, tool) {
    const draft = this._newZoneDraft;
    const wrap = document.createElement('div');
    wrap.className = 'add-entry-form';
    const title = document.createElement('span');
    title.className = 'field-label'; title.textContent = 'Neue Zone erstellen';
    wrap.appendChild(title);
    this._renderRadioGroup(wrap, 'opt-new-zone-type', CONFIG.ZONE_TYPES, CONFIG.ZONE_TYPE_LABELS, draft.type,
      value => { draft.type = value; this._renderToolOptions(); });
    const nameInput = document.createElement('input');
    nameInput.type = 'text'; nameInput.placeholder = 'Name'; nameInput.value = draft.name;
    nameInput.addEventListener('input', () => { draft.name = nameInput.value; });
    const levelRow = document.createElement('div');
    levelRow.className = 'field-row';
    const minInput = document.createElement('input');
    minInput.type = 'number'; minInput.placeholder = 'Level von'; minInput.value = draft.levelMin;
    minInput.addEventListener('input', () => { draft.levelMin = minInput.value; });
    const maxInput = document.createElement('input');
    maxInput.type = 'number'; maxInput.placeholder = 'Level bis'; maxInput.value = draft.levelMax;
    maxInput.addEventListener('input', () => { draft.levelMax = maxInput.value; });
    levelRow.append(minInput, maxInput);
    const addBtn = document.createElement('button');
    addBtn.type = 'button'; addBtn.className = 'btn'; addBtn.textContent = 'Zone erstellen';
    addBtn.addEventListener('click', () => {
      const zone = board.addZone(draft.type, draft.name.trim() || CONFIG.ZONE_TYPE_LABELS[draft.type]);
      zone.levelMin = draft.levelMin === '' ? null : parseInt(draft.levelMin, 10);
      zone.levelMax = draft.levelMax === '' ? null : parseInt(draft.levelMax, 10);
      tool.currentZoneId = zone.id;
      this.app.selection.selectZone(zone.id);
      this._newZoneDraft = { type: draft.type, name: '', levelMin: '', levelMax: '' };
      this._renderToolOptions();
    });
    wrap.append(nameInput, levelRow, addBtn);
    body.appendChild(wrap);
  }

  _buildLayerList() {
    this.el.layerList.innerHTML = '';
    for (const layer of this.app.layerManager.list()) {
      const row = document.createElement('div');
      row.className = 'layer-row';
      const name = document.createElement('span');
      name.className = 'layer-name';
      name.textContent = layer.name;
      const visibleBtn = document.createElement('button');
      visibleBtn.textContent = layer.visible ? '👁' : '🚫';
      visibleBtn.className = layer.visible ? 'on' : '';
      visibleBtn.title = 'Sichtbarkeit umschalten';
      visibleBtn.addEventListener('click', () => {
        this.app.layerManager.toggleVisible(layer.key);
        this.app.renderer.requestRender();
        this._buildLayerList();
      });
      const lockBtn = document.createElement('button');
      lockBtn.textContent = layer.locked ? '🔒' : '🔓';
      lockBtn.className = layer.locked ? 'locked' : '';
      lockBtn.title = 'Sperren umschalten';
      lockBtn.addEventListener('click', () => {
        this.app.layerManager.toggleLocked(layer.key);
        this._buildLayerList();
      });
      row.append(name, visibleBtn, lockBtn);
      this.el.layerList.appendChild(row);
    }
  }

  refreshInspector() {
    const sel = this.app.selection;
    const board = this.app.board;
    const body = this.el.inspectorBody;
    if (sel.tileCol == null) {
      body.innerHTML = '<span class="hint-text">Keine Kachel ausgewählt.</span>';
      return;
    }
    const tile = board.getTile(sel.tileCol, sel.tileRow);
    if (!tile) { body.innerHTML = '<span class="hint-text">Keine Kachel ausgewählt.</span>'; return; }
    const borders = CONFIG.BORDER_EDGES.filter(e => tile.borders[e]).join(', ') || '–';
    const terrainLabel = tile.terrain ? (board.getPaletteEntry('terrain', tile.terrain)?.label ?? tile.terrain) : '–';
    const buildingObj = board.findObjectAt('buildings', tile.col, tile.row);
    const eventObj = board.findObjectAt('events', tile.col, tile.row);
    const barrierObj = board.findObjectAt('barriers', tile.col, tile.row);
    const buildingLabel = this._describeObject(board, buildingObj);
    const eventLabel = this._describeObject(board, eventObj);
    const barrierLabel = this._describeObject(board, barrierObj);
    const zone = tile.zoneId ? board.getZoneById(tile.zoneId) : null;
    const zoneLabel = zone ? `${zone.name} (${CONFIG.ZONE_TYPE_LABELS[zone.type]})` : '–';
    body.innerHTML = `
      <div class="kv"><span>Position</span><b>${tile.col}, ${tile.row}</b></div>
      <div class="kv"><span>Gelände</span><b>${terrainLabel}</b></div>
      <div class="kv"><span>Zone</span><b>${zoneLabel}</b></div>
      <div class="kv"><span>Gebäude</span><b>${buildingLabel}</b></div>
      <div class="kv"><span>Event</span><b>${eventLabel}</b></div>
      <div class="kv"><span>Barriere</span><b>${barrierLabel}</b></div>
      <div class="kv"><span>Rahmen</span><b>${borders}</b></div>
    `;
  }

  _describeObject(board, obj) {
    if (!obj) return '–';
    const def = board.getPaletteEntry(obj.category, obj.typeId);
    const label = def?.label ?? obj.typeId;
    return `${label} (${obj.width}×${obj.height})`;
  }

  updateStatusBar() {
    const sel = this.app.selection;
    const board = this.app.board;
    this.el.statusCell.textContent = sel.hoverCol != null && board.isInBounds(sel.hoverCol, sel.hoverRow)
      ? `${sel.hoverCol}, ${sel.hoverRow}` : '–';
    this.el.statusZoom.textContent = `${Math.round(this.app.camera.zoom * 100)}%`;
    const def = this.TOOL_DEFS.find(t => t.key === this.app.toolManager.activeToolKey);
    this.el.statusTool.textContent = def ? def.label : '–';
    this.el.statusBoardSize.textContent = `${formatCm(board.cols * board.cellSizeCm)} × ${formatCm(board.rows * board.cellSizeCm)} cm`;
  }

  setStatusMessage(message, timeoutMs = 3000) {
    this.el.statusMessage.textContent = message;
    clearTimeout(this._statusTimer);
    if (timeoutMs > 0) this._statusTimer = setTimeout(() => { this.el.statusMessage.textContent = ''; }, timeoutMs);
  }

  _bindMenu() {
    const roots = document.querySelectorAll('.menu-root');
    for (const root of roots) {
      const btn = root.querySelector('.menu-btn');
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const wasOpen = root.classList.contains('open');
        for (const r of roots) r.classList.remove('open');
        if (!wasOpen) root.classList.add('open');
      });
    }
    document.addEventListener('click', () => { for (const r of roots) r.classList.remove('open'); });
    document.querySelectorAll('.menu-item[data-action]').forEach(item => {
      item.addEventListener('click', () => this._handleAction(item.dataset.action));
    });
  }

  _bindGlobalActions() {
    document.querySelectorAll('[data-action]:not(.menu-item)').forEach(el => {
      el.addEventListener('click', () => this._handleAction(el.dataset.action));
    });
    this.el.bgOpacity.addEventListener('input', () => {
      if (!this.app.board.background) return;
      this.app.board.background.opacity = parseFloat(this.el.bgOpacity.value);
      this.app.renderer.requestRender();
    });
    this.el.fileInputProject.addEventListener('change', async e => {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file) return;
      try {
        await this.app.storage.loadProjectFromFile(file);
        this.setStatusMessage('Projekt geladen.');
      } catch (err) {
        this.setStatusMessage('Fehler beim Laden: ' + err.message);
      }
    });
    this.el.fileInputImage.addEventListener('change', async e => {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file) return;
      const dataUrl = await readFileAsDataUrl(file);
      this.app.board.background = { src: dataUrl, opacity: 1 };
      this.app.iconCache.get(dataUrl);
      this.el.bgOpacity.value = 1;
      this.app.renderer.requestRender();
      this.setStatusMessage('Hintergrundbild geladen.');
    });
  }

  /** Public entry point for keyboard-driven zoom shortcuts (+/-/0/F), reusing the menu action logic. */
  handleZoomShortcut(action) { this._handleAction(action); }

  _handleAction(action) {
    const app = this.app;
    switch (action) {
      case 'new-project':
        if (window.confirm('Neues Projekt starten? Ungespeicherte Änderungen gehen verloren.')) {
          app.layerManager = new LayerManager();
          app.renderer.layerManager = app.layerManager;
          app.replaceBoard(new Board());
        }
        break;
      case 'save-json': app.storage.saveProjectAsJson(); this.setStatusMessage('JSON gespeichert.'); break;
      case 'save-html': app.storage.saveProjectAsHtml(); this.setStatusMessage('HTML gespeichert.'); break;
      case 'load-project': this.el.fileInputProject.click(); break;
      case 'load-background': this.el.fileInputImage.click(); break;
      case 'remove-background':
        app.board.background = null;
        app.renderer.requestRender();
        break;
      case 'export-png': app.exporter.exportPng(); this.setStatusMessage('PNG exportiert.'); break;
      case 'export-json': app.exporter.exportJson(); this.setStatusMessage('JSON exportiert.'); break;
      case 'export-html': app.exporter.exportHtml(); this.setStatusMessage('HTML exportiert.'); break;
      case 'undo': app.history.undo(); this.refreshAll(); app.renderer.requestRender(); break;
      case 'redo': app.history.redo(); this.refreshAll(); app.renderer.requestRender(); break;
      case 'zoom-in': app.camera.zoomAt(app.canvasEl.clientWidth / 2, app.canvasEl.clientHeight / 2, 1.2); app.renderer.requestRender(); this.updateStatusBar(); break;
      case 'zoom-out': app.camera.zoomAt(app.canvasEl.clientWidth / 2, app.canvasEl.clientHeight / 2, 1 / 1.2); app.renderer.requestRender(); this.updateStatusBar(); break;
      case 'zoom-reset': app.camera.setZoom(1, app.canvasEl.clientWidth, app.canvasEl.clientHeight); app.renderer.requestRender(); this.updateStatusBar(); break;
      case 'zoom-fit': app.camera.fitToBoard(app.board, app.canvasEl.clientWidth, app.canvasEl.clientHeight); app.renderer.requestRender(); this.updateStatusBar(); break;
      case 'apply-board-size': this._applyBoardSize(); break;
    }
  }

  _applyBoardSize() {
    const app = this.app;
    const newCols = clamp(Math.round(parseFloat(this.el.boardCols.value)) || app.board.cols, CONFIG.MIN_BOARD_DIMENSION, CONFIG.MAX_BOARD_DIMENSION);
    const newRows = clamp(Math.round(parseFloat(this.el.boardRows.value)) || app.board.rows, CONFIG.MIN_BOARD_DIMENSION, CONFIG.MAX_BOARD_DIMENSION);
    const newCellSize = clamp(parseFloat(this.el.boardCellSize.value) || app.board.cellSizeCm, CONFIG.MIN_CELL_SIZE_CM, CONFIG.MAX_CELL_SIZE_CM);
    const shrinking = newCols < app.board.cols || newRows < app.board.rows;
    if (shrinking && !window.confirm('Board verkleinern? Kacheln außerhalb der neuen Größe gehen verloren.')) {
      this.refreshAll();
      return;
    }
    app.board.resize(newCols, newRows);
    app.board.setCellSize(newCellSize);
    app.selection.clearTileSelection();
    app.history.reset();
    app.camera.fitToBoard(app.board, app.canvasEl.clientWidth, app.canvasEl.clientHeight);
    app.renderer.requestRender();
    this.refreshAll();
    this.setStatusMessage('Board aktualisiert.');
  }
}

/* =========================================================================
 * App
 * ========================================================================= */
class App {
  constructor() {
    this.canvasEl = document.getElementById('board-canvas');
    this.containerEl = document.getElementById('canvas-container');
    this.board = new Board();
    this.camera = new Camera();
    this.layerManager = new LayerManager();
    this.selection = new Selection();
    this.history = new HistoryManager(() => this.ui && this.ui.refreshAll());
    this.iconCache = new IconCache(() => this.renderer.requestRender());
    this.toolManager = new ToolManager(this);
    this.renderer = new Renderer(this.canvasEl, this.board, this.camera, this.layerManager, this.selection, this.iconCache, this.toolManager);
    this.storage = new StorageManager(this);
    this.exporter = new Exporter(this);
    this.ui = new UIController(this);
  }

  init() {
    this.toolManager.attach(this.canvasEl);
    this.ui.init();
    this._observeResize();
    this._loadEmbeddedOrAutosave();
    this.canvasEl.style.cursor = this.toolManager.getActiveTool().cursor;
    this._startAutosave();
    this._startRenderLoop();
  }

  /** Swaps in a fresh Board instance (new project, project load) and resets everything derived from it. */
  replaceBoard(newBoard) {
    this.board = newBoard;
    this.renderer.board = newBoard;
    this.selection = new Selection();
    this.renderer.selection = this.selection;
    this.history.reset();
    this.renderer.requestRender();
    this.ui.refreshAll();
  }

  _observeResize() {
    const resize = () => {
      const rect = this.containerEl.getBoundingClientRect();
      this.renderer.resizeToContainer(rect.width, rect.height);
    };
    new ResizeObserver(resize).observe(this.containerEl);
    resize();
  }

  _loadEmbeddedOrAutosave() {
    const embedded = document.getElementById('embedded-project-data');
    const raw = embedded ? embedded.textContent.trim() : 'null';
    if (raw && raw !== 'null') {
      try {
        ProjectSerializer.deserialize(this, JSON.parse(raw));
        this.camera.fitToBoard(this.board, this.canvasEl.clientWidth, this.canvasEl.clientHeight);
        return;
      } catch (err) {
        console.warn('Eingebettete Projektdaten konnten nicht geladen werden:', err);
      }
    }
    if (this.storage.hasAutosave() && this.storage.loadAutosave()) {
      this.ui.setStatusMessage('Autosave wiederhergestellt.');
    }
    this.camera.fitToBoard(this.board, this.canvasEl.clientWidth, this.canvasEl.clientHeight);
  }

  _startAutosave() {
    setInterval(() => this.storage.autosave(), CONFIG.AUTOSAVE_INTERVAL_MS);
    window.addEventListener('beforeunload', () => this.storage.autosave());
  }

  _startRenderLoop() {
    const loop = () => {
      this.renderer.renderIfNeeded();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const app = new App();
  app.init();
});
</script>
