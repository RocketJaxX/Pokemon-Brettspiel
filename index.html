<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokémon-Brettspiel Kanto – Spielsystem (Single Source of Truth)</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#33291f; --paper:#fffdf6; --paper2:#e8e2d6; --line:#d8cfbc;
  --gold:#c8940f; --gold2:#e3b52a; --rot:#d6452f; --blau:#2f7fc4; --gruen:#59b04a;
  --panel:#fffdf6;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Nunito',sans-serif; color:var(--ink); background:var(--paper2);}
h1,h2,h3,.brand,.fr{font-family:'Fredoka',sans-serif;}
button{font-family:'Fredoka',sans-serif; cursor:pointer; border:none; border-radius:8px;}
select, input[type=number]{font-family:'Nunito',sans-serif; font-weight:700;}

/* ===== Nav ===== */
nav.topnav{position:sticky; top:0; z-index:100; background:var(--ink); color:#fff;
  display:flex; align-items:center; gap:4px; padding:0 10px; box-shadow:0 2px 10px rgba(0,0,0,.25);
  flex-wrap:wrap;}
nav.topnav .brand{font-weight:700; font-size:16px; padding:10px 14px 10px 4px; color:var(--gold2); white-space:nowrap;}
nav.topnav button.tab{background:transparent; color:#e8e2d6; font-size:14px; font-weight:600;
  padding:12px 16px; border-radius:0; position:relative;}
nav.topnav button.tab:hover{background:rgba(255,255,255,.08);}
nav.topnav button.tab.active{color:#fff; background:rgba(255,255,255,.12);}
nav.topnav button.tab.active::after{content:''; position:absolute; left:10px; right:10px; bottom:0; height:3px;
  background:var(--gold2); border-radius:2px 2px 0 0;}
nav.topnav .spacer{flex:1;}
nav.topnav .savehint{font-size:11px; color:#b0a68f; font-weight:700; padding:0 10px; white-space:nowrap;}

.page{display:none; padding:14px;}
.page.active{display:block;}

/* ===== Reiter-Zoom =====
   Bewusst "zoom" und nicht "transform:scale": zoom skaliert das LAYOUT mit, d.h. Umbrüche,
   Scrollbereiche und Klickflächen stimmen weiter. Ein transform:scale würde den Inhalt nur
   optisch dehnen, die Seite behielte ihre alte Kastengröße und der Inhalt liefe unter die
   Nachbarelemente. Der Zoom sitzt auf .page – die Kopfzeile liegt außerhalb und bleibt
   deshalb in Originalgröße, anders als beim Browser-Zoom.
   --zf trägt denselben Faktor als Zahl; wer mit Viewport-Einheiten rechnet (100vh), muss
   durch --zf teilen, weil vh von der Skalierung nicht erfasst wird und der Bereich sonst
   um genau den Zoomfaktor zu hoch würde. */
.zoombar{position:fixed; right:14px; bottom:14px; z-index:200; display:flex; align-items:center; gap:2px;
  background:var(--ink); color:#e8e2d6; border-radius:999px; padding:3px; box-shadow:0 3px 12px rgba(0,0,0,.3);
  opacity:.42; transition:opacity .15s;}
.zoombar:hover{opacity:1;}
.zoombar button{background:transparent; color:#e8e2d6; font-size:15px; font-weight:700; line-height:1;
  width:26px; height:26px; border-radius:50%;}
.zoombar button:hover{background:rgba(255,255,255,.14);}
.zoombar button:disabled{opacity:.3; cursor:default; background:transparent;}
.zoombar .zval{font-family:'Fredoka',sans-serif; font-size:12px; font-weight:600; min-width:46px; height:26px;
  border-radius:13px; padding:0 4px;}

@media print{
  nav.topnav{display:none;}
  .page{padding:0; zoom:1 !important;}   /* Ausdruck immer 1:1 – der Bildschirmzoom darf Papiermaße nicht verändern */
  body{background:#fff;}
  .noprint{display:none !important;}
  .zoombar{display:none !important;}
}

/* ===== Home: Pokémon-Tabelle ===== */
.home-toolbar{margin-bottom:10px;}
.home-toolbar h1{font-size:20px; margin-bottom:2px;}
.home-toolbar .hint{font-size:12.5px; color:#5c5344; font-weight:700; max-width:900px;}
/* Durch --zf geteilt, weil vh vom Reiter-Zoom nicht erfasst wird: ohne die Teilung wäre der
   Scrollbereich bei 150 % genau 1,5-mal so hoch wie das Fenster und der untere Rand der
   Tabelle läge unerreichbar unterhalb des sichtbaren Bereichs. */
.hometable-wrap{overflow:auto; max-height:calc((100vh - 140px) / var(--zf, 1)); border:1px solid var(--line);
  border-radius:8px; background:#fff; scrollbar-color:#a89a7c #efe8d6; scrollbar-width:auto;}
.hometable-wrap::-webkit-scrollbar{width:14px; height:14px;}
.hometable-wrap::-webkit-scrollbar-track{background:#efe8d6;}
.hometable-wrap::-webkit-scrollbar-thumb{background:#a89a7c; border-radius:7px; border:3px solid #efe8d6;}
.hometable-wrap::-webkit-scrollbar-thumb:hover{background:#8a7f6d;}
.hometable-wrap::-webkit-scrollbar-corner{background:#efe8d6;}
table.hometable{table-layout:fixed; border-collapse:separate; border-spacing:0; font-size:11.5px; white-space:nowrap;}
table.hometable th, table.hometable td{border:1px solid var(--line); padding:2px 3px; text-align:center;
  background:#fff; overflow:hidden; text-overflow:ellipsis;}
table.hometable thead th{position:sticky; background:var(--ink); color:#fff; font-family:'Fredoka',sans-serif;
  font-weight:600; z-index:20;}
table.hometable thead tr:first-child th{top:0; height:26px;}
table.hometable thead tr:first-child th.fixedhead{height:100px;}
table.hometable th.scrollhead{height:100px; background:#4a3f2f; color:#efe8d6; font-weight:800; font-size:10.5px;}
table.hometable thead tr:last-child th{top:26px; height:74px; padding:2px 1px;}
table.hometable th.regionhead{font-size:10.5px; letter-spacing:.3px; background:#4a3f2f;}
table.hometable th.areahead{background:#544636;}
.areahead-in{writing-mode:vertical-rl; transform:rotate(180deg); font-size:9.5px; font-weight:700;
  white-space:nowrap; margin:0 auto; letter-spacing:.2px;}
table.hometable td.sticky, table.hometable th.sticky{position:sticky; z-index:6;}
table.hometable th.fixedhead{z-index:25;}
table.hometable td.nameCell{text-align:left; font-weight:800; font-family:'Fredoka',sans-serif; font-size:11px;}
table.hometable .rowimg{width:32px; height:32px; object-fit:contain; display:block; margin:0 auto;}
table.hometable td.areacell{background:#faf8f2;}
table.hometable select.sterne-sel{font-size:11px; color:var(--gold); font-weight:900; border:1px solid var(--line);
  border-radius:4px; padding:1px; width:100%;}
table.hometable select.sig-sel, table.hometable select.typ-sel{font-size:10.5px; color:var(--ink); font-weight:700;
  border:1px solid var(--line); border-radius:4px; padding:1px; width:100%;}
.typ-cell{display:flex; align-items:center; gap:3px; padding:0 2px 0 3px; border-radius:11px;
  background:var(--tc); box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);}
.typ-cell .typ-ico{width:15px; height:15px; flex:none; display:block;}
.typ-cell select.typ-sel{background:rgba(255,255,255,.92); border-color:transparent;}
.typchip{display:inline-flex; align-items:center; gap:3px; font-size:9.5px; font-weight:800; color:#fff;
  padding:1px 5px; border-radius:20px; text-shadow:0 1px 1px rgba(0,0,0,.35); white-space:nowrap;}
.typchip img{width:11px; height:11px;}
.typchip.empty{background:#ccc; color:#777; text-shadow:none;}
.ksym{font-weight:900; font-size:15px;}
.ksym.kA{color:#33291f;} .ksym.kB{color:#2f7fc4;} .ksym.kC{color:#c8940f;} .ksym.kNone{color:#bbb;}
.questbadge{background:var(--rot); color:#fff; font-size:8px; font-weight:800; padding:0 3px; border-radius:4px;}
table.hometable input[type=checkbox]{width:14px; height:14px; cursor:pointer;}


/* ===== Spielleiter-Karte ===== */
.gm-toolbar h1{font-size:20px; margin-bottom:2px;}
.gm-toolbar .hint{font-size:12.5px; color:#5c5344; font-weight:700; max-width:900px; margin-bottom:8px;}
.gm-toolbar button{background:var(--rot); color:#fff; padding:8px 16px; font-size:13px;}
.gmbox{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:14px;}
.gmbox h2{font-size:14px; margin-bottom:6px;}

.matrix-wrap{overflow-x:auto;}
table.typematrix{border-collapse:collapse; font-size:8.5px;}
table.typematrix th, table.typematrix td{border:1px solid var(--line); width:22px; height:22px; text-align:center; background:#f6f1e4;}
table.typematrix .corner{font-size:7px; color:#8a7f6d; width:70px; background:transparent; border:none;}
table.typematrix .vert{writing-mode:vertical-rl; transform:rotate(180deg); color:#fff; font-weight:800; font-size:7px;
  padding:2px 0; border-radius:2px; white-space:nowrap;}
table.typematrix .rowlab{color:#fff; font-weight:800; font-size:7.5px; padding:0 4px; border-radius:2px; text-align:left; white-space:nowrap;}
.c{display:inline-flex; align-items:center; justify-content:center; width:14px; height:14px; border-radius:50%;
  color:#fff; font-weight:900; font-size:11px; line-height:1;}
.c.plus{background:var(--gruen);} .c.minus{background:var(--rot);} .c.none{background:#111;}
.legend{display:flex; gap:12px; flex-wrap:wrap; font-size:11px; font-weight:800; margin:8px 0;}
.ruleul{margin-left:16px; font-size:11.5px; line-height:1.5;}

.section-title{font-size:16px; margin:14px 0 8px; border-bottom:2px solid var(--gold2); display:inline-block; padding-bottom:2px;}
.questgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px; margin-bottom:10px;}
.questrow{display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line);
  border-radius:8px; padding:6px 8px; font-size:11px;}
.questrow img{width:34px; height:34px; object-fit:contain;}
.questrow .pid{color:#8a7f6d; font-weight:700;}
.questrow .qtxt{color:#5c5344; font-weight:700;}

.region-title{font-size:15px; margin:16px 0 6px; color:var(--ink); font-family:'Fredoka',sans-serif;}

/* ===== Gebietszeilen (Original-Layout: Spalten nach Sternen) ===== */
#page-gm .gm-screen .starhead{display:grid; grid-template-columns:150px 2fr 2fr 2fr 1fr; gap:6px;
  font-family:'Fredoka',sans-serif; font-size:11px; margin-bottom:4px;}
#page-gm .gm-screen .starhead > div{background:var(--ink); color:var(--gold2); border-radius:5px; text-align:center; padding:4px 0;}
#page-gm .gm-screen .starhead .sh0{color:#fff;}
#page-gm .gm-screen .arearow{display:grid; grid-template-columns:150px 2fr 2fr 2fr 1fr; gap:6px; margin-bottom:6px;}
#page-gm .gm-screen .areahead{background:var(--tc); color:#fff; border-radius:6px; padding:6px 8px;
  display:flex; flex-direction:column; justify-content:center; gap:2px; text-shadow:0 1px 2px rgba(0,0,0,.35);}
#page-gm .gm-screen .aname{font-family:'Fredoka',sans-serif; font-size:13px; line-height:1.1;}
#page-gm .gm-screen .terr{font-size:10.5px; font-weight:800; opacity:.95;}
#page-gm .gm-screen .niete{font-size:10px; font-weight:800; background:rgba(0,0,0,.3); border-radius:4px;
  padding:1px 6px; align-self:flex-start;}
#page-gm .gm-screen .scell{background:#fbf8ef; border:1px solid var(--line); border-radius:7px;
  display:grid; grid-template-columns:repeat(2,1fr); gap:4px; align-items:start; justify-items:center;
  align-content:center; padding:4px 3px;}
#page-gm .gm-screen .dash{color:#cfc6b0; font-weight:800; font-size:14px; grid-column:1/-1;}
#page-gm .gm-screen .mon{width:100%; text-align:center; display:flex; flex-direction:column; align-items:center;}
#page-gm .gm-screen .mon img{width:22px; height:22px; object-fit:contain;}
#page-gm .gm-screen .mon .rng{font-family:'Fredoka',sans-serif; font-size:9.5px; background:var(--ink); color:#fff;
  border-radius:4px; padding:0 5px; margin-bottom:1px; white-space:nowrap;}
#page-gm .gm-screen .mon .mname{font-size:9px; font-weight:800; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
#page-gm .gm-screen .mon .meta{font-size:8px; font-weight:800; color:#8a7f6d;}
#page-gm .gm-screen .mon .meta .kl{color:#111; font-size:9.5px;}
@media (max-width:1000px){
  #page-gm .gm-screen .starhead, #page-gm .gm-screen .arearow{grid-template-columns:110px 1fr 1fr 1fr 1fr;}
}
.gm-print{display:none;}

/* ===== Druckvorlage GM: A4 quer -> 2x A5 (an der kurzen Kante gespiegelt duplex) ===== */
.gm-print .sheet{width:297mm; height:209.9mm; margin:0 auto 14px; background:#fffdf6; position:relative;
  box-shadow:0 2px 12px rgba(0,0,0,.15); display:flex;}
.gm-print .sheetlab{position:absolute; bottom:1.2mm; right:3mm; font-size:6.5pt; color:#b0a68f; font-weight:800; z-index:2;}
.gm-print .cut{position:absolute; left:148.5mm; top:0; bottom:0; border-left:0.35mm dashed #9a8f78; transform:translateX(-50%);}
.gm-print .cut span{position:absolute; top:1mm; left:50%; transform:translateX(-50%); font-size:7.5pt;
  color:#9a8f78; background:#fffdf6; padding:0 1px;}
.gm-print .a5{width:148.5mm; height:209.9mm; position:relative; overflow:hidden;}
.gm-print .a5in{padding:5mm 6mm 3mm;}

/* ===== Druckvorlage Spielanleitung: A4 quer -> 2x A5, gefalzt (Beschluss 29.07.2026) =====
   Eigener Namensraum (nicht .gm-print!): Die echten Handbuch-Klassen (u. a. table.typematrix,
   .starhead, .arearow) tauchen auch in den (toten, nie aufgerufenen) .gm-print-Kartenregeln
   auf – unter .gm-print gerendert, erbten sie versehentlich deren Schriftgrößen/-umbruchregeln
   und wichen dadurch von der Höhenmessung (hbMeasure, misst nur unter .hb) ab, was Inhalte auf
   die nächste Blattseite überlaufen ließ. */
.hb-print{display:none;}
.hb-print .sheet{width:297mm; height:209.9mm; margin:0 auto 14px; background:#fffdf6; position:relative;
  box-shadow:0 2px 12px rgba(0,0,0,.15); display:flex; overflow:hidden;}
.hb-print .sheetlab{position:absolute; bottom:1.2mm; right:3mm; font-size:6.5pt; color:#b0a68f; font-weight:800; z-index:2;}
.hb-print .fold{position:absolute; left:148.5mm; top:0; bottom:0; border-left:0.15mm dashed #d8cfbc; transform:translateX(-50%);}
.hb-print .a5{width:148.5mm; height:209.9mm; position:relative; overflow:hidden;}
/* A4-Innenseite (210×296.8mm) auf die A5-Hälfte skaliert (Faktor 148.5/210 = 0,707143 –
   deckungsgleich mit der Verkleinerung A4→A5). Bewusst mit "zoom" statt "transform:scale" –
   Chromiums Druck-Paginierung bemisst Seitenumbrüche bei transformierten Boxen an der
   UNSKALIERTEN Größe, "zoom" skaliert dagegen auch das Layout. */
.hb-print .hb-scalewrap{zoom:0.707143;}
.gm-print h1{font-family:'Fredoka',sans-serif; font-size:13px; margin-bottom:2mm;}
.gm-print .sub{font-size:8px; color:#8a7f6d; font-weight:800; margin:-1mm 0 2mm;}

.gm-print table.typematrix{border-collapse:collapse; margin:0 auto; font-size:5.4px;}
.gm-print table.typematrix th, .gm-print table.typematrix td{border:0.5px solid var(--line); text-align:center; vertical-align:middle;}
.gm-print table.typematrix td{width:6.6mm; height:6.6mm; background:#f6f1e4;}
.gm-print table.typematrix .corner{border:none; background:transparent; font-size:5.8px; color:#8a7f6d;
  text-align:right; padding-right:2px; font-weight:800; width:15mm; line-height:1.4;}
.gm-print table.typematrix .vert{writing-mode:vertical-rl; transform:rotate(180deg); color:#fff; font-weight:800;
  font-size:5.4px; padding:3px 1px; border-radius:2px; margin:0.5px auto; letter-spacing:.3px;
  min-height:12.5mm; display:flex; align-items:center; justify-content:center;}
.gm-print table.typematrix .rowlab{color:#fff; font-weight:800; font-size:5.4px; padding:2.4px 3px; border-radius:2px;
  margin:0.5px; text-align:left; letter-spacing:.3px;}
.gm-print .c{width:4.4mm; height:4.4mm; font-size:9.5px;}
.gm-print .legend{font-size:8px; margin-top:2.5mm;}
.gm-print .legend .c{width:3.6mm; height:3.6mm; font-size:8px; margin-right:2px;}
.gm-print .ruleul{font-size:8px; margin-left:3mm; line-height:1.5;}


.gm-print .starhead{display:grid; grid-template-columns:17mm 31mm 31mm 31mm 14mm; gap:1mm;
  font-family:'Fredoka',sans-serif; font-size:8px; margin-bottom:1mm;}
.gm-print .starhead > div{background:var(--ink); color:var(--gold); border-radius:1.4mm; text-align:center;
  padding:0.6mm 0; letter-spacing:0.3px;}
.gm-print .starhead .sh0{color:#fff;}
.gm-print .arearow{display:grid; grid-template-columns:17mm 31mm 31mm 31mm 14mm; gap:1mm;
  margin-bottom:1mm; page-break-inside:avoid;}
.gm-print .areahead{background:var(--tc); color:#fff; border-radius:1.6mm; padding:1mm 1.4mm;
  display:flex; flex-direction:column; justify-content:center; gap:0.3mm; text-shadow:0 1px 2px rgba(0,0,0,.35);}
.gm-print .aname{font-family:'Fredoka',sans-serif; font-size:7.8px; line-height:1.1;}
.gm-print .terr{font-size:6.2px; font-weight:800;}
.gm-print .niete{font-size:6.2px; font-weight:800; background:rgba(0,0,0,.3); border-radius:1mm;
  padding:0.2mm 1mm; align-self:flex-start; white-space:nowrap;}
.gm-print .scell{background:#fbf8ef; border:0.5px solid var(--line); border-radius:1.6mm;
  display:grid; grid-template-columns:repeat(2,1fr); gap:0.5mm; align-items:start; justify-items:center;
  align-content:center; padding:0.7mm 0.3mm;}
.gm-print .dash{color:#cfc6b0; font-weight:800; font-size:8px; grid-column:1/-1;}
.gm-print .mon{width:100%; text-align:center; display:flex; flex-direction:column; align-items:center;}
.gm-print .mon img{width:5.2mm; height:5.2mm; object-fit:contain;}
.gm-print .mon .rng{font-family:'Fredoka',sans-serif; font-size:7.2px; background:var(--ink); color:#fff;
  border-radius:1mm; padding:0 1.4mm; margin-bottom:0.2mm; white-space:nowrap;}
.gm-print .mon .mname{font-size:6.1px; font-weight:800; line-height:1.05; white-space:nowrap; max-width:none;}
.gm-print .mon .meta{font-size:5.6px; font-weight:800; color:#8a7f6d;}
.gm-print .mon .meta .kl{color:#111; font-size:6.4px;}

.gm-print .qhead{font-size:8px; font-weight:800; color:#5c5344; margin:1mm 0 2mm; line-height:1.4;}
.gm-print .questgrid{display:grid; grid-template-columns:1fr 1fr; gap:1.6mm;}
.gm-print .questrow{display:flex; gap:1.6mm; align-items:center; border:0.5px solid var(--line);
  border-radius:1.6mm; padding:1.2mm 1.6mm; background:#fbf8ef; font-size:8.4px;}
.gm-print .questrow img{width:8.5mm; height:8.5mm; object-fit:contain;}
.gm-print .questrow .qtxt{color:#5c5344; font-weight:700; font-size:7.2px; line-height:1.3;}

@media print{
  #page-gm .gm-screen{display:none !important;}
  #page-gm .hb-print{display:block !important;}
  #page-gm .hb-print .sheet{margin:0; box-shadow:none; page-break-after:always;}
  #page-gm .hb-print .sheet:last-child{page-break-after:auto;}
  #page-gm .hb-print .hb-scalewrap .hb-page{page-break-after:auto; break-after:auto;}
}


/* ===== Kartenset ===== */
.cards-toolbar{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:12px;}
.cards-toolbar h1{font-size:20px;}
.cards-toolbar label{font-weight:800; display:flex; align-items:center; gap:5px; cursor:pointer; font-size:13px;}
.cards-toolbar button{background:var(--rot); color:#fff; padding:8px 16px; font-size:13px;}
.cards-toolbar .hint{font-size:11px; color:#8a7f6d; font-weight:700; width:100%;}

#page-cards .sheet{width:210mm; height:296.5mm; margin:0 auto 14px; background:var(--paper); position:relative;
  box-shadow:0 2px 12px rgba(0,0,0,.15); display:flex; align-items:center; justify-content:center;}
#page-cards .sheetlab{position:absolute; bottom:2mm; left:0; right:0; text-align:center; font-size:7pt;
  color:#b0a68f; font-weight:800;}
#page-cards .grid{display:grid; grid-template-columns:repeat(3,63.5mm); grid-template-rows:repeat(3,88mm); gap:2mm;}

/* Kartenfläche: Typfarbe + Lichtverlauf + feine Wolkenstruktur (feTurbulence als Data-URI).
   Der Verlauf hellt oben links auf und dunkelt unten rechts ab, die Wolken liegen im
   Soft-Light-Modus darüber – zusammen nimmt das der Fläche die Eintönigkeit, ohne dass
   der weiße Text darauf an Kontrast verliert. */
#page-cards .card{width:63.5mm; height:88mm; position:relative; border-radius:2.4mm; overflow:hidden;
  background-color:var(--bg1);
  background-image:
    url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='240' height='240'%3E%3Cfilter id='w'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.012' numOctaves='5' seed='11' result='n'/%3E%3CfeColorMatrix type='saturate' values='0' in='n' result='g'/%3E%3CfeComponentTransfer in='g'%3E%3CfeFuncR type='linear' slope='2.4' intercept='-0.7'/%3E%3CfeFuncG type='linear' slope='2.4' intercept='-0.7'/%3E%3CfeFuncB type='linear' slope='2.4' intercept='-0.7'/%3E%3C/feComponentTransfer%3E%3C/filter%3E%3Crect width='240' height='240' filter='url(%23w)'/%3E%3C/svg%3E"),
    radial-gradient(ellipse 78% 52% at 76% 10%, rgba(255,255,255,.42), rgba(255,255,255,0) 72%),

.hb table.typematrix td{width:8.4mm; height:8.4mm; background:#f6f1e4;}

.hb .legend{display:flex; gap:5mm; flex-wrap:wrap; font-size:9.5pt; font-weight:700; margin-top:3mm; align-items:center;}

.hb .ruleul{font-size:9.5pt; margin:2mm 0 0 4mm; line-height:1.5;}
.hb-toolbar{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:12px;}
.hb-toolbar h1{font-size:20px; margin:0;}

/* ===== Beschlüsse-Dokument ===== */
#page-doc{max-width:900px; margin:0 auto; padding:18px 16px 60px;}
.docmeta{background:var(--panel); border-radius:10px; padding:10px 16px; margin-bottom:14px;
  font-size:12.5px; color:#7a7060; font-weight:700; box-shadow:0 2px 8px rgba(0,0,0,.06);}
.doctoc{background:var(--panel); border-radius:10px; padding:14px 18px; margin-bottom:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);}
.doctoc h2{font-size:15px; margin-bottom:8px;}
.doctoc ol{margin-left:20px; columns:2; column-gap:24px;}
.doctoc li{font-size:13px; padding:2px 0;}
.doctoc a{color:var(--blau); text-decoration:none; font-weight:700;}
.doctoc a:hover{text-decoration:underline;}
.dchapter{background:var(--panel); border-radius:12px; padding:18px 22px; margin-bottom:16px;
  box-shadow:0 2px 10px rgba(0,0,0,.08); scroll-margin-top:70px;}
.dchapter h2{font-size:18px; color:var(--ink); border-bottom:2px solid var(--gold2); padding-bottom:6px; margin-bottom:10px;}
.dchapter h3{font-size:14px; color:var(--rot); margin:14px 0 6px;}
.dchapter p{font-size:13.5px; line-height:1.55; margin-bottom:8px;}
.dchapter ul, .dchapter ol{margin:6px 0 10px 20px;}
.dchapter li{font-size:13.5px; line-height:1.55; margin-bottom:3px;}
.dchapter table{width:100%; border-collapse:collapse; margin:8px 0 12px; font-size:12.5px;}
.dchapter th{background:var(--ink); color:#fff; padding:4px 8px; text-align:left;}
.dchapter td{padding:4px 8px; border-bottom:1px solid var(--line);}
.dchapter tr:nth-child(even) td{background:#f7f2e4;}
.badge{display:inline-block; font-size:10.5px; font-weight:800; padding:1px 8px; border-radius:8px;

.badge.open{background:#c0392b;}
.badge.idea{background:var(--blau);}
.dchapter li.doc-done-wrap{list-style:none; margin-left:-20px; margin-bottom:8px;}
.dchapter details.doc-done{background:#f7f2e4; border:1px solid var(--line); border-radius:8px; padding:2px 12px;}
.dchapter details.doc-done summary{cursor:pointer; font-weight:800; color:#5c5344; font-size:13px; padding:7px 0; list-style:revert;}
.dchapter details.doc-done[open] summary{border-bottom:1px solid var(--line); margin-bottom:4px;}
.dchapter details.doc-done ul{margin:4px 0 8px 20px;}
.formula{background:#f7f2e4; border-left:3px solid var(--gold); padding:6px 10px; margin:8px 0;

.note{background:#fdf0e0; border-left:3px solid var(--rot); padding:6px 10px; margin:8px 0;

@media print{ #page-doc{max-width:none;} .dchapter{box-shadow:none; break-inside:avoid;} }

/* ===== Konzept-Labor (Ideen testen, nichts davon ist beschlossen oder wird gedruckt) ===== */

.kzbox{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 20px; margin-bottom:16px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);}
.kzbox h2{font-size:16px; color:var(--ink); border-bottom:2px solid var(--gold2); padding-bottom:5px; margin-bottom:10px;}

.kzbox ul{margin:5px 0 9px 20px; font-size:13px; line-height:1.55;}
.kzbox li{margin-bottom:3px;}
.kzbox code{background:#f2ecdc; padding:0 4px; border-radius:3px; font-size:12px;}
.kz-flex{display:flex; gap:22px; flex-wrap:wrap; align-items:flex-start;}
.kz-panel{flex:1; min-width:290px;}

.kz-read .t{font-size:10px; font-weight:800; color:#8a7f6d; text-transform:uppercase; letter-spacing:.4px;}
.kz-read .v{font-family:'Fredoka',sans-serif; font-size:26px; color:var(--rot); line-height:1.15;}
.kz-note{background:#fdf0e0; border-left:3px solid var(--rot); padding:7px 11px; margin:9px 0; font-size:12px;

.kz-ok{background:#eef5ec; border-left:3px solid var(--gruen); padding:7px 11px; margin:9px 0; font-size:12px;

.kz-formel{background:#f7f2e4; border-left:3px solid var(--gold); padding:6px 10px; margin:8px 0;
  font-weight:800; font-size:12.5px; border-radius:0 6px 6px 0;}
table.kztable{border-collapse:collapse; font-size:12px; margin-top:6px;}
table.kztable th{background:var(--ink); color:#fff; padding:4px 9px; text-align:left;
  font-family:'Fredoka',sans-serif; font-weight:600; font-size:11.5px;}
table.kztable td{padding:3px 9px; border-bottom:1px solid var(--line);}
table.kztable tr.hi td{background:#fdf3d4; font-weight:800;}
#page-konzept .kz-n{font-size:12px; font-weight:800; text-anchor:middle; dominant-baseline:central;
  font-family:'Nunito',sans-serif;}
#page-konzept .kz-siege{fill:#a89a7c; font-size:11px;}
#page-konzept .kz-lvl{fill:#33291f;}
#page-konzept .kz-akt{fill:#1f6b2f;}
#page-konzept .kz-aus{fill:#d3cab4;}
#page-konzept .kz-hub{fill:#e3b52a; font-size:14px; text-anchor:middle; font-family:'Fredoka',sans-serif;}
#page-konzept .kz-hubv{fill:#fff; font-size:38px; text-anchor:middle; font-family:'Fredoka',sans-serif;}
#page-konzept .kz-tab{fill:#fff; font-size:11px; font-weight:800; text-anchor:middle; dominant-baseline:central;
  font-family:'Nunito',sans-serif;}
#page-konzept .kz-rlab{fill:#8a7f6d; font-size:10.5px; font-weight:800; dominant-baseline:central;
  font-family:'Nunito',sans-serif;}
#page-konzept .kz-ksym{font-size:21px; text-anchor:middle; font-family:'Nunito',sans-serif;}
#page-konzept .kz-ksym.an{fill:#33291f;}
#page-konzept .kz-ksym.aus{fill:#ddd5c2;}
#page-konzept .kz-glab{fill:#8a7f6d; font-size:12px; font-weight:800; text-anchor:middle; font-family:'Nunito',sans-serif;}
#page-konzept .kz-vlab{fill:#33291f; font-size:13px; font-weight:800; font-family:'Fredoka',sans-serif;}
#page-konzept .kz-formelsvg{fill:#8a2f1f; font-size:13px; font-weight:800; font-family:'Nunito',sans-serif;}
/* Konzeptkarte – alle Größen in mm, die Karte wird als Ganzes skaliert gezeichnet */
#page-konzept .kk-n{text-anchor:middle; dominant-baseline:central; font-weight:800; font-family:'Nunito',sans-serif;}
#page-konzept .kk-siege{fill:#a89a7c;}
#page-konzept .kk-lvl{fill:#33291f;}
#page-konzept .kk-akt{fill:#1f6b2f;}
#page-konzept .kk-aus{fill:#ddd5c2;}
#page-konzept .kk-name{fill:#fff; font-size:5.6px; font-family:'Fredoka',sans-serif;
  paint-order:stroke; stroke:rgba(0,0,0,.35); stroke-width:.6px;}
#page-konzept .kk-nr{fill:#fff; font-size:3.6px; font-weight:800; text-anchor:end; font-family:'Fredoka',sans-serif;
  paint-order:stroke; stroke:rgba(0,0,0,.3); stroke-width:.5px;}
#page-konzept .kk-pill{fill:#fff; font-size:2.5px; font-weight:800; text-anchor:middle; dominant-baseline:central;
  font-family:'Nunito',sans-serif;}
#page-konzept .kk-lab{fill:#fff; font-size:1.9px; font-weight:800; letter-spacing:.15px; dominant-baseline:central;
  font-family:'Nunito',sans-serif; paint-order:stroke; stroke:rgba(0,0,0,.4); stroke-width:.45px;}
#page-konzept .kk-lab.kk-r{text-anchor:end;} #page-konzept .kk-lab.kk-l{text-anchor:start;}
#page-konzept .kk-mini{fill:#8a7f6d; font-size:1.9px; font-weight:800; text-anchor:middle; font-family:'Nunito',sans-serif;}
#page-konzept .kk-angv{fill:#8a2f1f; font-size:3.4px; text-anchor:middle; font-family:'Fredoka',sans-serif;}
#page-konzept .kk-fang{fill:#33291f; font-size:2.5px; font-weight:800; font-family:'Nunito',sans-serif;}
#page-konzept .kk-fang.kk-r{text-anchor:end;}
#page-konzept .kk-fang2{fill:#33291f; font-size:2.1px; font-weight:800; font-family:'Nunito',sans-serif;}
#page-konzept .kk-fuss{fill:#f0d98a; font-size:4px; font-family:'Nunito',sans-serif;
  paint-order:stroke; stroke:rgba(0,0,0,.35); stroke-width:.5px;}
#page-konzept .kk-fuss.kk-r{text-anchor:end; fill:#fff;}
#page-konzept .kk-leer{fill:rgba(255,255,255,.35); stroke:none;}
#page-konzept .kk-mulde{fill:#8a7f6d; font-size:2.6px; font-weight:800; font-family:'Nunito',sans-serif;}
@media print{ #page-konzept{max-width:none;} }


/* ===== Volvellen: Karte fürs 3D-Druck-Gehäuse (Vorderseite + 2 Papierscheiben zum Aufkleben) ===== */
#page-volvelle{max-width:1400px; margin:0 auto; padding:16px;}
#page-volvelle .vol-toolbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  background:var(--panel); border-radius:10px; padding:10px 16px; margin-bottom:14px; box-shadow:0 2px 8px rgba(0,0,0,.06);}
#page-volvelle .vol-toolbar h1{font-size:16px;}
#page-volvelle .vol-toolbar .hint{font-size:11.5px; color:#8a7f6d; font-weight:700;}
#page-volvelle .vol-toolbar button{font-family:'Fredoka'; font-size:13px; padding:7px 14px; background:var(--rot); color:#fff; border-radius:8px;}
#page-volvelle .vol-note{background:#fdf0e0; border-left:3px solid var(--rot); border-radius:0 8px 8px 0;
  padding:8px 14px; margin-bottom:14px; font-size:12px; font-weight:700; line-height:1.5;}

#page-volvelle .vsheet{background:var(--paper); border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.1);
  padding:9mm; margin-bottom:14px; display:flex; gap:10mm; align-items:flex-start;}
#page-volvelle .vcol{display:flex; flex-direction:column; align-items:center; gap:5mm;}
#page-volvelle .vlbl{font-family:'Fredoka'; font-size:10px; color:#8a7f6d; text-align:center; margin-top:1mm;}
#page-volvelle svg{display:block;}
@media print{
  #page-volvelle .vol-toolbar, #page-volvelle .vol-note{display:none;}
  #page-volvelle .vsheet{box-shadow:none; border-radius:0; padding:0; page-break-after:always; align-items:center;}
  #page-volvelle .vsheet:last-child{page-break-after:auto;}
  #page-volvelle *{print-color-adjust:exact; -webkit-print-color-adjust:exact;}
}

/* ===== Trainerpass (neu aufgebaut 27.07.2026 – altes Stylesheet ging bei einer
   CSS-Ersetzung verloren; Maße so gewählt, dass Chip = Slot-Kreis) ===== */
#page-trainerkarte{ --tk-circle: 13mm; }
.tk-toolbar{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:10px;}
.tk-toolbar h1{font-size:20px; margin:0;}
.tk-page{width:210mm; min-height:297mm; margin:0 auto; background:#fff; color:#1a120a;
  box-shadow:0 2px 12px rgba(0,0,0,.14); padding:8mm 7mm; box-sizing:border-box;
  display:flex; flex-direction:column; font-family:'Nunito';}
.tk-half{display:flex; flex-direction:column;}
.tk-cardhalf{flex:0 0 auto;}
.tk-card{border:0.6mm solid #1a120a; border-radius:3mm; padding:3mm 3.5mm;
  display:flex; flex-direction:column; gap:2.4mm; background:linear-gradient(160deg,#fffdf7,#f4ecd8);}
.tk-row{border-bottom:0.25mm dashed #c9bfa4; padding-bottom:2mm;}
.tk-row:last-child{border-bottom:none; padding-bottom:0;}
.tk-header{display:flex; align-items:center; gap:5mm;}
.tk-title{font-family:'Fredoka'; font-weight:700; font-size:7mm; line-height:1; letter-spacing:.4mm;}
.tk-title .tk-sub{display:block; font-size:3mm; letter-spacing:1.2mm; color:#8a7f6d; font-weight:600;}
.tk-namefield{font-weight:800; font-size:3.6mm; display:flex; align-items:flex-end; gap:2mm; flex:1;}
.tk-line{display:inline-block; flex:1; min-width:30mm; border-bottom:0.4mm solid #1a120a; height:4mm;}
.tk-line.short{flex:0 0 9mm; min-width:9mm;}
.tk-starterrow{display:flex; align-items:center; gap:2mm;}
.tk-starterlabel{font-weight:800; font-size:3mm; color:#6b5f4c; writing-mode:vertical-rl; transform:rotate(180deg);}
.tk-starter{width:13mm; text-align:center; font-size:2.4mm; font-weight:700;}
.tk-starter img{width:11mm; height:11mm; object-fit:contain; display:block; margin:0 auto;
  border:0.3mm solid #c9bfa4; border-radius:50%; background:#fff;}
.tk-rowlabel{font-family:'Fredoka'; font-weight:700; font-size:3.4mm; margin-bottom:1.4mm;}
.tk-rowsub{font-family:'Nunito'; font-weight:600; font-size:2.5mm; color:#8a7f6d;}
.tk-slots{display:flex; gap:2mm; justify-content:space-between;}
.tk-slot{width:calc(var(--tk-circle) + 3mm); text-align:center;}
.tk-circle{width:var(--tk-circle); height:var(--tk-circle); border-radius:50%;
  border:0.45mm dashed #9a8f78; background:#eee9dc; margin:0 auto;
  display:flex; align-items:center; justify-content:center; overflow:hidden;}
.tk-silhouette{width:78%; height:78%; object-fit:contain; filter:grayscale(1) opacity(.32);}
.tk-slotlabel{font-size:2.4mm; font-weight:800; margin-top:.8mm; line-height:1.1;}
.tk-slotsub{font-size:2.1mm; color:#8a7f6d; font-weight:600;}
.tk-slots5{justify-content:flex-start; gap:4mm;}
.tk-dexgrid{display:grid; grid-template-columns:repeat(30, 1fr); gap:0.5mm;}
.tk-dexcell{border:0.2mm solid #b9ae93; border-radius:0.6mm; font-size:1.9mm; text-align:center;
  line-height:3.4mm; height:3.4mm; color:#6b5f4c; background:#fff;}
.tk-milestone{background:#f6d76b; border-color:#b8902a; font-weight:900; color:#4a3a10;}
.tk-footrow{display:flex; gap:3mm; align-items:center;}
.tk-footbox{flex:1; border:0.35mm solid #c9bfa4; border-radius:1.5mm; padding:1.4mm 2mm;
  font-size:2.7mm; font-weight:700; display:flex; align-items:center; gap:1.5mm; background:#fff;}
.tk-check{width:5mm; height:5mm; border:0.4mm solid #1a120a; border-radius:1mm; display:inline-block;}
.tk-tally{gap:.8mm;}
.tk-tray{font-weight:600;}
.tk-cutline{border-top:0.4mm dashed #9a8f78; margin:5mm 0 4mm; text-align:center;}
.tk-cutline span{position:relative; top:-2.2mm; background:#fff; padding:0 3mm;
  font-size:2.6mm; color:#8a7f6d; font-weight:700;}
.tk-chiphalf{flex:1;}
.tk-chiphint{font-size:2.7mm; color:#6b5f4c; font-weight:700; margin-bottom:3mm;}
.tk-chiprow{display:flex; gap:5mm; flex-wrap:wrap; margin-bottom:4mm;}
.tk-chip{width:calc(var(--tk-circle) + 3mm); text-align:center;}
.tk-chipimg{width:var(--tk-circle); height:var(--tk-circle); border-radius:50%;
  border:0.5mm solid #1a120a; background:var(--c,#ddd); margin:0 auto;
  display:flex; align-items:center; justify-content:center; overflow:hidden;}
.tk-chipimg img{width:80%; height:80%; object-fit:contain;}
.tk-chiplabel{font-size:2.3mm; font-weight:800; margin-top:.8mm;}
@media print{
  #page-trainerkarte .noprint{display:none !important;}
  .tk-page{box-shadow:none; margin:0; padding:8mm 7mm; page-break-after:avoid;}
}

/* --- Arena-Layout v2 ganz am Ende, damit es die aelteren .ar-* Regeln ueberschreibt --- */
/* ===== Arenen v2: 4 Leiter je A4 quer, Top 4 als Halbseite ===== */
.ar-page{width:297mm !important; height:210mm !important; padding:4mm !important; overflow:hidden;}
.ar-grid{flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:3mm; min-height:0;}

.ar-left{flex:0 0 30mm; padding:1.5mm;}
.ar-portrait{max-width:26mm; max-height:34mm;}

.ar-sub{font-size:2.3mm;}
.ar-orden{font-size:2.1mm;}

.ar-right{padding:1.5mm 2mm;}
.ar-head{font-size:2.4mm; margin-bottom:0.6mm;}
.ar-reward{font-size:2.2mm; margin-top:0.6mm;}
.ar-head, .ar-reward, .ar-row{gap:1mm;}
.ar-mon, .ar-hmon{flex:0 0 15mm;}
.ar-row{padding:0.4mm 0;}
.ar-mon{font-size:1.9mm;}
.ar-mon img{width:12.5mm; height:12.5mm;}
.ar-tipp{font-size:2mm; padding-top:1mm;}
.ar-half{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:0.4mm;}

.ar-kp{align-items:flex-start;}
.ar-kpline{justify-content:flex-start;}
.ar-stats{flex:0 0 auto; font-size:2.1mm; font-weight:900; white-space:nowrap;}
.ar-kp{display:flex; flex-direction:column; gap:0.35mm; align-items:flex-start;}
.ar-kpline{display:flex; gap:0.35mm; justify-content:flex-start;}
.ar-box{width:2.2mm; height:2.2mm;}
.ar-b5{margin-right:1mm;}
.ar-kpnum{display:none;}
.ar-foot{font-size:1.9mm; padding-top:0.5mm;}
.ar-empty{font-size:1.9mm;}

.ar-liga{flex:0 0 auto; margin-bottom:4mm;}
.ar-ligatitle{font-size:5mm;}
.ar-ligasub{font-size:2.6mm;}
.ar-t4block{flex:0 0 auto; display:grid; grid-template-columns:repeat(5,1fr); gap:3mm;
  border:0.6mm solid #1a120a; border-radius:3mm; padding:3mm; background:linear-gradient(160deg,#fffdf7,#f2e9d5);}
.t4-col{display:flex; flex-direction:column; gap:1mm; font-family:'Nunito';
  border-right:0.3mm dashed #c9bfa4; padding-right:2.5mm;}
.t4-col:last-child{border-right:none;}
.t4-head{text-align:center; border-bottom:0.5mm solid var(--c); padding-bottom:1mm; margin-bottom:1mm;}
.t4-portrait{max-width:20mm; max-height:24mm; object-fit:contain;}
.t4-noimg::before{content:'⭐'; font-size:10mm; display:block;}
.t4-name{font-family:'Fredoka'; font-weight:700; font-size:4mm;}
.t4-stufe{font-size:2.1mm; font-weight:800; color:#6b5f4c;}
.t4-row{display:flex; align-items:stretch; gap:0; border-top:0.25mm dashed #ddd3ba;
  padding-top:1mm; min-height:13mm;}
.t4-row img{flex:0 0 12mm; width:12mm; height:auto; align-self:stretch; object-fit:contain;}
.t4-stats{font-size:2mm; font-weight:900; line-height:1.15;}
/* Der Wertblock ist nur so breit wie sein Inhalt und zentriert sich neben dem Bild;
   Name, Werte und Kästchen behalten dabei ihre gemeinsame linke Kante. */
.t4-block{display:flex; flex-direction:column; align-items:flex-start; justify-content:center;
  gap:0.4mm; margin:0 auto;}
.t4-foot{margin-top:auto; font-size:1.9mm; font-weight:800; color:#8a2f1f; padding-top:1mm;}

/* ===================== State build ===================== */
const QUEST_MARKERS = ['Quest','₽','Orden','Top','Pokédex'];
function isQuestFang(w){ return QUEST_MARKERS.some(m=>w.includes(m)); }

function buildState(){
  const mons = {};
  MONS_RAW.forEach(raw=>{
    const abil = {schneid:false, zert:false, surf:false, fly:false};
    raw.faeh.forEach(([icon])=>{
      if(icon==='🗡') abil.schneid=true;
      else if(icon==='🪨') abil.zert=true;
      else if(icon==='🌊') abil.surf=true;
      else if(icon==='🪽') abil.fly=true;
    });
    const orte = new Set();
    let questInfo = null;
    raw.fang.forEach(f=>{
      if(isQuestFang(f.w)) questInfo = f;
      else orte.add(f.o+'|'+f.t);
    });
    /* Klassen-Richtung steht seit 28.07.2026 als eigenes Feld in den Daten. Vorher wurde sie aus der
       Differenz zum Basiswert abgeleitet – das brach, sobald sich die Klasse eines Pokémon änderte
       (bei Seltenheit ● ist der Bonus 0, die Richtung war dann nicht mehr erkennbar). */
    const baseKp = 2*raw.sterne+8, baseAng = 2 + Math.floor((raw.sterne-1)/2);
    let sigTarget = raw.sig !== undefined ? raw.sig : null;
    if(raw.sig === undefined){
      const exKp = raw.kp-baseKp, exAng = raw.ang-baseAng;
      if(exKp>0) sigTarget='kp'; else if(exAng>0) sigTarget='ang';
    }
    mons[raw.nr] = {
      nr:raw.nr, name:raw.name, typen:raw.typen.slice(),
      sterne:raw.sterne, quest:raw.quest, questInfo, sigTarget,
      abil, orte, evo:raw.evo, parentNr:null,
    };
  });
  Object.values(mons).forEach(m=>{
    m.evo.forEach(([childNr])=>{ if(mons[childNr]) mons[childNr].parentNr = m.nr; });
  });
  return { mons, areas: AREA_ORDER };
}

function rootOf(state, nr){
  let cur = state.mons[nr], guard=0;
  while(cur.parentNr && guard<10){ cur = state.mons[cur.parentNr]; guard++; }
  return cur.nr;
}

function ownFundorteCount(m){ return m.orte.size; }

function klasseOf(state, nr){
  const m = state.mons[nr];
  if(m.quest) return 'C';
  const n = rootOf(state, nr);
  const rm = state.mons[n];
  if(rm.quest) return 'C';
  const c = ownFundorteCount(rm);
  if(c>=3) return 'A';
  if(c===2) return 'B';
  if(c===1) return 'C';
  return null; // family currently has zero checked locations anywhere
}

function sigBonus(klasse, target){
  if(!target||!klasse) return 0;
  const table = { kp:{A:0,B:2,C:4}, ang:{A:0,B:1,C:1} };  /* ANG-Sig einheitlich +1 – Beschluss 28.07.2026 */
  return table[target][klasse]||0;
}

function computeKP(state, nr, level){
  const m = state.mons[nr];
  const kl = klasseOf(state, nr);
  const base = 2*m.sterne+8;
  const sig = m.sigTarget==='kp' ? sigBonus(kl,'kp') : 0;
  const lvlBonus = Math.max(0, level-1);
  return base + sig + lvlBonus;
}
function computeANG(state, nr, level){
  /* v3 "Typ schlägt Stärke" (Beschluss 28.07.2026):
     Angriff = 2 + (Sterne-1)/2 + Level/3 (abgerundet) + Klasse (+1) */
  const m = state.mons[nr];
  const kl = klasseOf(state, nr);
  const base = 2 + Math.floor((m.sterne-1)/2);
  const sig = m.sigTarget==='ang' ? sigBonus(kl,'ang') : 0;
  const lvlBonus = Math.floor(Math.max(1,level)/3);
  return base + sig + lvlBonus;
}

/* ===================== Area dice distribution ===================== */
function computeAreaDistribution(monsInArea){
  /* Regelwerk §3.2/3.3:
     - Klassen-Profile (Anteil je Sterneklasse), Niete-Korridor 4–6 (Ziel 5)
     - Goldene Regel: gleiche Augen innerhalb einer Klasse
     - Fehlende Klassen: Augen wandern zur UNTERSTEN vorhandenen Klasse
     - Monotonie: höhere Sterne nie mehr Augen pro Pokémon als niedrigere
     - Die höchste Klasse endet immer auf der 20 */
  if(monsInArea.length===0) return {niete:[1,20], entries:[]};
  const classes={};
  monsInArea.forEach(m=>{ (classes[m.sterne] = classes[m.sterne]||[]).push(m); });
  const present = Object.keys(classes).map(Number).sort((a,b)=>a-b);
  const maxc = Math.min(Math.max(...present), 4);
  const baseTable = {1:{1:15},2:{1:10,2:5},3:{1:8,2:5,3:2},4:{1:8,2:4,3:2,4:1}};
  const base = baseTable[maxc];
  const w = {}; present.forEach(c=>w[c]=0);
  const lowest = present[0];
  for(let c=1;c<=4;c++){
    const zielKlasse = present.includes(c) ? c : lowest;   // fehlende Klasse → unterste
    w[zielKlasse] = (w[zielKlasse]||0) + (base[c]||0);
  }
  const n={}; present.forEach(c=>n[c]=classes[c].length);
  // Startbelegung: ganzzahlig, mind. 1 Auge
  const per={}; present.forEach(c=> per[c]=Math.max(1, Math.floor(w[c]/n[c])) );
  // Monotonie erzwingen (absteigend mit steigenden Sternen)
  const enforceMono = ()=>{ for(let i=1;i<present.length;i++){
    const c=present[i], p=present[i-1];
    if(per[c]>per[p]) per[c]=per[p];
  }};
  enforceMono();
  const total = ()=> present.reduce((s,c)=>s+per[c]*n[c],0);
  // In den Niete-Korridor (4–6, Ziel 5) steuern – Schrittweite je Klasse = n[c]
  let guard=0;
  while(guard++<100){
    const niete = 20-total();
    if(niete>=4 && niete<=6) break;
    if(niete<4){
      // zu voll → Augen wegnehmen, bevorzugt bei der HÖCHSTEN Klasse mit per>1
      // (Seltenes wird seltener; Monotonie bleibt automatisch erhalten)
      const cand = present.slice().reverse().find(c=>per[c]>1);
      if(cand===undefined) break;
      per[cand]--;
    } else {
      // zu leer → Augen dazu, bevorzugt bei der UNTERSTEN Seltenheitsstufe (Häufiges wird häufiger, Regel 3)
      // Klasse wählen, deren Schritt die Niete am nächsten an 5 bringt, ohne Monotonie zu brechen
      let best=null, bestDist=Infinity;
      present.forEach((c,i)=>{
        const monoOk = i===0 || per[c]+1<=per[present[i-1]];
        if(!monoOk) return;
        const d = Math.abs((niete - n[c]) - 5) - (c===lowest?0.25:0);  // leichter Bonus für die unterste Klasse
        if(niete - n[c] >= 4 && d < bestDist){ best=c; bestDist=d; }
      });
      if(best===null){
        // kein Schritt bleibt im Korridor → nimm die unterste Klasse, wenn Niete ≥ 4 bleibt, sonst Abbruch
        if(niete - n[lowest] >= 4) per[lowest]++; else break;
        continue;
      }
      per[best]++;
    }
  }
  enforceMono();
  const niete = 20-total();
  let cursor = niete+1;
  const entries=[];
  present.forEach(c=>{
    classes[c].slice().sort((a,b)=>a.nr-b.nr).forEach(m=>{
      const from=cursor, to=cursor+per[c]-1;
      entries.push({nr:m.nr,name:m.name,sterne:c,range:[from,to]});
      cursor=to+1;
    });
  });
  return {niete:[1,niete], entries};
}

let state = null;

function loadEmbedded(){
  const el = document.getElementById('embedded-state');
  if(!el || !el.textContent.trim()) return null;
  try{ return JSON.parse(el.textContent); }catch(e){ console.warn('Eingebetteter Stand unlesbar', e); return null; }
}
function initGlobalState(){
  state = buildState();
  state.shop = defaultShop();
  state.events = defaultEvents();
  const saved = loadPersisted();
  const emb = loadEmbedded();
  // Der jüngere Stand gewinnt (gespeicherte HTML-Datei vs. Browser-Speicher)
  if(emb && (!saved || (emb.savedAt||0) >= (saved.savedAt||0))) applyPersisted(emb);
  else if(saved) applyPersisted(saved);
}

/* ===== JSON-Austausch & HTML-Sicherung ===== */
function collectStateJSON(){
  const out = { schema:'kanto-spielsystem', version:1, savedAt: Date.now(),
    exportiert: new Date().toISOString(),
    sterne:{}, abil:{}, orte:{}, sig:{}, typen:{}, shop: state.shop, events: state.events };
  Object.values(state.mons).forEach(m=>{
    out.sterne[m.nr] = m.sterne;
    out.abil[m.nr] = m.abil;
    out.orte[m.nr] = Array.from(m.orte);
    out.sig[m.nr] = m.sigTarget;
    out.typen[m.nr] = m.typen;
  });
  return out;
}
function downloadBlob(name, mime, text){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:mime}));
  a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
function exportJSON(){
  const d = new Date().toISOString().slice(0,10);
  downloadBlob(`kanto-daten-${d}.json`, 'application/json', JSON.stringify(collectStateJSON(), null, 1));
}
function importJSONFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(e){ alert('Datei ist kein gültiges JSON.'); return; }
    if(data.schema && data.schema !== 'kanto-spielsystem'){
      alert('Unbekanntes Schema: ' + data.schema); return;
    }
    if(!data.sterne && !data.orte && !data.shop && !data.events && !data.abil && !data.sig && !data.typen){
      alert('JSON enthält keine bekannten Felder (sterne/abil/orte/sig/typen/shop/events).'); return;
    }
    applyPersisted(data);
    persist();
    const active = document.querySelector('nav .tab.active');
    activatePage(active && active.dataset.page ? active.dataset.page : 'home');
    alert('Daten übernommen: ' +
      [data.sterne&&'Sterne', data.abil&&'Fähigkeiten', data.orte&&'Fundorte', data.sig&&'Klasse', data.typen&&'Typen', data.shop&&'Shop', data.events&&'Events']
      .filter(Boolean).join(', '));
  };
  reader.readAsText(file);
  input.value = '';
}
/* Den aktuellen Brettstand aus dem eingebetteten Editor uebernehmen.
   Der Editor laeuft in einem srcdoc-iframe und ist damit same-origin – sein
   Autosave landet im selben localStorage und ist von hier aus lesbar. */
function embedBoardState(){
  try{
    const stand = localStorage.getItem('pokemonBoardEditor.autosave.v1');
    const holder = document.getElementById('board-editor-b64');
    if(!stand || !holder) return false;
    const bytes = Uint8Array.from(atob(holder.textContent.trim()), c=>c.charCodeAt(0));
    let html = new TextDecoder('utf-8').decode(bytes);
    const vorher = html.length;
    html = html.replace(/(<script[^>]*id="embedded-project-data"[^>]*>)[\s\S]*?(<\/script>)/,
             (m,a,b)=> a + stand.replace(/<\//g,'<\\/') + b);
    if(html.length === vorher) return false;          // Platzhalter nicht gefunden
    const enc = new TextEncoder().encode(html);
    let bin = '';
    for(let i=0;i<enc.length;i+=0x8000) bin += String.fromCharCode.apply(null, enc.subarray(i, i+0x8000));
    holder.textContent = btoa(bin);
    return true;
  }catch(e){ console.warn('Brettstand konnte nicht uebernommen werden:', e); return false; }
}

function saveHTMLFile(){
  // aktuellen Datenstand einbetten, gerenderte Seiten leeren (werden beim Öffnen neu gebaut),
  // Quelltext sichern, aktive Seite danach neu rendern
  const holder = document.getElementById('embedded-state');
  const st = collectStateJSON();
  holder.textContent = JSON.stringify(st).replace(/<\//g, '<\\/');
  const brettUebernommen = embedBoardState();
  const activeName = (document.querySelector('nav .tab.active')||{}).dataset ?
    (document.querySelector('nav .tab.active').dataset.page || 'home') : 'home';
  /* WICHTIG: renderBoard() baut den Editor nur einmal auf und merkt sich das in
     dataset.ready. Beim Leeren der Seiten bleibt dieses Attribut sonst stehen und
     wird mitgespeichert – dann faende die gespeicherte Datei den Editor bereits als
     "fertig" vor und wuerde ihn nie aufbauen. Deshalb hier ausdruecklich entfernen. */
  document.querySelectorAll('.page').forEach(pg=>{ pg.innerHTML=''; delete pg.dataset.ready; });
  const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  const d = new Date().toISOString().slice(0,10);
  downloadBlob(`kanto-spielsystem-${d}.html`, 'text/html', html);
  activatePage(activeName);
  const hinweis = document.getElementById('savehint');
  if(hinweis){
    hinweis.textContent = brettUebernommen
      ? '💾 Gespeichert – inklusive deiner Änderungen am Spielbrett.'
      : '💾 Gespeichert. (Am Spielbrett wurde nichts geändert, es bleibt der eingebettete Stand.)';
    hinweis.style.opacity = '1';
    clearTimeout(hinweis._t);
    hinweis._t = setTimeout(()=>{ hinweis.style.opacity = '0'; }, 6000);
  }
}

function loadPersisted(){
  try{ const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ console.warn('Konnte gespeicherten Stand nicht laden', e); return null; }
}

function applyPersisted(saved){
  if(saved.sterne){
    Object.keys(saved.sterne).forEach(nr=>{ if(state.mons[nr]) state.mons[nr].sterne = saved.sterne[nr]; });
  }
  if(saved.abil){
    Object.keys(saved.abil).forEach(nr=>{ if(state.mons[nr]) Object.assign(state.mons[nr].abil, saved.abil[nr]); });
  }
  if(saved.orte){
    Object.keys(saved.orte).forEach(nr=>{ if(state.mons[nr]) state.mons[nr].orte = new Set(saved.orte[nr]); });
  }
  if(saved.sig){
    Object.keys(saved.sig).forEach(nr=>{ if(state.mons[nr]) state.mons[nr].sigTarget = saved.sig[nr]; });
  }
  if(saved.typen){
    Object.keys(saved.typen).forEach(nr=>{ if(state.mons[nr] && saved.typen[nr] && saved.typen[nr].length) state.mons[nr].typen = saved.typen[nr].slice(); });
  }
  if(saved.shop) Object.assign(state.shop, saved.shop);
  if(saved.events) state.events = saved.events;
}

let persistTimer = null;
function persist(){
  clearTimeout(persistTimer);
  persistTimer = setTimeout(()=>{
    const out = { schema:'kanto-spielsystem', version:1, savedAt: Date.now(),
      sterne:{}, abil:{}, orte:{}, sig:{}, typen:{}, shop: state.shop, events: state.events };
    Object.values(state.mons).forEach(m=>{
      out.sterne[m.nr] = m.sterne;
      out.abil[m.nr] = m.abil;
      out.orte[m.nr] = Array.from(m.orte);
      out.sig[m.nr] = m.sigTarget;
      out.typen[m.nr] = m.typen;
    });
    try{ localStorage.setItem(LS_KEY, JSON.stringify(out)); }catch(e){ console.warn('Speichern fehlgeschlagen', e); }
    const hint = document.getElementById('saveHint');
    if(hint){ hint.textContent = 'Gespeichert · ' + new Date().toLocaleTimeString('de-DE'); }
  }, 250);
}

function resetAllData(){
  if(!confirm('Wirklich alle Änderungen (Sterne, Fundorte, Fähigkeiten, Klasse, Typen, Pokeshop, Events) zurücksetzen?')) return;
  localStorage.removeItem(LS_KEY);
  location.reload();
}

function getFamilyNrs(rootNr){
  const out = [rootNr];
  const walk = (nr)=>{
    const m = state.mons[nr];
    if(!m) return;
    m.evo.forEach(([childNr])=>{ if(state.mons[childNr]){ out.push(childNr); walk(childNr); } });
  };
  walk(rootNr);
  return out;
}

function setSterne(nr, val){
  state.mons[nr].sterne = val;
  persist();
}
function setSig(nr, val){
  state.mons[nr].sigTarget = (val==='none') ? null : val;
  persist();
}
function setTyp(nr, val){
  state.mons[nr].typen = [val];   // seit 30.07.2026 nur noch der Haupttyp, kein Nebentyp mehr
  persist();
  const zelle = document.querySelector(`.typ-cell[data-nr="${nr}"]`);
  if(zelle) zelle.style.setProperty('--tc', TYP[val] || '#948E80');
}
function toggleAbil(nr, key){
  state.mons[nr].abil[key] = !state.mons[nr].abil[key];
  persist();
}
function toggleOrt(nr, areaKey){
  const m = state.mons[nr];
  if(m.orte.has(areaKey)) m.orte.delete(areaKey); else m.orte.add(areaKey);
  persist();
  const root = rootOf(state, nr);
  getFamilyNrs(root).forEach(fn=>{
    const cell = document.querySelector(`.seltenheit-cell[data-nr="${fn}"]`);
    if(cell) cell.innerHTML = seltenheitHTML(fn);
  });
}

function seltenheitHTML(nr){
  const kl = klasseOf(state, nr);
  const m = state.mons[nr];
  const count = ownFundorteCount(state.mons[rootOf(state,nr)]);
  if(m.quest) return `<span class="ksym kC" title="Quest-Pokémon">★</span>`;
  if(!kl) return `<span class="ksym kNone" title="kein Fundort zugeordnet">–</span>`;
  const sym = KLASSE[kl].sym;
  return `<span class="ksym k${kl}" title="${KLASSE[kl].lab} · ${count} Fundort(e)">${sym}</span>`;
}

/* ===================== Spielleiter-Karte ===================== */
function monsInArea(areaKey){
  return Object.values(state.mons)
    .filter(m=>!m.quest && m.orte.has(areaKey))
    .map(m=>({nr:m.nr, name:m.name, sterne:m.sterne}));
}

function typeMatrixHTML(){
  const types = Object.keys(TYP);
  let html = '<table class="typematrix"><thead><tr><th class="corner">Angr. ↓ / Vert. →</th>';
  types.forEach(t=> html += `<th><div class="vert" style="background:${TYP[t]}">${t}</div></th>`);
  html += '</tr></thead><tbody>';
  types.forEach(atk=>{
    html += `<tr><th class="rowlab" style="background:${TYP[atk]}">${atk}</th>`;
    types.forEach(def=>{
      const v = (TYPE_MATRIX[atk]||{})[def];
      let cell = '';
      if(v==='+') cell = '<span class="c plus">+</span>';
      else if(v==='−'||v==='-') cell = '<span class="c minus">−</span>';
      else if(v==='X') cell = '<span class="c none">✕</span>';
      html += `<td>${cell}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  return html;
}

const GM_STAR_COLS = 4;
function monHTML(e){
  const nr = e.nr;
  const kl = klasseOf(state, nr);
  const sym = kl ? KLASSE[kl].sym : '–';
  const rng = e.range[0]===e.range[1] ? String(e.range[0]) : `${e.range[0]}–${e.range[1]}`;
  return `<div class="mon">
    <div class="rng">${rng}</div>
    <img src="${IMG(nr)}" loading="lazy" onerror="this.style.visibility='hidden'">
    <div class="mname">${e.name}</div>
    <div class="meta"><span class="kl">${sym}</span> <span class="pid">#${String(nr).padStart(3,'0')}</span></div>
  </div>`;
}

function areaRowHTML(a){
  const mons = monsInArea(a.key);
  const dist = computeAreaDistribution(mons);
  const byStar = {};
  dist.entries.forEach(e=>{
    const col = Math.min(e.sterne, GM_STAR_COLS);
    (byStar[col] = byStar[col]||[]).push(e);
  });
  let scells = '';
  for(let s=1; s<=GM_STAR_COLS; s++){
    const list = byStar[s];
    scells += `<div class="scell">${list && list.length ? list.map(monHTML).join('') : '<span class="dash">–</span>'}</div>`;
  }
  const nieteTxt = dist.niete[0]===dist.niete[1] ? dist.niete[1] : `${dist.niete[0]}–${dist.niete[1]}`;
  return `<div class="arearow">
    <div class="areahead" style="--tc:${TERR_COLOR[a.terr]||'#8a7f6d'}">
      <div class="aname">${a.label}</div>
      <div class="terr">${a.terr} ${TERR_LABEL[a.terr]||''}</div>
      <div class="niete">Niete ${nieteTxt}</div>
    </div>
    ${scells}
  </div>`;

function chunkAreasEven(arr, numChunks){
  const n = arr.length;
  const base = Math.floor(n/numChunks);
  const rem = n - base*numChunks;
  const sizes = Array(numChunks).fill(base);
  for(let i=0;i<rem;i++) sizes[i]++;
  const chunks = []; let idx = 0;
  sizes.forEach(sz=>{ chunks.push(arr.slice(idx, idx+sz)); idx += sz; });
  return chunks;
}

function gmAreaEstH(area){
  /* Fallback-Schätzung in mm: Zellen zeigen 2 Pokémon nebeneinander,
     die Zeilenhöhe wächst also erst ab dem 3. Pokémon in einer Zelle */
  const mons = monsInArea(area.key);
  const per = {};
  mons.forEach(m=>{ const c=Math.min(m.sterne,4); per[c]=(per[c]||0)+1; });
  const maxCell = Math.max(1, ...Object.values(per));
  return 4 + Math.ceil(maxCell/2)*14;
}
function gmMeasureAreaHeights(){
  /* misst die REALEN Zeilenhöhen in einem unsichtbaren A5-Messcontainer –
     robust gegen jede CSS-Änderung; Kalibrierung px→mm über ein 100-mm-Element */
  const meas = document.createElement('div');
  meas.className = 'gm-print';
  meas.style.cssText = 'position:absolute; left:-9999px; top:0; visibility:hidden;';
  meas.innerHTML = `<div class="a5" style="height:auto; overflow:visible;"><div class="a5in" id="gmMeasIn"></div></div>
    <div id="gmCalib" style="height:100mm; width:10mm;"></div>`;
  document.body.appendChild(meas);
  const calib = meas.querySelector('#gmCalib').offsetHeight / 100;
  if(!calib){ document.body.removeChild(meas); return null; }   // keine Layout-Engine → Fallback
  const inn = meas.querySelector('#gmMeasIn');
  inn.innerHTML = `<h1>Routen</h1><div class="starhead"><div class="sh0">Gebiet</div>${starheadColsHTML()}</div>`;
  const head = inn.getBoundingClientRect().height / calib;
  const rows = {};
  state.areas.forEach(a=>{
    inn.innerHTML = areaRowHTML(a);
    rows[a.key] = inn.firstElementChild.getBoundingClientRect().height / calib + 1;  // + margin-bottom
  });
  document.body.removeChild(meas);
  return {head, rows};
}
function partitionBalanced(items, hOf, usable){
  /* teilt eine Sequenz in die MINIMALE Zahl zusammenhängender Teile, deren größter ≤ usable ist,
     und balanciert die Teile dabei gleichmäßig (Min-Max-Partition per DP) */
  const n = items.length; if(!n) return [];
  const h = items.map(hOf);
  const pre = [0]; h.forEach(v=>pre.push(pre[pre.length-1]+v));
  const sum = (i,j)=>pre[j]-pre[i];
  for(let k=1; k<=n; k++){
    const dp = Array.from({length:k+1},()=>Array(n+1).fill(Infinity));
    const cut = Array.from({length:k+1},()=>Array(n+1).fill(0));
    dp[0][0] = 0;
    for(let p=1;p<=k;p++) for(let j=p;j<=n;j++)
      for(let i=p-1;i<j;i++){
        const v = Math.max(dp[p-1][i], sum(i,j));
        if(v < dp[p][j]){ dp[p][j]=v; cut[p][j]=i; }
      }
    if(dp[k][n] <= usable){
      const parts=[]; let j=n;
      for(let p=k;p>=1;p--){ const i=cut[p][j]; parts.unshift(items.slice(i,j)); j=i; }
      return parts;
    }
  }
  return [items];
}
function gmPackHalves(){
  const meas = gmMeasureAreaHeights();
  const usable = meas ? Math.max(140, 201.9 - meas.head - 1) : 180;
  const rowH = a => meas ? meas.rows[a.key] : gmAreaEstH(a);

  const routen = state.areas.filter(a=> (a.region||'').startsWith('Routen'));
  const ORDER = {'Wald':0, 'Wasser':1, 'Höhle':2};
  const weitere = state.areas.filter(a=> !(a.region||'').startsWith('Routen'))
    .slice().sort((x,y)=>{
      const ox = (ORDER[x.region] ?? 9), oy = (ORDER[y.region] ?? 9);
      if(ox !== oy) return ox - oy;
      return String(x.name||x.key).localeCompare(String(y.name||y.key), 'de');
    });

  const halves = [];
  partitionBalanced(routen, rowH, usable).forEach(part=> halves.push({titel:'Routen', areas:part}));
  if(halves.length % 2 === 1) halves.push(null);   // Blattgrenze: nächste Rubrik auf eigenem A5-Blatt
  partitionBalanced(weitere, rowH, usable).forEach(part=> halves.push({titel:'Wald, Wasser, Höhle', areas:part}));
  while(halves.length % 4 !== 0) halves.push(null);
  return halves;
}
function a5HalfHTML(h){
  if(!h) return '<div class="a5"><div class="a5in"></div></div>';
  return `<div class="a5"><div class="a5in">
    <h1>${h.titel}</h1>
    <div class="starhead"><div class="sh0">Gebiet</div>${starheadColsHTML()}</div>
    ${h.areas.map(areaRowHTML).join('')}
  </div></div>`;

function buildGMPrintHTML(){
  /* Duplex A4 quer, an der KURZEN Kante gespiegelt. Jede A5-Hälfte ist ein "Blatt":
     Blatt links  = halves[4s]   (vorn) / halves[4s+1] (hinten)
     Blatt rechts = halves[4s+2] (vorn) / halves[4s+3] (hinten)
     → Vorderseite: [H0 | H2] · Rückseite (gespiegelt): [H3 | H1] */
  const halves = gmPackHalves();
  let out = '';
  for(let s4=0; s4<halves.length; s4+=4){
    const nr = s4/4 + 1;
    out += printSheetHTML(`Spielleiter · Blatt ${nr} · Vorderseite`, a5HalfHTML(halves[s4]), a5HalfHTML(halves[s4+2]));
    out += printSheetHTML(`Spielleiter · Blatt ${nr} · Rückseite (für Duplex gespiegelt)`, a5HalfHTML(halves[s4+3]), a5HalfHTML(halves[s4+1]));
  }

  const typenA5 = a5CustomHTML('Typen-Tabelle', 'Angreifer (Zeile) → Verteidiger (Spalte) · Wirkung auf den Gesamtschaden (nur Haupttyp)',
    `<div class="matrix-wrap">${typeMatrixHTML()}</div>${TYPE_LEGEND_HTML}${TYPE_RULES_HTML}
      <div style="margin-top:4px;font-size:10.5px;color:#8a7f6d;font-weight:700;">Randnotiz: „−“ halbiert den Gesamtschaden (aufgerundet) · „✕“ = 0 Schaden und Zwangswechsel · nur der Haupttyp zählt.</div>`);
  const questA5 = a5CustomHTML('Quests &amp; Legendäre', 'Nicht wild fangbar (nie beim W20) · Legendäre fliehen nicht, max. 1 Fangversuch pro Sitzung', questListHTML());
  const leerA5 = '<div class="a5"><div class="a5in"></div></div>';

  out += printSheetHTML('Übersicht · Vorderseite', typenA5, leerA5);
  out += printSheetHTML('Übersicht · Rückseite (für Duplex gespiegelt)', leerA5, questA5);

  return `<div class="gm-print">${out}</div>`;
}

/* ---- Höhenmessung im echten Layout (mm), mit Rückfall auf eine Schätzung ---- */
function hbMeasure(htmlList){
  const meas = document.createElement('div');
  meas.className = 'hb';
  meas.style.cssText = 'position:absolute; left:-9999px; top:0; visibility:hidden;';
  meas.innerHTML = '<div class="hb-page" style="height:auto;"><div class="hb-in" id="hbMeasIn" ' +
    'style="position:static; padding:0; width:178mm;"></div></div>' +
    '<div id="hbCalib" style="height:100mm; width:10mm;"></div>';
  document.body.appendChild(meas);
  const cal = meas.querySelector('#hbCalib');
  const roh = cal && typeof cal.offsetHeight === 'number' ? cal.offsetHeight : 0;
  const calib = roh / 100;
  const inn = meas.querySelector('#hbMeasIn');
  const out = htmlList.map(html=>{
    if(!calib) return 30;                                  // ohne Layout-Engine: grobe Annahme
    inn.innerHTML = html;
    return inn.getBoundingClientRect().height / calib;
  });
  document.body.removeChild(meas);
  return out;
}

/* ---- Blöcke der Reihe nach auf Seiten verteilen ---- */
function hbPack(bloecke, nutzHoehe){
  const hoehen = hbMeasure(bloecke.map(b=>b.html));
  const seiten = []; let akt = [], benutzt = 0;
  bloecke.forEach((b,i)=>{
    let braucht = hoehen[i];
    if(b.keep && bloecke[i+1]) braucht += hoehen[i+1];     // Überschrift nie allein am Seitenende
    if(akt.length && benutzt + braucht > nutzHoehe){ seiten.push(akt); akt = []; benutzt = 0; }
    akt.push(b.html); benutzt += hoehen[i];
  });
  if(akt.length) seiten.push(akt);
  return seiten;
}

/* ---- Gebietstabellen: Kopfzeile auf jeder Seite, kein Titel ---- */
function hbGebietSeiten(nutzHoehe){
  const kopf = '<div class="starhead"><div class="sh0">Gebiet</div>' + starheadColsHTML() + '</div>';
  const zeilen = state.areas.map(a=>areaRowHTML(a));       // Reihenfolge: Routen 1–25, dann Wald, Wasser, Höhle
  const hoehen = hbMeasure(zeilen).map(x=>x+1.2);   // + margin-bottom der Zeile
  const kopfH = hbMeasure([kopf])[0] + 1.4;
  const seiten = []; let akt = [], benutzt = kopfH;
  zeilen.forEach((z,i)=>{
    if(akt.length && benutzt + hoehen[i] > nutzHoehe){ seiten.push(akt); akt = []; benutzt = kopfH; }
    akt.push(z); benutzt += hoehen[i];
  });
  if(akt.length) seiten.push(akt);
  return seiten.map(s=>kopf + s.join(''));
}

function hbSeite(inhalt, fussLinks, nr){
  const fuss = nr ? '<div class="hb-pnum"><span>' + (fussLinks||'') + '</span><span class="r">' + nr + '</span></div>' : '';
  return '<div class="hb-page"><div class="hb-in">' + inhalt + fuss + '</div></div>';
}

  const bloecke = handbuchBloecke();

    if(treffer) kapitelName = treffer[1];
    seiten.push({inhalt: inhalt.join(''), fuss: kapitelName});
  });

  /* Gebietstabellen */
  hbGebietSeiten(NUTZ).forEach(s=> seiten.push({inhalt:s, fuss:'Wo welche Pokémon leben'}));

  /* Pokémon mit besonderem Fundort */
  seiten.push({inhalt:

  seiten.push({inhalt:

    TYPE_LEGEND_HTML + TYPE_RULES_HTML,
    fuss:'Typtabelle'});

  /* Auf ein Vielfaches von 4 auffüllen (Deckblatt + Innenseiten + Rückseite) */
  while((seiten.length + 1) % 4 !== 0) seiten.push({inhalt:'', fuss:''});

  /* Rückseite */
  const rueck = '<div class="hb-page"><div class="hb-back">' +
    '<div class="sun"></div><div class="clouds"></div>' +
    '<div class="hillback"></div><div class="hillfront"></div><div class="flowers"></div>' +
    '<div class="mons">' +
      `<img src="${IMG(1)}" alt="" loading="lazy">` +
      `<img src="${IMG(4)}" alt="" loading="lazy">` +
      `<img src="${IMG(7)}" alt="" loading="lazy">` +
    '</div>' +
    '<div class="textbox">' +
      '<div class="bt">Pokémon Kanto</div>' +
      '<div class="bx"><p>Ein Starter, ein Würfel und eine ganze Region: In <b>Pokémon Kanto</b> reist ihr von ' +
      'Alabastia aus über Routen, durch Wälder und Höhlen. Ihr fangt wilde Pokémon, trainiert sie in Kämpfen, ' +
      'holt euch acht Orden – und stellt euch am Ende der Pokémon-Liga.</p>' +
      '<p>Im Kampf entscheidet nicht die Größe, sondern der <b>richtige Typ</b>: Wasser löscht Feuer, Feuer ' +
      'verbrennt Pflanzen, Pflanzen trinken Wasser. Wer sein Team klug zusammenstellt, gewinnt auch gegen ' +
      'viel stärkere Gegner.</p>' +
      '<p>Jeder Spieler geht seinen eigenen Weg durch Kanto – helfen, tauschen und gegeneinander antreten ' +
      'dürft ihr trotzdem jederzeit.</p></div>' +
      '<div class="bl">1–3 Spieler · ab 6 Jahren · 151 Pokémon · 8 Arenen · 1 Champion<br>' +
      'Fan Projekt von RocketJaxX.</div>' +
    '</div>' +

  let nr = 2;
  const innen = seiten.slice(1).map(s=> hbSeite(s.inhalt, s.fuss, nr++));
  return [seiten[0], ...innen, rueck];   // ein Eintrag je Seite, Seite 1 = Deckblatt, letzte = Rückseite
}

/* ---- Broschüren-Druck: A4 quer, 2 Innenseiten je Blattseite, in der Mitte gefalzt und getackert
   (Beschluss 29.07.2026). Für Blatt i (1..Seitenzahl/4):
   Vorderseite = Seite 2i | Seite (P−2i+1) · Rückseite = Seite (2i−1) | Seite (P−2i+2).
   Die Rückseite ist links/rechts gegenüber der Vorderseite gespiegelt – sonst käme Blatt 1 mit
   Rückblatt links und Deckblatt rechts aus dem Drucker, statt umgekehrt. ---- */
function hbA5HTML(pageDivHTML){
  return `<div class="a5"><div class="hb-scalewrap">${pageDivHTML}</div></div>`;
}
function hbFoldSheetHTML(label, leftHTML, rightHTML){
  return `<div class="sheet"><div class="sheetlab">${label}</div>${hbA5HTML(leftHTML)}${hbA5HTML(rightHTML)}` +
    `<div class="fold"></div></div>`;
}
function buildHandbuchPrintHTML(pageDivs){
  const P = pageDivs.length, S = P/4;
  let out = '';
  for(let i=1; i<=S; i++){
    out += hbFoldSheetHTML(`Blatt ${i}/${S} · Vorderseite`, pageDivs[2*i-1], pageDivs[P-2*i]);
    out += hbFoldSheetHTML(`Blatt ${i}/${S} · Rückseite`,  pageDivs[2*i-2], pageDivs[P-2*i+1]);
  }
  return `<div class="hb-print">${out}</div>`;
}

function renderGM(){
  const host = document.getElementById('page-gm');
  const pageDivs = buildHandbuch();
  host.innerHTML =
    '<div class="hb-toolbar noprint">' +
      '<h1>📕 Spielanleitung</h1>' +
      '<button onclick="printPage(\'landscape\')">🖨 Heft drucken (A4 quer, Broschüre)</button>' +
      '<span class="hint">Druckt fertig als Broschüre: A4 quer, beidseitig (an der kurzen Kante wenden). ' +
      'Blätter in gedruckter Reihenfolge stapeln (Blatt 1 oben), in der Mitte falzen und tackern.</span>' +
    '</div>' +
    '<div class="gm-screen"><div class="hb">' + pageDivs.join('') + '</div></div>' +
    buildHandbuchPrintHTML(pageDivs);
}

const fangRange = min => min > 6 ? '–' : (min === 6 ? '6' : `${Math.max(1, min)}–6`);
function fangTableHTML(nr){
  const m = state.mons[nr];
  const t = SCHWELLE[m.sterne];
  const oben  = [t, t-1, t-2].map(fangRange);
  const unten = [t-1, t-2, t-3].map(fangRange);
  return `<div class="fang">
    <div class="fl"><span class="flab">FANG</span><span class="dice">🎲 W6</span></div>
    <div class="fgrid">
      <div class="fkp">&gt; ½ KP</div>${oben.map(r=>`<span class="rng">${r}</span>`).join('')}
      <div></div>${CARD_BALLS_ICON.join('')}
      <div class="fkp">&lt; ½ KP</div>${unten.map(r=>`<span class="rng">${r}</span>`).join('')}
    </div></div>`;
}

function liveFangList(nr, distMap){
  const m = state.mons[nr];
  const list = [];
  state.areas.forEach(a=>{
    if(m.orte.has(a.key)){
      const dist = distMap[a.key];
      const entry = dist.entries.find(e=>e.nr===Number(nr));
      if(entry) list.push({t:a.terr, o:a.ort, w: entry.range[0]===entry.range[1]?String(entry.range[0]):`${entry.range[0]}–${entry.range[1]}`});
    }
  });
  return list;
}

function cardFront(nr, distMap){
  const m = state.mons[nr];
  const fangList = liveFangList(nr, distMap);
  let panel;
  if(m.quest){
    const info = m.questInfo || {};
    panel = `<div class="chip" style="flex:1">
      <div class="fangtitle">BESONDERER FUNDORT<span class="dice">✦ Quest</span></div>
      <div class="fort"><span class="ter">${info.t||'✦'}</span><span class="on">${info.o||''}</span><span class="rng">${info.w||''}</span></div>
      <div class="fextra">Nicht per W20 auffindbar – nur über die genannte Quest/Bedingung.</div>
    </div>
    ${m.sterne>=4 ? fangTableHTML(nr) : ''}`;
  } else if(fangList.length){
    panel = `<div class="chip" style="flex:1">
      <div class="fangtitle">FANGORTE<span class="dice">🎲 W20</span></div>
      ${fangList.map(f=>`<div class="fort"><span class="ter">${f.t}</span><span class="on">${f.o}</span><span class="rng">${f.w}</span></div>`).join('')}
    </div>
    ${fangTableHTML(nr)}`;
  } else {
    const via = m.evo.length ? `Entwicklung aus der Vorstufe` : `Nur über Entwicklung / Tausch`;
    panel = `<div class="chip" style="flex:1; display:flex; align-items:center; justify-content:center;">
      <div class="notwild"><div class="nw1">Nicht wild fangbar</div><div class="nw2">${via}</div></div>
    </div>`;
  }
  return `<div ${cardStyle(m)}><div class="frame"></div><div class="in">
    ${cardHeader(nr,'head')}
    <div class="artbox"><img src="${IMG(nr)}" referrerpolicy="no-referrer"></div>
    ${panel}
    ${cardFoot(nr)}
  </div></div>`;
}

  if(m.abil.surf) abilRows.push(['🌊','Surfen ab Lv 3']);

const CARD_MIRROR = [2,1,0, 5,4,3, 8,7,6];
function renderCards(){
  const host = document.getElementById('page-cards');
  const distMap = {};
  state.areas.forEach(a=>{ distMap[a.key] = computeAreaDistribution(monsInArea(a.key)); });

  const nrs = Object.keys(state.mons).map(Number).sort((a,b)=>a-b);
  let sheets = '';
  for(let b=0; b*9 < nrs.length; b++){
    const grp = nrs.slice(b*9, b*9+9);
    const fronts = grp.map(nr=>cardFront(nr, distMap)).join('');
    const backs = CARD_MIRROR.map(i => grp[i]!==undefined ? cardBack(grp[i]) : '<div class="card" style="background:none"></div>').join('');
    sheets += `<div class="sheet"><div class="grid">${fronts}</div><div class="sheetlab">Kanto Komplettset · Bogen ${b+1}/${Math.ceil(nrs.length/9)} · VORDERSEITEN</div></div>`;
    sheets += `<div class="sheet"><div class="grid">${backs}</div><div class="sheetlab">Kanto Komplettset · Bogen ${b+1}/${Math.ceil(nrs.length/9)} · RÜCKSEITEN (gespiegelt)</div></div>`;
  }

  host.innerHTML = `
    <div class="cards-toolbar noprint">
      <h1>Kartenset · alle 151 Pokémon</h1>
      <label><input type="checkbox" id="cutToggle" checked onchange="document.getElementById('page-cards').classList.toggle('nocut', !this.checked)"> Schnittlinien</label>

}

const SHOP_GEO = { ball:{perRow:5,rowH:35}, coin:{perRow:6,rowH:31}, item:{perRow:3,rowH:45}, event:{perRow:4,rowH:68} };
const SHOP_LABEL_H = 10, SHOP_PAGE_H = 250;

function paginateShop(groups, geo){
  const pages = []; let cur = [], used = 0;
  const newPage = ()=>{ if(cur.length){ pages.push(cur); } cur = []; used = 0; };
  groups.forEach(g=>{
    const rows = [];
    for(let i=0; i<g.items.length; i+=geo.perRow) rows.push(g.items.slice(i, i+geo.perRow));
    let labelPending = g.label;
    rows.forEach(row=>{
      const need = (labelPending ? SHOP_LABEL_H : 0) + geo.rowH;
      if(used + need > SHOP_PAGE_H){
        newPage();
        if(!labelPending) labelPending = g.label + ' <span class="count">Forts.</span>';
      }
      if(labelPending){ cur.push({type:'label', html:labelPending}); used += SHOP_LABEL_H; labelPending = null; }
      cur.push({type:'row', items:row}); used += geo.rowH;
    });
  });
  newPage();
  return pages;
}

function shopPageBody(page, side){
  return page.map(b=>{
    if(b.type==='label') return `<div class="group-label">${b.html}</div>`;
    const items = side==='back' ? [...b.items].reverse() : b.items;
    return `<div class="shoprow${side==='back'?' back':''}">${items.map(it=> side==='back' ? it.back : it.front).join('')}</div>`;
  }).join('');
}

function shopDuplex(groups, geoKey, title, small, subF, subB){
  const nonEmpty = groups.filter(g=>g.items.length);
  if(!nonEmpty.length) return '';
  const pages = paginateShop(nonEmpty, SHOP_GEO[geoKey]);
  let out = '';
  pages.forEach(p=>{
    out += sheetWrap(title, small, subF, 'front', shopPageBody(p,'front'));
    out += sheetWrap(title, small, subB, 'back',  shopPageBody(p,'back'));
  });
  return out;
}

  <div class="dchapter" id="d2"><h2>2. Spielablauf &amp; Bewegung</h2>

      steckt bereits in Begegnung (W20), Kampf (W6) und Fang (W6). Fester Vorrat, damit der Zug

      ab Lv 5 seinen Wert bekommt. Jede Stadt ist mit maximal 8 Feldern Ausdehnung in einer Runde

    <h3>Fortbewegung</h3>

      <li><b>Level wilder Pokémon = Zonenlevel</b> des Gebiets auf dem Spielbrett; gefangene Pokémon starten ebenfalls auf diesem Level.</li>
      <li>🪽 Fliegen ab Lv 5: Sprung zu jeder bereits besuchten Stadt.</li>
      <li>🪨 Zertrümmerer ab Lv 4 / 🗡 Zerschneider ab Lv 2: schalten blockierte Wegstellen frei (Gestein/Boden- bzw. Pflanzentyp).</li>
      <li>Graue Felder auf dem Brett sind dauerhaft gesperrt und formen die Engstellen; die Barriere im Durchlass sperrt nur ihr eigenes Feld und wird mit der passenden Fähigkeit bzw. der Pokéflöte geöffnet.</li>
      <li>Orden schalten weitere Routen/Städte frei (siehe Kapitel 9).</li>
    </ul>
    <h3>Kampfbeginn &amp; Wechsel (Beschluss 28.07.2026)</h3>
    <p>Zu Kampfbeginn wählt der Spieler frei, welches Pokémon antritt – so lassen sich auch untrainierte

    <p><b>Gratis-Wechsel:</b> Immer wenn der Gegner ein <b>neues Pokémon</b> einsetzt, darf der Spieler

    <h3>Duelle (Mix-Modus) &amp; Showmatch</h3>

  <div class="dchapter" id="d3"><h2>3. Pokémon finden &amp; fangen</h2>

    <h3>Ereignis bei W20 = 1 (Beschluss 27.07.2026)</h3>
    <p>Der Niete-Korridor bleibt leer – mit einer Ausnahme: Bei einer gewürfelten <b>1</b> wird
      <b>immer eine Ereigniskarte gezogen</b>. Kein zusätzlicher Wurf, keine Zwischentabelle.</p>
    <p>Der Stapel enthält Itemfunde (Superball, Hyperball, Trank, Supertrank, Beleber, Pokédollar),
